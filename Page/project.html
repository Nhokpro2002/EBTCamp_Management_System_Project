<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Page</title>

    <!-- DataTables-->
    <link href="../Libs/DataTables/datatables.min.css" rel="stylesheet">
    <script src="../Libs/DataTables/datatables.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- JQuery 4.0.0-->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Sweet Alert-->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../Libs/Bootstrap/css/bootstrap.min.css">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Tom Select-->
    <link href="../Libs/Tom-Select/tom-select.bootstrap5.css" rel="stylesheet">
    <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>

    <!-- Project Css-->
    <link href="../CSS/project.css" rel="stylesheet">

    <style>

    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-lg-2 p-4 sidebar sticky-top">
                <h3 class="fw-bold mb-5">
                    <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                </h3>

                <nav class="nav flex-column">
                    <a class="nav-link" href="http://127.0.0.1:5500/Page/dashboard.html" id="dashboard-link">
                        <i class="bi bi-house-door me-2"></i> Dashboard
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">
                        <i class="bi bi-box-seam me-2"></i> Inventory
                    </a>

                    <a class=" nav-link" href="#" id="order-link">
                        <i class="bi bi-cart me-2"></i> Order
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/setting.html" id="setting-link">
                        <i class="bi bi-gear me-2"></i> Setting
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                        <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                    </a>
                </nav>
            </div>

            <!-- Main -->
            <div class="col-lg-10 p-4">

                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <h3 class="fw-bold mb-0">Orders Page</h3>
                        <small class="text-muted">Welcome back, User👋</small>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button type="button" class="btn btn-light rounded-circle">
                            <i class="bi bi-bell"></i>
                        </button>

                        <div class="dropdown">
                            <img src="https://i.pravatar.cc/100" class="avatar dropdown-toggle"
                                data-bs-toggle="dropdown"
                                style="width:40px;height:40px;border-radius:50%;cursor:pointer" />

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" id="logoutLink" href="#">Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Content -->
                <div class="container-fluid" style="padding-left: 0px !important;">

                    <div class="project-switcher d-flex flex-column">

                        <!-- Hàng 1 -->
                        <div class="d-flex align-items-center" style="margin-right: 10px; gap: 5px">
                            <select id="projectSelect" class="form-select" style="width:400px">
                            </select>

                            <span id="project-status" class="ms-2"></span>
                        </div>

                        <!-- Hàng 2 -->
                        <div>
                            <hr style="margin-bottom: 1rem !important; margin-top: 0px !important;">

                            <div class="d-flex flex-wrap gap-2">

                                <button type="button" id="add-stage-button" class="btn btn-success">
                                    Add Stage
                                </button>

                                <button type="button" id="edit-project-button" class="btn btn-outline-primary">
                                    Edit Project
                                </button>

                                <button type="button" id="delete-project-button" class="btn btn-outline-danger">
                                    Delete Project
                                </button>

                                <button type="button" id="open-create-project-button" class="btn btn-outline-success">
                                    Add Project
                                </button>

                            </div>

                        </div>

                    </div>

                    <!-- Vùng giai đoạn của dự án-->

                    <div id="timeline-container">

                        <div class="stage-card">

                            <div class="stage-no">
                                01
                            </div>

                            <h5 class="stage-title">
                                Planning
                            </h5>

                            <hr style="margin: 0px  !important;">

                            <div class="stage-info">
                                <div class="label">Start Date</div>
                                <div class="value">01/05/2024</div>
                            </div>

                            <div class="stage-info">
                                <div class="label">End Date</div>
                                <div class="value">15/05/2024</div>
                            </div>

                            <div class="stage-info">
                                <div class="label">Status</div>
                                <span class="badge bg-success-subtle text-success">
                                    Completed
                                </span>
                            </div>
                        </div>

                        <div class="timeline-line line-blue"></div>

                    </div>

                    <!-- Vùng giai đoạn - workflow của dự án-->

                    <div class="row g-3" style="padding-top: 20px;">

                        <div class="container-fluid py-4">

                            <!-- Task Table -->
                            <div class="card shadow-sm">

                                <div class="card-header bg-white">

                                    <div class="d-flex justify-content-between align-items-center">

                                        <h5 class="mb-0">
                                            Tasks in this Stage
                                        </h5>

                                        <button type="button" class="btn btn-success btn-sm">
                                            Create Task
                                        </button>

                                    </div>

                                </div>

                                <div class="card-body p-0" style="overflow-x: auto;">

                                    <table class="table table-hover align-middle mb-0">

                                        <thead class="table-light">
                                            <tr>
                                                <th>Task Name</th>
                                                <th id="task-handler">Handler</th>
                                                <th>Status</th>
                                                <th>Percent</th>
                                                <th>Start Date</th>
                                                <th>End Date</th>
                                                <th width="120">Action</th>
                                            </tr>
                                        </thead>

                                        <tbody id="taskBody">

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>
            </div>
        </div>

        <!-- Form create new project-->
        <div id="overlay-create-project" class="overlay-create-project">
            <div class="popup-create-project">
                <h2>Create New Project</h2>

                <div class="form-group-create-project">
                    <label>Project Name</label>
                    <input type="text" id="project-name" placeholder="Enter project name" required>
                </div>

                <div class="form-group-create-project">
                    <label>Start Date</label>
                    <input type="date" id="start-date" required>
                </div>

                <div class="form-group-create-project">
                    <label>End Date</label>
                    <input type="date" id="end-date" required>
                </div>

                <div class="form-group-create-project">
                    <label>PIC</label>
                    <select id="pic" required></select>
                </div>

                <div class="form-group-create-project">
                    <label>Members</label>
                    <select id="members" multiple required></select>
                </div>

                <hr>

                <div class="form-actions-create-project">
                    <button type="button" id="submitCreateProject" class="btn bg-primary bg-gradient">
                        <i class="bi bi-check2-circle me-1"></i>
                        Create Project
                    </button>
                    <button type="button" id="closeCreateProject" class="btn bg-secondary bg-gradient">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Form create stage-->

        <div id="overlay-create-stage" class="overlay-create-stage">
            <div class="popup-create-stage">
                <h2>Create New Stage</h2>

                <div class="form-group-create-stage">
                    <label>Project</label>
                    <input type="text" id="stage-project-name" readonly>
                    <input type="hidden" id="stage-project-id">
                </div>

                <div class="form-group-create-stage">
                    <label>Stage Name</label>
                    <input type="text" id="stage-name-input" placeholder="Enter stage name" required>
                </div>

                <div class="form-group-create-project">
                    <label>Start Date</label>
                    <input type="date" id="stage-start-date-input" required>
                </div>

                <div class="form-group-create-project">
                    <label>End Date</label>
                    <input type="date" id="stage-end-date-input" required>
                </div>

                <div class="form-group-create-stage">
                    <label>Status</label>
                    <select id="stage-status-input" required>
                        <option value="Pending">Pending</option>
                        <option value="Processing">Processing</option>
                        <option value="Done">Done</option>
                    </select>
                </div>

                <hr>

                <div class="form-actions-create-stage">
                    <button type="button" id="submitCreateStage" class="btn bg-primary bg-gradient">
                        <i class="bi bi-check2-circle me-1"></i>
                        Create Stage
                    </button>

                    <button type="button" id="closeCreateStage" class="btn bg-secondary bg-gradient">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

<script type="module">

    import * as api from "../Script/services/generic.api.js";

    /* =====================================================
      Variables
      ===================================================== */
    const variableGlobal = {
        projectList: [],
        currentProjectID: null,
        stageListByProject: [],
        currentStageID: null,
        taskListByStage: [],
        currentTaskID: null,
        userMap: {}
    }

    /* =====================================================
       CONSTANTS
       ===================================================== */
    const COLLECTION_PROJECTS = "Projects";
    const COLLECTION_TASKS = "Tasks";
    const COLLECTION_USERS = "Users";
    const COLLECTION_STAGES = "Stages";
    const POCKETBASE_URL = "http://127.0.0.1:8090";

    /* Project */
    window.tomSelectInstances = window.tomSelectInstances || {};
    const overlayCreateProject = document.getElementById("overlay-create-project");
    const closeCreateProject = document.getElementById("closeCreateProject");
    const openCreateProjectBtn = document.getElementById("open-create-project-button");
    const submitCreateProject = document.getElementById("submitCreateProject");
    /* Project */


    /* Stage */
    const overlayCreateStage = document.getElementById("overlay-create-stage");
    /* Stage */


    $(document).ready(function () {

        if (!checkAuthentication()) return;

        document.querySelector(".container-fluid").style.display = "block";

        // window.alert(window.innerWidth + " x " + window.innerHeight);
        // Spec: 1528 * 732;

        const currentPage = window.location.pathname;

        if (currentPage.includes('dashboard')) {
            document.getElementById('dashboard-link').classList.add('active');
        } else if (currentPage.includes('order')) {
            document.getElementById('order-link').classList.add('active');
        } else if (currentPage.includes('user')) {
            document.getElementById('user-link').classList.add('active');
        } else if (currentPage.includes('setting')) {
            document.getElementById('setting-link').classList.add('active');
        } else if (currentPage.includes('project')) {
            document.getElementById('project-link').classList.add('active');
        }

        changeIconAvatar();

        changeTopbarText();

        async function init() {
            variableGlobal.projectList = await api.getRecords(COLLECTION_PROJECTS);

            renderProjectOptionList();
            initDefaultProject();

            if (variableGlobal.projectList.length !== 0) {
                loadProjectData(variableGlobal.projectList[0].id);
            }

            const users = await api.getRecords(COLLECTION_USERS);

            users.forEach(user => {
                variableGlobal.userMap[user.id] = user;
            });
        }

        init();

    });

    /* =========================================
            Check authentication
    ===========================================*/
    function checkAuthentication() {
        const token = localStorage.getItem("token");
        if (!token || token.trim() === "") {
            Swal.fire({
                icon: 'warning',
                title: 'Access Denied',
                text: 'You must log in to access this page',
                confirmButtonText: 'Go to Login'
            }).then(() => {
                window.location.href = "http://127.0.0.1:5500/Page/login.html"; // chuyển hướng sau khi user bấm OK
            });

            return false;
        }

        return true;
    }


    /* =========================================
        update, change UI when user interact on UI
    =============================================*/
    function changeIconAvatar() {
        const dropdownAvatar = document.querySelector('.dropdown img');
        const userData = JSON.parse(localStorage.getItem("user"));

        if (!dropdownAvatar || !userData) return;

        dropdownAvatar.src =
            `${POCKETBASE_URL}/api/files/${COLLECTION_USERS}/${userData.id}/${userData.avatar}?t=${Date.now()}`;
    }

    function changeTopbarText() {
        const topbarText = document.querySelector('.topbar .text-muted');
        const userData = JSON.parse(localStorage.getItem("user"));

        if (!topbarText || !userData) return;

        topbarText.textContent = `Welcome back, ${userData.employee_id} 👋`;
    }

    function renderProjectOptionList() {

        const select = document.getElementById("projectSelect");
        select.innerHTML = "";

        // add option mới từ API
        variableGlobal.projectList.forEach(project => {
            const option = document.createElement("option");
            option.value = project.id;
            option.textContent = project.name;
            select.appendChild(option);
        });

    }

    // function render stage link
    function renderStages(stageListByProject) {

        const workflow = document.getElementById("timeline-container");
        workflow.innerHTML = "";

        stageListByProject.forEach((stage, index) => {

            const linkLine = document.createElement("div");
            linkLine.classList.add("timeline-line");

            const div = document.createElement("div");
            div.setAttribute("data-id", stage.id);

            let borderClass = "border-secondary";
            let badgeClass = "bg-secondary text-white";
            let textClass = "text-secondary";
            let bgColor = "#f8f9fa";

            switch (stage.status) {

                case "Processing":
                    borderClass = "border-warning";
                    badgeClass = "bg-warning text-dark";
                    textClass = "text-warning";
                    bgColor = "#fff8e1";
                    linkLine.classList.add("bg-warning");
                    break;

                case "Done":
                    borderClass = "border-success";
                    badgeClass = "bg-success text-white";
                    textClass = "text-success";
                    bgColor = "#e8f5e9";
                    linkLine.classList.add("bg-success");
                    break;

                case "Pending":
                default:
                    borderClass = "border-secondary";
                    badgeClass = "bg-secondary text-white";
                    textClass = "text-secondary";
                    bgColor = "#f5f5f5";
                    linkLine.classList.add("bg-secondary");
                    break;
            }

            div.classList.add(
                "stage-card",
                "p-3",
                "rounded-3",
                "border",
                "border-2",
                borderClass
            );

            div.style.backgroundColor = bgColor;

            div.innerHTML = `
            <div class="d-flex align-items-center justify-content-between ${textClass}">
    
    <div class="display-6 fw-bold">
        <span>${index + 1}</span>
    </div>

    <div class="d-flex gap-1 d-none stage-actions">
        <button
            class="btn btn-sm btn-outline-primary btn-edit-stage"
            data-id="${stage.id}"
            title="Edit stage">
            <i class="bi bi-pencil"></i>
        </button>

        <button
            class="btn btn-sm btn-outline-danger btn-delete-stage"
            data-id="${stage.id}"
            title="Delete stage">
            <i class="bi bi-trash"></i>
        </button>

    </div>

</div>

            <h5 class="${textClass} mb-1 text-truncate" title="${stage.name}">
                   ${stage.name}
            </h5>

            <hr class="my-1">

            <div class="mb-1">
                <div class="text-muted small">
                    Start Date
                </div>

                <div class="fw-bold fs-5 text-dark">
                    ${formatDate(stage.start_date)}
                </div>
            </div>

            <div class="mb-1">
                <div class="text-muted small">
                    End Date
                </div>

                <div class="fw-bold fs-5 text-dark">
                    ${formatDate(stage.end_date)}
                </div>
            </div>

            <div>
                <div class="text-muted small mb-2">
                    Status
                </div>

                <span class="badge rounded-pill px-3 py-2 ${badgeClass}">
                    ${stage.status}
                </span>
            </div>
        `;

            workflow.appendChild(div);

            if (index < variableGlobal.stageListByProject.length - 1) {
                workflow.appendChild(linkLine);
            }
        });
    }

    function changeProjectStatusUI(status) {
        const el = document.getElementById("project-status");
        const map = {
            Done: {
                text: "Done",
                class: "bg-success"
            },
            Processing: {
                text: "Processing",
                class: "bg-warning text-dark"
            },
            Pending: {
                text: "Pending",
                class: "bg-secondary"
            }
        };

        const s = map[status] || map.pending;

        el.innerHTML = `
        <span class="badge ${s.class}">
            ${s.text}
        </span>
    `;
    }

    function initDefaultProject() {
        const first = variableGlobal.projectList[0];

        if (!first) return;

        document.getElementById("projectSelect").value = first.id;
        changeProjectStatusUI(first.status);
    }

    function renderTasks() {

        const tbody = document.getElementById("taskBody");

        if (!Array.isArray(variableGlobal.taskListByStage)) {
            console.error("taskListByStage not array");
            return;
        }

        tbody.innerHTML = variableGlobal.taskListByStage.map(task => {

            const handlers = task.handler || [];

            const avatarsHtml = handlers.map(handlerID => {

                const user = variableGlobal.userMap?.[handlerID];

                const avatarUrl = user?.avatar
                    ? `${POCKETBASE_URL}/api/files/${COLLECTION_USERS}/${user.id}/${user.avatar}`
                    : "https://i.pravatar.cc/40";

                return `
                <img
                    src="${avatarUrl}"
                    title="${user?.employee_id || ''}"
                    style="
                        width:28px;
                        height:28px;
                        border-radius:50%;
                        object-fit:cover;
                        border:2px solid white;
                        margin-left:-8px;
                    "
                />
            `;
            }).join('');

            return `
        <tr>
            <td class="task-name">${task.name}</td>
            <td class="task-handler">${avatarsHtml}</td>
            <td class="task-status">${getStatusBadge(task.status)}</td>
            <td class="task-percent">${task.percent}</td>
            <td class="task-start">${formatDate(task.start_date)}</td>
            <td class="task-end">${formatDate(task.end_date)}</td>
           <td class="task-action-button">
    <div class="d-flex gap-1">

        <button
           class="btn btn-sm btn-outline-primary btn-edit-task"
           data-id="${task.id}"
           title="Edit Task">
           <i class="bi bi-pencil"></i>
        </button>

        <button
            class="btn btn-sm btn-outline-info btn-view-more-task"
            data-id="${task.id}"
            title="View More">
            <i class="bi bi-eye"></i>
        </button>

        <button
            class="btn btn-sm btn-outline-success btn-save-task"
            data-id="${task.id}"
            title="Save">
            <i class="bi bi-floppy"></i>
        </button>

        <button
            class="btn btn-sm btn-outline-danger btn-delete-task"
            data-id="${task.id}"
            title="Delete Task">
            <i class="bi bi-trash"></i>
        </button>

    </div>
</td>
        </tr>
        `;
        }).join('');
    }

    function enableStageEditMode(stageId) {

        const stage = variableGlobal.stageListByProject.find(s => s.id == stageId);
        if (!stage) return;

        const card = document.querySelector(`[data-id="${stageId}"]`).closest(".stage-card");

        if (!card) return;

        card.innerHTML = `
        <div class="mb-2">
            <label class="text-muted small">Stage Name</label>
            <input class="form-control form-control-sm" id="stage-name" value="${stage.name}">
        </div>

        <div class="mb-2">
            <label class="text-muted small">Start Date</label>
            <input type="date" class="form-control form-control-sm" id="stage-start-date" value="${stage.start_date}">
        </div>

        <div class="mb-2">
            <label class="text-muted small">End Date</label>
            <input type="date" class="form-control form-control-sm" id="stage-end-date" value="${stage.end_date}">
        </div>

        <div class="mb-3">
            <label class="text-muted small">Status</label>
            <select class="form-select form-select-sm" id="stage-status">
                <option value="Pending" ${stage.status === "Pending" ? "selected" : ""}>Pending</option>
                <option value="Processing" ${stage.status === "Processing" ? "selected" : ""}>Processing</option>
                <option value="Done" ${stage.status === "Done" ? "selected" : ""}>Done</option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-success btn-save-stage">
                Save
            </button>

            <button type="button" class="btn btn-sm btn-secondary btn-return-stage">
                Cancel
            </button>
        </div>
    `;
    }

    function renderMembersSelect(type) {  // type: "pic", "members", "handler"
        const select = document.getElementById(type);
        if (!select) return;

        // Xoá option cũ
        select.innerHTML = "";

        // Thêm option từ users.items
        Object.values(variableGlobal.userMap).forEach(user => {
            const option = document.createElement("option");
            option.value = user.id;
            option.textContent = user.employee_id;
            select.appendChild(option);
        });

        // Nếu chưa có instance TomSelect cho select này thì tạo mới
        if (!window.tomSelectInstances[type]) {
            window.tomSelectInstances[type] = new TomSelect(`#${type}`, {
                plugins: ['remove_button'],
                hideSelected: true,
                create: false,
                placeholder: type === "pic" ? "Select PIC" :
                    type === "members" ? "Select Members" :
                        "Select Handler",
            });
        } else {
            // Nếu đã có instance thì refresh options
            window.tomSelectInstances[type].clearOptions();
            Object.values(variableGlobal.userMap).forEach(user => {
                window.tomSelectInstances[type].addOption({
                    value: user.id,
                    text: user.employee_id
                });
            });
            window.tomSelectInstances[type].refreshOptions(false);
        }
    }

    function enableTaskEditMode(tr, taskId) {

        const task = variableGlobal.taskListByStage.find(t => t.id === taskId);
        if (!task) return;

        // name
        tr.querySelector(".task-name").innerHTML =
            `<input class="form-control form-control-sm" value="${task.name}">`;

        // status
        tr.querySelector(".task-status").innerHTML = `
        <select class="form-select form-select-sm">
            <option ${task.status === "Done" ? "selected" : ""}>Done</option>
            <option ${task.status === "Processing" ? "selected" : ""}>Processing</option>
            <option ${task.status === "Problem" ? "selected" : ""}>Problem</option>
        </select>
    `;

        // percent
        tr.querySelector(".task-percent").innerHTML =
            `<input type="number" class="form-control form-control-sm" value="${task.percent}">`;

        // handler (MULTI SELECT)
        tr.querySelector(".task-handler").innerHTML = `
        <select id="handler-${task.id}" multiple placeholder="Select Handler"></select>
    `;

        // Error
        tr.querySelector(".task-start").innerHTML =
            `<input type="date" class="form-control form-control-sm" value="${formatDate(task.start_date)}">`;

        // Error
        tr.querySelector(".task-end").innerHTML =
            `<input type="date" class="form-control form-control-sm" value="${formatDate(task.end_date)}">`;

        // init TomSelect sau khi DOM đã render
        setTimeout(() => {

            const select = document.getElementById(`handler-${task.id}`);

            if (!select) return;

            // add options
            Object.values(variableGlobal.userMap).forEach(user => {
                const option = document.createElement("option");
                option.value = user.id;
                option.textContent = user.employee_id;

                // preselect nếu có
                if (task.handler?.includes(user.id)) {
                    option.selected = true;
                }

                select.appendChild(option);
            });

            // init TomSelect
            if (!window.tomSelectInstances) {
                window.tomSelectInstances = {};
            }

            if (window.tomSelectInstances[task.id]) {
                window.tomSelectInstances[task.id].destroy();
            }

            window.tomSelectInstances[task.id] = new TomSelect(select, {
                plugins: ['remove_button'],
                hideSelected: true,
                placeholder: "Select Handler"
            });
        }, 0);
    }

    function disableTaskEditMode(tr, taskId) {

        if (window.tomSelectInstances?.[taskId]) {
            window.tomSelectInstances[taskId].destroy();
            delete window.tomSelectInstances[taskId];
        }

        const task = variableGlobal.taskListByStage.find(t => t.id === taskId);
        if (!task) return;

        // name
        tr.querySelector(".task-name").textContent = task.name;

        // handler (nếu bạn không edit thì giữ nguyên hoặc render lại avatar)
        const handlers = task.handler || [];
        const avatarsHtml = handlers.map(handlerID => {

            const user = variableGlobal.userMap?.[handlerID];

            const avatarUrl = user?.avatar
                ? `${POCKETBASE_URL}/api/files/${COLLECTION_USERS}/${user.id}/${user.avatar}`
                : "https://i.pravatar.cc/40";

            return `
            <img
                src="${avatarUrl}"
                title="${user?.employee_id || ''}"
                style="
                    width:28px;
                    height:28px;
                    border-radius:50%;
                    object-fit:cover;
                    border:2px solid white;
                    margin-left:-8px;
                "
            />
        `;
        }).join('');

        tr.querySelector(".task-handler").innerHTML = avatarsHtml;

        // status
        tr.querySelector(".task-status").innerHTML = getStatusBadge(task.status);

        // percent
        tr.querySelector(".task-percent").textContent = task.percent;

        // start date
        tr.querySelector(".task-start").textContent = formatDate(task.start_date);

        // end date
        tr.querySelector(".task-end").textContent = formatDate(task.end_date);

        // remove edit mode class (nếu có)
        tr.classList.remove("editing");
    }

    function getStatusBadge(status) {

        switch (status) {

            case "Done":
                return `<span class="badge bg-success badge-status">${status}</span>`;

            case "Processing":
                return `<span class="badge bg-warning badge-status">${status}</span>`;

            case "Problem":
                return `<span class="badge bg-danger badge-status">${status}</span>`;

            default:
                return `<span class="badge bg-secondary badge-status">${status}</span>`;
        }
    }

    function closeCreateProjectPopup() {

        document.body.style.overflow = "auto";
        resetCreateProjectForm();

        overlayCreateProject.style.display = "flex";

    function closeCreateStagePopup() {

    function resetCreateProjectForm() {

        // reset input text + date
        document.getElementById("project-name").value = "";
        document.getElementById("start-date").value = "";
        document.getElementById("end-date").value = "";

        // reset select DOM (quan trọng để tránh duplicate option)

    async function loadProjectData(projectID) {
        const project = variableGlobal.projectList.find(p => p.id == projectID);

        variableGlobal.currentProjectID = projectID;

        document.getElementById("projectSelect").value = projectID;

    /* =========================================
            Catch event when user interact on UI
     ===========================================*/
    openCreateProjectBtn?.addEventListener("click", openCreateProjectPopup);

    closeCreateProject?.addEventListener("click", closeCreateProjectPopup);

    document.getElementById("projectSelect").addEventListener("change", async function (e) {
        await loadProjectData(e.target.value);

    // Push save button event
    document.getElementById("taskBody").addEventListener("click", async function (e) {

        const saveButton = e.target.closest(".btn-save-task");
        if (!saveButton) return;

        const tr = saveButton.closest("tr");
        const taskID = saveButton.dataset.id;

        const nameInput = tr.querySelector(".task-name input");
        const statusSelect = tr.querySelector(".task-status select");
        const percentInput = tr.querySelector(".task-percent input");
        const handlerSelect = window.tomSelectInstances?.[taskID];
        const startInput = tr.querySelector(".task-start input");
        const endInput = tr.querySelector(".task-end input");

        const updatedTaskData = {
            name: nameInput.value,
            status: statusSelect.value,
            percent: Number(percentInput.value),
            handler: handlerSelect ? handlerSelect.getValue() : [],
            start_date: startInput.value,
            end_date: endInput.value
        };

        const resultResponse = await api.updateRecord(COLLECTION_TASKS, taskID, updatedTaskData);
    });

    // Push edit button event
    document.getElementById("taskBody").addEventListener("click", function (e) {

        const editButton = e.target.closest(".btn-edit-task");
        if (!editButton) return;

        editButton.classList.toggle("active");

        const isActive = editButton.classList.contains("active");

        const taskId = editButton.dataset.id;
        const tr = editButton.closest("tr");

        if (isActive) {
            enableTaskEditMode(tr, taskId);
        } else {
            disableTaskEditMode(tr, taskId);
        }
    });

    document.querySelectorAll('.menu-link').forEach(item => {
        item.addEventListener('click', function () {

    submitCreateProject.addEventListener("click", async () => {

        // ===== 1. Get input values from form =====
        const projectName = document.getElementById("project-name").value.trim();
        const startDate = document.getElementById("start-date").value;
        const endDate = document.getElementById("end-date").value;
        const pic = document.getElementById("pic").value;



        // Multiple select -> convert to array
        const members = Array.from(
            document.getElementById("members").selectedOptions
        ).map(o => o.value);

        const status = "Pending";

        // ===== 2. Basic validation =====
        if (!projectName || !startDate || !endDate || !pic || members.length == 0) {
            Toast.fire({ icon: 'warning', title: 'Please fill all fields' });
            return;
        }

        const newProjectData = {
            name: projectName,
            start_date: startDate,
            end_date: endDate,
            pic: pic,
            members: members,
            status: "Pending"

        }

        // Call api to save new project
        const resultRespone = await api.createRecord(COLLECTION_PROJECTS, newProjectData);
        variableGlobal.projectList.push(resultRespone);
        loadProjectData(resultRespone.id);
    });

    document.getElementById("delete-project-button")
        .addEventListener("click", async function () {

            const select = document.getElementById("projectSelect");

            const projectID = select.value;

            if (!projectID) {
                Swal.fire({
                    icon: "warning",
                    title: "No project selected"
                });
                return;
            }

            const confirm = await Swal.fire({
                icon: "warning",
                title: "Delete this project?",
                text: "This action cannot be undone",
                showCancelButton: true,
                confirmButtonText: "Delete",
                cancelButtonText: "Cancel",
                confirmButtonColor: '#d33'
            });

            if (!confirm.isConfirmed) return;

            const success = await api.deleteRecord(COLLECTION_PROJECTS, projectID);

            if (!success) return;

            Swal.fire({
                icon: "success",
                title: "Project deleted"
            });

            // =========================
            // 1. tìm index trong state
            // =========================
            const index = variableGlobal.projectList.findIndex(p => p.id === projectID);

            if (index === -1) return;

            // =========================
            // 2. xóa khỏi state
            // =========================
            variableGlobal.projectList.splice(index, 1);

            // =========================
            // 3. xóa option khỏi UI
            // =========================
            const option = select.querySelector(`option[value="${projectID}"]`);
            if (option) option.remove();

            // =========================
            // 4. chọn project tiếp theo theo logic mảng
            // =========================
            let nextProject = null;

            if (variableGlobal.projectList.length === 0) {
                // không còn project
                select.value = "";
                document.getElementById("project-status").innerHTML = "";
                document.getElementById("taskBody").innerHTML = "";
                return;
            }

            // nếu xóa phần tử cuối → lấy phần tử trước nó
            if (index >= variableGlobal.projectList.length) {
                nextProject = variableGlobal.projectList[variableGlobal.projectList.length - 1];
            } else {
                // lấy phần tử tại index (vì sau splice nó đã shift lên)
                nextProject = variableGlobal.projectList[index];
            }

            // =========================
            // 5. update UI
            // =========================
            select.value = nextProject.id;

            select.dispatchEvent(new Event("change"));
        });

        const card = e.target.closest(".stage-card");
        if (!card) return;

        const stageID = card.getAttribute("data-id");

        document.querySelectorAll(".stage-card").forEach(el => {

    document.getElementById("timeline-container").addEventListener("click", async function (e) {

        const card = e.target.closest(".stage-card");
        if (!card) return;

        const stageID = card.getAttribute("data-id");

        // EDIT
        if (e.target.closest(".btn-edit-stage")) {
            enableStageEditMode(stageID);
            return;
        }

        // DELETE
        // TODO: handle delete stage, call API then delete it in variableGlobal.projectList

        if (e.target.closest(".btn-delete-stage")) {

            const result = await Swal.fire({
                icon: 'warning',
                title: 'Delete stage?',
                text: 'This action cannot be undone.',
                showCancelButton: true,
                confirmButtonText: 'Delete',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#d33'
            });

            if (!result.isConfirmed) {
                return;
            }

            const res = await api.deleteRecord(COLLECTION_STAGES, stageID);

            const index = variableGlobal.stageListByProject.findIndex(
                stage => stage.id == stageID
            );

            if (index !== -1) {
                variableGlobal.stageListByProject.splice(index, 1);
            }

            renderStages(variableGlobal.stageListByProject);

            await Swal.fire({
                icon: 'success',
                title: 'Stage deleted',
                timer: 1500,
                showConfirmButton: false
            });

            return;
        }

        // UPDATE
        // ! Update the value in the stage card to the value returned by the API,
        // ! then re-render the stage list.
        // ! It might need revision.
        if (e.target.closest(".btn-save-stage")) {

            const updatedStageData = {
                name: card.querySelector("#stage-name").value,
                start_date: card.querySelector("#stage-start-date-input").value,
                end_date: card.querySelector("#stage-end-date-input").value,
                status: card.querySelector("#stage-status-input").value
            };

            const apiRes = await api.updateRecord(COLLECTION_STAGES, stageID, updatedStageData);
            variableGlobal.stageListByProject.forEach(stage => {
                if (stage.id == apiRes.id) {
                    Object.assign(stage, apiRes);
                }
            })

            renderStages(variableGlobal.stageListByProject);

            return;
        }

        if (e.target.closest(".btn-return-stage")) {

            const btn = e.target.closest(".btn-return-stage");
            const stageId = btn.getAttribute("data-id");

            renderStages(variableGlobal.stageListByProject);

            return;
        }
    });

    /* ========================
        Helper Function
     =========================*/
    function formatDate(dateStr) {
        const d = new Date(dateStr);

        const day = String(d.getDate()).padStart(2, "0");
        const month = String(d.getMonth() + 1).padStart(2, "0");

        return `${day}/${month}`;
    }
