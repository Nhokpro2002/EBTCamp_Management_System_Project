<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>

    <!-- Bootstrap -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- Sweet Alert 2 -->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Tom Select -->
    <link href="../Libs/Tom-Select/tom-select.bootstrap5.css" rel="stylesheet">
    <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>

    <!-- JQuery -->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/project.css">
</head>

<body>
    <div class="wrapper">
        <!-- SIDEBAR: giữ nguyên cấu trúc hiện tại -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../Image/lg_display_logo_web.png" alt="LG Display">
            </div>

            <ul class="menu">
                <li><a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a></li>
                <li><a href="inventory.html"><i class="bi bi-box"></i> Inventory</a></li>
                <li><a href="order.html"><i class="bi bi-receipt"></i> Order</a></li>
                <li class="active"><a href="project.html"><i class="bi bi-kanban"></i> Project</a></li>
                <li>
                    <a href="notification.html">
                        <span class="notification-icon">
                            <i class="bi bi-bell"></i>
                            <span id="badge-count" class="badge rounded-pill bg-danger text-white d-none">0</span>
                        </span>
                        Notification
                    </a>
                </li>
                <li><a href="#"><i class="bi bi-gear"></i> Settings</a></li>
            </ul>

            <a class="sidebar-user sidebar-user-link" href="user.html" aria-label="Open user profile">
                <img class="sidebar-user-avatar" src="../Image/LG-Symbol.png" alt="User avatar">
                <span class="user-info">
                    <h6 class="user-name">User</h6>
                    <small class="user-role">Profile</small>
                </span>
            </a>
        </aside>


        <!-- MAIN CONTENT -->
        <main class="content">
            <div class="project-page">

                <div class="toolbar">
                    <button type="button" class="btn btn-create-project">
                        Add Project
                    </button>
                </div>

                <!-- Project grid: chỉ chứa các project card -->
                <section id="projectGrid" class="project-grid"></section>

                <!-- Empty state: nằm ngoài project grid -->
                <div id="emptyState" class="empty-state">
                    <i class="bi bi-search"></i>
                    <h5>Không tìm thấy dự án</h5>
                    <p>Thử tìm kiếm bằng một tên dự án khác.</p>
                </div>
                <ul id="pagination" class="pagination" aria-label="Project pages"></ul>

            </div>

            <!-- Detail modal: nằm ngoài project grid -->
            <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel"
                aria-hidden="true">

                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title" id="detailModalLabel">
                                Chi tiết dự án
                            </h5>

                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng">
                            </button>
                        </div>

                        <div class="modal-body">
                            <p id="detailProjectName" class="mb-0"></p>
                        </div>

                    </div>
                </div>
            </div>
        </main>


    </div>

    <!-- Create project popup -->
    <div id="overlay-create-project" class="overlay-create-project">
        <div class="popup-create-project">
            <h2>Create New Project</h2>

            <div class="form-group-create-project">
                <label for="project-name">Project Name</label>
                <input type="text" id="project-name" placeholder="Enter project name" required>
            </div>

            <div class="form-group-create-project">
                <label for="start-date">Start Date</label>
                <input type="date" id="start-date" required>
            </div>

            <div class="form-group-create-project">
                <label for="end-date">End Date</label>
                <input type="date" id="end-date" required>
            </div>

            <div class="form-group-create-project">
                <label for="pic">PIC</label>
                <select id="pic" required></select>
            </div>

            <div class="form-group-create-project">
                <label for="image-project">Project Image</label>
                <input type="file" id="image-project" accept="image/*">
            </div>

            <hr>

            <div class="form-actions-create-project">
                <button type="button" class="btn btn-save-project">
                    Create Project
                </button>
                <button type="button" class="btn btn-close-project-popup">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="../Script/project/project.js"></script>
    <script type="module" src="../Script/user/main.js"></script>
</body>

</html>
