<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap 5 Dashboard</title>

    <link href="../CSS/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/bootstrap.min.css.map" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="../Libs/DataTables/datatables.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="../Libs/DataTables/datatables.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #0d6efd, #0b5ed7);
            color: white;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.85);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .topbar {
            background: white;
            border-radius: 20px;
            padding: 16px 24px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }

        .project-switcher {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            width: fit-content;
        }

        .project-selector {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 0 12px;
            min-width: 420px;
            height: 52px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
        }

        .project-selector i {
            color: #2563eb;
            font-size: 22px;
            margin-right: 10px;
        }

        .project-select {
            width: 320px;
            border: none !important;
            border-radius: 12px;
            background: #fff;
            box-shadow:
                0 1px 2px rgba(0, 0, 0, .05),
                0 4px 12px rgba(0, 0, 0, .06);

            font-weight: 600;
            padding: 12px 16px;
            transition: all .2s ease;
        }

        .project-select:focus {
            border: none !important;
            outline: none !important;
            box-shadow:
                0 1px 2px rgba(0, 0, 0, .05),
                0 8px 24px rgba(37, 99, 235, .12);
            background: #fff;
        }

        /*.container-fluid {
               display: none;
          }*/
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-lg-2 p-4 sidebar">
                <h3 class="fw-bold mb-5">
                    <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                </h3>

                <nav class="nav flex-column">
                    <a class="nav-link" href="http://127.0.0.1:5500/Page/dashboard.html" id="dashboard-link">
                        <i class="bi bi-house-door me-2"></i> Dashboard
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">
                        <i class="bi bi-box-seam me-2"></i> Inventory
                    </a>

                    <a class=" nav-link" href="#" id="order-link">
                        <i class="bi bi-cart me-2"></i> Order
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/setting.html" id="setting-link">
                        <i class="bi bi-gear me-2"></i> Setting
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                        <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                    </a>
                </nav>
            </div>

            <!-- Main -->
            <div class="col-lg-10 p-4">

                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <h3 class="fw-bold mb-0">Orders Page</h3>
                        <small class="text-muted">Welcome back, User👋</small>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light rounded-circle">
                            <i class="bi bi-bell"></i>
                        </button>

                        <div class="dropdown">
                            <img src="https://i.pravatar.cc/100" class="avatar dropdown-toggle"
                                data-bs-toggle="dropdown"
                                style="width:40px;height:40px;border-radius:50%;cursor:pointer" />

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" id="logoutLink" href="#">Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Content -->
                <div class="container-fluid" style="padding-left: 0px !important;">

                    <div class="project-switcher">
                        <select class="form-select" style="width: 200px;">
                            <option value="1">One</option>
                            <option value="2">Two</option>
                            <option value="3">Three</option>
                        </select>
                        <span class="badge bg-success">
                            Đang thực hiện
                        </span>
                    </div>

                </div>
            </div>
        </div>
    </div>


</body>

<script>

    $(document).ready(function () {

        if (!checkAuthentication()) return;

        document.querySelector(".container-fluid").style.display = "block";

        // window.alert(window.innerWidth + " x " + window.innerHeight);
        // Spec: 1528 * 732;

        const currentPage = window.location.pathname;

        if (currentPage.includes('dashboard')) {
            document.getElementById('dashboard-link').classList.add('active');
        } else if (currentPage.includes('order')) {
            document.getElementById('order-link').classList.add('active');
        } else if (currentPage.includes('user')) {
            document.getElementById('user-link').classList.add('active');
        } else if (currentPage.includes('setting')) {
            document.getElementById('setting-link').classList.add('active');
        } else if (currentPage.includes('project')) {
            document.getElementById('project-link').classList.add('active');
        }

        changeIconAvatar();

        changeTopbarText();

    });

    document.querySelectorAll('.menu-link').forEach(item => {
        item.addEventListener('click', function () {
            document.querySelectorAll('.menu-link').forEach(el => {
                el.classList.remove('active');
            });

            this.classList.add('active');
        });
    });

    document.getElementById("logoutLink").addEventListener("click", function (e) {
        e.preventDefault(); // ngăn link reload trang
        // Xóa storage
        localStorage.clear();
        sessionStorage.clear();

        // Redirect về trang login hoặc homepage nếu muốn
        window.location.href = "http://127.0.0.1:5500/Page/login.html";
    });

    function checkAuthentication() {
        const token = localStorage.getItem("token");
        if (!token || token.trim() === "") {
            Swal.fire({
                icon: 'warning',      // icon của popup: 'warning', 'error', 'success', 'info', 'question'
                title: 'Access Denied',
                text: 'You must log in to access this page',
                confirmButtonText: 'Go to Login'
            }).then(() => {
                window.location.href = "http://127.0.0.1:5500/Page/login.html"; // chuyển hướng sau khi user bấm OK
            });

            return false;
        }

        return true;
    }

    function changeIconAvatar() {
        const dropdownAvatar = document.querySelector('.dropdown img');
        const userData = JSON.parse(localStorage.getItem("user"));

        if (!dropdownAvatar || !userData) return;

        dropdownAvatar.src =
            `${POCKETBASE_URL}/api/files/${COLLECTION_USERS}/${userData.id}/${userData.avatar}?t=${Date.now()}`;
    }

    function changeTopbarText() {
        const topbarText = document.querySelector('.topbar .text-muted');
        const userData = JSON.parse(localStorage.getItem("user"));

        if (!topbarText || !userData) return;

        topbarText.textContent = `Welcome back, ${userData.employee_id} 👋`;
    }


</script>

</html>
