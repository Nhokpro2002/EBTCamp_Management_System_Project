<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project</title>

    <!-- Bootstrap -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- Sweet Alert 2 -->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Sweet Alert 2 -->
    <link href="../Libs/Tom-Select/tom-select.bootstrap5.css" rel="stylesheet">
    <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>

    <!-- JQuery -->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/project.css">
</head>

<body>

    <div class="wrapper">

        <!-- ===========================
                SIDEBAR
        ============================ -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../Image/lg_display_logo_web.png" alt="Logo LG">
            </div>

            <ul class="menu">
                <li>
                    <a href="#">
                        <i class="bi bi-grid"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="inventory.html">
                        <i class="bi bi-box"></i>
                        Inventory
                    </a>
                </li>

                <li>
                    <a href="order.html">
                        <i class="bi bi-receipt"></i>
                        Order
                    </a>
                </li>

                <li class="active">
                    <a href="#">
                        <i class="bi bi-kanban"></i>
                        Project
                    </a>
                </li>

                <li>
                    <a href="user.html">
                        <i class="bi bi-people"></i>
                        User
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-bar-chart"></i>
                        Reports
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-gear"></i>
                        Settings
                    </a>
                </li>
            </ul>

            <div class="sidebar-user">
                <img src="https://i.pravatar.cc/80?img=12">
                <div>
                    <small>Engineer</small>
                </div>
            </div>
        </aside>

        <!-- ===========================
                CONTENT
        ============================ -->
        <main class="content">

            <div class="project-card">

                <div class="toolbar">
                    <div class="toolbar-left">
                        <div class="search-box">
                            <i class="bi bi-search"></i>
                            <input type="text" id="searchInput" placeholder="Search projects...">
                        </div>

                        <select id="statusFilter" class="form-select status-filter">
                            <option value="all">All Status</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Not Started">Not Started</option>
                        </select>
                    </div>

                    <button class="btn btn-create-project bg-primary">
                        <i class="bi bi-plus-lg"></i>
                        Add Project
                    </button>

                </div>


                <!-- Table -->

                <div class="table-responsive">
                    <table class="table align-middle project-table">
                        <thead>
                            <tr>
                                <th>Project Name</th>
                                <th>Start Date</th>
                                <th>End Date</th>
                                <th style="width:220px">Progress</th>
                                <th>Status</th>
                                <th width="80">Action</th>
                            </tr>
                        </thead>

                        <tbody id="projectTableBody">
                            <tr>
                                <td>
                                    <i class="bi bi-building me-2"></i>
                                    <span>LG Factory Upgrade</span>
                                </td>
                                <td>15/04/2025</td>
                                <td>15/08/2025</td>
                                <td>
                                    <div class="progress-number">
                                        75%
                                    </div>
                                    <div class="progress">
                                        <div class="progress-bar bg-danger" style="width:75%">
                                        </div>
                                    </div>
                                </td>

                                <td>
                                    <span class="status status-progress">
                                        In Progress
                                    </span>
                                </td>

                                <td>

                                    <button class="action-btn">
                                        <i class="bi bi-three-dots-vertical"></i>
                                    </button>

                                </td>

                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>


    <div class="table-footer">
        <div class="pagination">
            <nav>
                <ul class="pagination pagination-custom" id="pagination">
                    <!-- JS render -->
                </ul>
            </nav>
        </div>
    </div>


    <div id="overlay-create-project" class="overlay-create-project">
        <div class="popup-create-project">
            <h2>Create New Project</h2>

            <div class="form-group-create-project">
                <label>Project Name</label>
                <input type="text" id="project-name" placeholder="Enter project name" required>
            </div>

            <div class="form-group-create-project">
                <label>Start Date</label>
                <input type="date" id="start-date" required>
            </div>

            <div class="form-group-create-project">
                <label>End Date</label>
                <input type="date" id="end-date" required>
            </div>

            <div class="form-group-create-project">
                <label>PIC</label>
                <select id="pic" required></select>
            </div>

            <div class="form-group-create-project">
                <label>Members</label>
                <select id="members" multiple required></select>
            </div>

            <hr>

            <div class="form-actions-create-project">
                <button type="button" class="btn bg-primary bg-gradient btn-save-project">
                    <i class="bi bi-check2-circle me-1"></i>
                    Create Project
                </button>
                <button type="button" class="btn bg-secondary bg-gradient btn-close-project-popup">
                    Cancel
                </button>
            </div>
        </div>
    </div>



</body>

<script type="module" src="../Script/project/project.js"></script>

</html>
