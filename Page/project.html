<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Page</title>

    <!-- DataTables-->
    <link href="../Libs/DataTables/datatables.min.css" rel="stylesheet">
    <script src="../Libs/DataTables/datatables.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- JQuery 4.0.0-->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Sweet Alert-->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../Libs/Bootstrap/css/bootstrap.min.css">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Tom Select-->
    <link href="../Libs/Tom-Select/tom-select.bootstrap5.css" rel="stylesheet">
    <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>

    <!-- Project Css-->
    <link href="../CSS/project.css" rel="stylesheet">

    <style>

    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-lg-2 p-4 sidebar sticky-top">
                <h3 class="fw-bold mb-5">
                    <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                </h3>

                <nav class="nav flex-column">
                    <a class="nav-link" href="http://127.0.0.1:5500/Page/dashboard.html" id="dashboard-link">
                        <i class="bi bi-house-door me-2"></i> Dashboard
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">
                        <i class="bi bi-box-seam me-2"></i> Inventory
                    </a>

                    <a class=" nav-link" href="#" id="order-link">
                        <i class="bi bi-cart me-2"></i> Order
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/setting.html" id="setting-link">
                        <i class="bi bi-gear me-2"></i> Setting
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                        <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                    </a>
                </nav>
            </div>

            <!-- Main -->
            <div class="col-lg-10 p-4">

                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <h3 class="fw-bold mb-0">Orders Page</h3>
                        <small class="text-muted">Welcome back, User👋</small>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button type="button" class="btn btn-light rounded-circle">
                            <i class="bi bi-bell"></i>
                        </button>

                        <div class="dropdown">
                            <img src="https://i.pravatar.cc/100" class="avatar dropdown-toggle"
                                data-bs-toggle="dropdown"
                                style="width:40px;height:40px;border-radius:50%;cursor:pointer" />

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" id="logoutLink" href="#">Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Content -->
                <div class="container-fluid" style="padding-left: 0px !important;">

                    <div class="project-switcher d-flex flex-column">

                        <!-- Hàng 1 -->
                        <div class="d-flex align-items-center" style="margin-right: 10px; gap: 5px">
                            <select id="projectSelect" class="form-select" style="width:400px">
                            </select>

                            <span id="project-status" class="ms-2"></span>
                        </div>

                        <!-- Hàng 2 -->
                        <div>
                            <hr style="margin-bottom: 1rem !important; margin-top: 0px !important;">

                            <div class="d-flex flex-wrap gap-2">

                                <button type="button" id="add-stage-button" class="btn btn-success">
                                    Add Stage
                                </button>

                                <button type="button" id="edit-project-button" class="btn btn-outline-primary">
                                    Edit Project
                                </button>

                                <button type="button" id="delete-project-button" class="btn btn-outline-danger">
                                    Delete Project
                                </button>

                                <button type="button" id="open-create-project-button" class="btn btn-outline-success">
                                    Add Project
                                </button>

                            </div>

                        </div>

                    </div>

                    <!-- Vùng giai đoạn của dự án-->

                    <div id="timeline-container">

                        <div class="stage-card">

                            <div class="stage-no">
                                01
                            </div>

                            <h5 class="stage-title">
                                Planning
                            </h5>

                            <hr style="margin: 0px  !important;">

                            <div class="stage-info">
                                <div class="label">Start Date</div>
                                <div class="value">01/05/2024</div>
                            </div>

                            <div class="stage-info">
                                <div class="label">End Date</div>
                                <div class="value">15/05/2024</div>
                            </div>

                            <div class="stage-info">
                                <div class="label">Status</div>
                                <span class="badge bg-success-subtle text-success">
                                    Completed
                                </span>
                            </div>
                        </div>

                        <div class="timeline-line line-blue"></div>

                    </div>

                    <!-- Vùng giai đoạn - workflow của dự án-->

                    <div class="row g-3" style="padding-top: 20px;">

                        <div class="container-fluid py-4">

                            <!-- Task Table -->
                            <div class="card shadow-sm">

                                <div class="card-header bg-white">

                                    <div class="d-flex justify-content-between align-items-center">

                                        <h5 class="mb-0">
                                            Tasks in this Stage
                                        </h5>

                                        <button type="button" class="btn btn-success btn-sm">
                                            Create Task
                                        </button>

                                    </div>

                                </div>

                                <div class="card-body p-0" style="overflow-x: auto;">

                                    <table class="table table-hover align-middle mb-0">

                                        <thead class="table-light">
                                            <tr>
                                                <th>Task Name</th>
                                                <th id="task-handler">Handler</th>
                                                <th>Status</th>
                                                <th>Percent</th>
                                                <th>Start Date</th>
                                                <th>End Date</th>
                                                <th width="120">Action</th>
                                            </tr>
                                        </thead>

                                        <tbody id="taskBody">

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>
            </div>
        </div>

        <!-- Form create new project-->
        <div id="overlay-create-project" class="overlay-create-project">
            <div class="popup-create-project">
                <h2>Create New Project</h2>

                <div class="form-group-create-project">
                    <label>Project Name</label>
                    <input type="text" id="project-name" placeholder="Enter project name" required>
                </div>

                <div class="form-group-create-project">
                    <label>Start Date</label>
                    <input type="date" id="start-date" required>
                </div>

                <div class="form-group-create-project">
                    <label>End Date</label>
                    <input type="date" id="end-date" required>
                </div>

                <div class="form-group-create-project">
                    <label>PIC</label>
                    <select id="pic" required></select>
                </div>

                <div class="form-group-create-project">
                    <label>Members</label>
                    <select id="members" multiple required></select>
                </div>

                <hr>

                <div class="form-actions-create-project">
                    <button type="button" id="button-submit-create-project" class="btn bg-primary bg-gradient">
                        <i class="bi bi-check2-circle me-1"></i>
                        Create Project
                    </button>
                    <button type="button" id="closeCreateProject" class="btn bg-secondary bg-gradient">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Form create stage-->

        <div id="overlay-create-stage" class="overlay-create-stage">
            <div class="popup-create-stage">
                <h2>Create New Stage</h2>

                <div class="form-group-create-stage">
                    <label>Project</label>
                    <input type="text" id="stage-project-name" readonly>
                    <input type="hidden" id="stage-project-id">
                </div>

                <div class="form-group-create-stage">
                    <label>Stage Name</label>
                    <input type="text" id="stage-name-input" placeholder="Enter stage name" required>
                </div>

                <div class="form-group-create-project">
                    <label>Start Date</label>
                    <input type="date" id="stage-start-date-input" required>
                </div>

                <div class="form-group-create-project">
                    <label>End Date</label>
                    <input type="date" id="stage-end-date-input" required>
                </div>

                <div class="form-group-create-stage">
                    <label>Status</label>
                    <select id="stage-status-input" required>
                        <option value="Pending">Pending</option>
                        <option value="Processing">Processing</option>
                        <option value="Done">Done</option>
                    </select>
                </div>

                <hr>

                <div class="form-actions-create-stage">
                    <button type="button" id="submitCreateStage" class="btn bg-primary bg-gradient">
                        <i class="bi bi-check2-circle me-1"></i>
                        Create Stage
                    </button>

                    <button type="button" id="closeCreateStage" class="btn bg-secondary bg-gradient">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

<script type="module">

    import * as api from "../Script/services/generic.api.js";
    import * as ui from "../Script/project/project.ui.js";
    import * as handleEvent from "../Script/project/project.handle.event.js";

    /* =====================================================
      Variables
      ===================================================== */
    const variableGlobal = {
        projectList: [],
        currentProjectID: null,
        stageListByProject: [],
        currentStageID: null,
        taskListByStage: [],
        currentTaskID: null,
        userMap: {}
    }

    const COLLECTION_PROJECTS = "projects";
    const COLLECTION_STAGES = "stages";
    const COLLECTION_TASKS = "tasks";
    const COLLECTION_USERS = "users";



    /* Project */
    window.tomSelectInstances = window.tomSelectInstances || {};
    const overlayCreateProject = document.getElementById("overlay-create-project");
    const closeCreateProject = document.getElementById("closeCreateProject");
    const openCreateProjectBtn = document.getElementById("open-create-project-button");
    /* Project */


    /* Stage */
    const overlayCreateStage = document.getElementById("overlay-create-stage");
    /* Stage */


    $(document).ready(function () {

        if (!checkAuthentication()) return;

        document.querySelector(".container-fluid").style.display = "block";

        // window.alert(window.innerWidth + " x " + window.innerHeight);
        // Spec: 1528 * 732;

        const currentPage = window.location.pathname;

        if (currentPage.includes('dashboard')) {
            document.getElementById('dashboard-link').classList.add('active');
        } else if (currentPage.includes('order')) {
            document.getElementById('order-link').classList.add('active');
        } else if (currentPage.includes('user')) {
            document.getElementById('user-link').classList.add('active');
        } else if (currentPage.includes('setting')) {
            document.getElementById('setting-link').classList.add('active');
        } else if (currentPage.includes('project')) {
            document.getElementById('project-link').classList.add('active');
        }

        ui.changeIconAvatar();

        ui.changeTopbarText();

        async function init() {
            variableGlobal.projectList = await api.getRecords(COLLECTION_PROJECTS);

            ui.renderProjectOptionList();
            initDefaultProject();

            if (variableGlobal.projectList.length !== 0) {
                loadProjectData(variableGlobal.projectList[0].id);
            }

            const users = await api.getRecords(COLLECTION_USERS);

            users.forEach(user => {
                variableGlobal.userMap[user.id] = user;
            });
        }

        init();

    });

    /* =========================================
            Check authentication
    ===========================================*/
    function checkAuthentication() {
        const token = localStorage.getItem("token");
        if (!token || token.trim() === "") {
            Swal.fire({
                icon: 'warning',
                title: 'Access Denied',
                text: 'You must log in to access this page',
                confirmButtonText: 'Go to Login'
            }).then(() => {
                window.location.href = "http://127.0.0.1:5500/Page/login.html"; // chuyển hướng sau khi user bấm OK
            });

            return false;
        }

        return true;
    }


    /* =========================================
        update, change UI when user interact on UI
    =============================================*/

    function initDefaultProject() {
        const first = variableGlobal.projectList[0];

        if (!first) return;

        document.getElementById("projectSelect").value = first.id;
        ui.changeProjectStatusUI(first.status);
    }

    function getStatusBadge(status) {

        switch (status) {

            case "Done":
                return `<span class="badge bg-success badge-status">${status}</span>`;

            case "Processing":
                return `<span class="badge bg-warning badge-status">${status}</span>`;

            case "Problem":
                return `<span class="badge bg-danger badge-status">${status}</span>`;

            default:
                return `<span class="badge bg-secondary badge-status">${status}</span>`;
        }
    }

    function closeCreateProjectPopup() {
        overlayCreateProject.style.display = "none";
        document.body.style.overflow = "auto";
        resetCreateProjectForm();
    }

    function openCreateProjectPopup() {
        overlayCreateProject.style.display = "flex";
        document.body.style.overflow = "hidden";
        ui.renderMembersSelect("pic");
        ui.renderMembersSelect("members");
    }

    function openCreateStagePopup() {
        overlayCreateStage.style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    function closeCreateStagePopup() {
        overlayCreateStage.style.display = "none";
        document.body.style.overflow = "auto";
    }

    function resetCreateProjectForm() {

        // reset input text + date
        document.getElementById("project-name").value = "";
        document.getElementById("start-date").value = "";
        document.getElementById("end-date").value = "";

        // reset select DOM (quan trọng để tránh duplicate option)
        document.getElementById("pic").innerHTML = "";
        document.getElementById("members").innerHTML = "";

        // reset TomSelect state
        window.tomSelectInstances?.pic?.clear(true);
        window.tomSelectInstances?.members?.clear(true);
    }

    async function loadProjectData(projectID) {
        const project = variableGlobal.projectList.find(p => p.id == projectID);
        if (!project) return;

        variableGlobal.currentProjectID = projectID;

        document.getElementById("projectSelect").value = projectID;

        ui.changeProjectStatusUI(project.status);

        variableGlobal.stageListByProject = await api.getRecordsFilter(COLLECTION_STAGES, "project", projectID);

        ui.renderStages(variableGlobal.stageListByProject);
    }
    /* =========================================
            Catch event when user interact on UI
     ===========================================*/
    openCreateProjectBtn?.addEventListener("click", openCreateProjectPopup);

    closeCreateProject?.addEventListener("click", closeCreateProjectPopup);

    document.getElementById("projectSelect").addEventListener("change", async function (e) {
        await loadProjectData(e.target.value);
    });

    $("#logoutLink").on("click", function (e) {
        e.preventDefault();
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "http://127.0.0.1:5500/Page/login.html";
    });

    $("#taskBody").on("click", handleEvent.handleTaskActions);

    $("#button-submit-create-project").on("click", handleEvent.handleSubmitFormCreateProject);

    $("#delete-project-button").on("click", handleEvent.handleDeleteProject);

    $("#timeline-container")
        .on("click", ".btn-edit-stage", handleEvent.handleEditStage)
        .on("click", ".btn-delete-stage", handleEvent.handleDeleteStage)
        .on("click", ".btn-save-stage", handleEvent.handleSaveStage)
        .on("click", ".btn-return-stage", handleEvent.handleCancelEditStage);

    $("#timeline-container").on("click", ".stage-card", handleEvent.handleStageClick);

    $("#add-stage-button").on("click", async function (e) {
        // ===== 1. Get input values from form =====
        const stageName = $("#stage-name-input").val().trim();
        const startDate = $("#start-date").val();
        const endDate = $("#end-date").val();

    });

    document.querySelectorAll('.menu-link').forEach(item => {
        item.addEventListener('click', function () {
            document.querySelectorAll('.menu-link').forEach(el => {
                el.classList.remove('active');
            });

            this.classList.add('active');
        });
    });


</script>


</html>
