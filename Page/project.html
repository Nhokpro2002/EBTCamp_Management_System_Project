<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project</title>

    <!-- Bootstrap -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/inventory.css">

    <!-- Sweet Alert 2 -->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- JQuery -->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>
</head>

<body>

    <div class="wrapper">

        <!-- ===========================
                SIDEBAR
        ============================ -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../Image/lg_display_logo_web.png" alt="Logo LG">
            </div>

            <ul class="menu">
                <li>
                    <a href="#">
                        <i class="bi bi-grid"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="inventory.html">
                        <i class="bi bi-box"></i>
                        Inventory
                    </a>
                </li>

                <li>
                    <a href="order.html">
                        <i class="bi bi-receipt"></i>
                        Order
                    </a>
                </li>

                <li class="active">
                    <a href="#">
                        <i class="bi bi-kanban"></i>
                        Project
                    </a>
                </li>

                <li>
                    <a href="user.html">
                        <i class="bi bi-people"></i>
                        User
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-bar-chart"></i>
                        Reports
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-gear"></i>
                        Settings
                    </a>
                </li>
            </ul>

            <div class="sidebar-user">
                <img src="https://i.pravatar.cc/80?img=12">
                <div>
                    <small>Engineer</small>
                </div>
            </div>
        </aside>

        <!-- ===========================
                CONTENT
        ============================ -->
        <main class="content">

            <div class="project-card">

                <div class="toolbar">
                    <div class="toolbar-left">
                        <div class="search-box">
                            <i class="bi bi-search"></i>
                            <input type="text" placeholder="Search projects...">
                        </div>

                        <select class="form-select status-filter">
                            <option value="">All Status</option>
                            <option value="Planning">Planning</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>

                    <button class="btn btn-add-project bg-primary">
                        <i class="bi bi-plus-lg"></i>
                        Add Project
                    </button>
                </div>


                <!-- Table -->

                <div class="table-responsive">
                    <table class="table align-middle project-table">
                        <thead>
                            <tr>
                                <th>Project Name</th>
                                <th>Start Date</th>
                                <th>End Date</th>
                                <th style="width:220px">Progress</th>
                                <th>Status</th>
                                <th width="80">Action</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>
                                    <i class="bi bi-building me-2"></i>
                                    <span>LG Factory Upgrade</span>
                                </td>
                                <td>15/04/2025</td>
                                <td>15/08/2025</td>
                                <td>
                                    <div class="progress-number">
                                        75%
                                    </div>
                                    <div class="progress">
                                        <div class="progress-bar bg-danger" style="width:75%">
                                        </div>
                                    </div>
                                </td>

                                <td>
                                    <span class="status status-progress">
                                        In Progress
                                    </span>
                                </td>

                                <td>

                                    <button class="action-btn">
                                        <i class="bi bi-three-dots-vertical"></i>
                                    </button>

                                </td>

                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>


    <div class="table-footer">

        <span>
            Showing 1 to 5 of 5 projects
        </span>

        <div class="pagination">

            <button>
                <i class="bi bi-chevron-left"></i>
            </button>

            <button class="active">
                1
            </button>

            <button>
                <i class="bi bi-chevron-right"></i>
            </button>

        </div>

    </div>

    </div>

    </main>

    </div>



</body>

<script type="module" src="../Script/project/project.js"></script>

</html>
