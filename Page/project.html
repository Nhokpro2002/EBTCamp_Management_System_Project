<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Page</title>

    <!-- DataTables-->
    <link href="../Libs/DataTables/datatables.min.css" rel="stylesheet">
    <script src="../Libs/DataTables/datatables.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- JQuery 4.0.0-->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Sweet Alert-->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../Libs/Bootstrap/css/bootstrap.min.css">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- JsPlumb -->
    <link href="../Libs/JsPlumb/jsplumb.css">
    <script src="../Libs/JsPlumb/jsplumb.min.js"></script>

    <!-- Project Css-->
    <link href="../CSS/project.css" rel="stylesheet">


    <style>
        #canvas {
            width: 100%;
            height: 700px;
            border: 1px solid #ddd;
            position: relative;
            background: #fafafa;
            overflow: auto;
        }

        .controls {
            margin-bottom: 10px;
        }

        button {
            padding: 8px 12px;
            margin-right: 10px;
        }

        .project-card {
            width: 185px !important;
            border-width: 2px !important;
            border-radius: 15px;
        }

        .card {
            --bs-card-spacer-y: 0.5rem !important;
            --bs-card-spacer-x: 0.5rem !important;
        }

        .step-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;

        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
        }

        /*.project-card .project-details {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }*/

        .node {
            position: absolute;
        }

        .project-card.expanded .project-details {
            max-height: 500px;
            opacity: 1;
        }

        .project-card .toggle-icon {
            transition: transform 0.3s ease;
        }

        .project-card.expanded .toggle-icon {
            transform: rotate(180deg);
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-lg-2 p-4 sidebar">
                <h3 class="fw-bold mb-5">
                    <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                </h3>

                <nav class="nav flex-column">
                    <a class="nav-link" href="http://127.0.0.1:5500/Page/dashboard.html" id="dashboard-link">
                        <i class="bi bi-house-door me-2"></i> Dashboard
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">
                        <i class="bi bi-box-seam me-2"></i> Inventory
                    </a>

                    <a class=" nav-link" href="#" id="order-link">
                        <i class="bi bi-cart me-2"></i> Order
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/setting.html" id="setting-link">
                        <i class="bi bi-gear me-2"></i> Setting
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                        <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                    </a>
                </nav>
            </div>

            <!-- Main -->
            <div class="col-lg-10 p-4">

                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <h3 class="fw-bold mb-0">Orders Page</h3>
                        <small class="text-muted">Welcome back, User👋</small>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light rounded-circle">
                            <i class="bi bi-bell"></i>
                        </button>

                        <div class="dropdown">
                            <img src="https://i.pravatar.cc/100" class="avatar dropdown-toggle"
                                data-bs-toggle="dropdown"
                                style="width:40px;height:40px;border-radius:50%;cursor:pointer" />

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" id="logoutLink" href="#">Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Content -->
                <div class="container-fluid" style="padding-left: 0px !important;">

                    <div class="project-switcher">
                        <select id="projectSelect" class="form-select" style="width: 200px;">

                        </select>
                        <span id="project-status">

                        </span>
                    </div>

                </div>

                <div class="controls">
                    <button onclick="addStage()">Thêm stage</button>
                </div>

                <div id="canvas"></div>


            </div>
        </div>
    </div>


</body>

<script>

    /* =====================================================
       CONSTANTS
       ===================================================== */
    const COLLECTION_PROJECTS = "Projects";
    const COLLECTION_TASKS = "Tasks";
    const COLLECTION_USERS = "Users";
    const COLLECTION_STAGES = "Stages";
    const POCKETBASE_URL = "http://127.0.0.1:8090";

    /* =====================================================
      Variables
      ===================================================== */

    // projectData
    let projectList = [];

    // task data
    let taskListByStage = [];

    // stage data
    let stageListByProject = [];


    $(document).ready(function () {

        if (!checkAuthentication()) return;

        document.querySelector(".container-fluid").style.display = "block";

        // window.alert(window.innerWidth + " x " + window.innerHeight);
        // Spec: 1528 * 732;

        const currentPage = window.location.pathname;

        if (currentPage.includes('dashboard')) {
            document.getElementById('dashboard-link').classList.add('active');
        } else if (currentPage.includes('order')) {
            document.getElementById('order-link').classList.add('active');
        } else if (currentPage.includes('user')) {
            document.getElementById('user-link').classList.add('active');
        } else if (currentPage.includes('setting')) {
            document.getElementById('setting-link').classList.add('active');
        } else if (currentPage.includes('project')) {
            document.getElementById('project-link').classList.add('active');
        }

        changeIconAvatar();

        changeTopbarText();

        getProjectsData().then(() => {
            renderProjectOptionList();
            initDefaultProject();
        })

    });

    document.querySelectorAll('.menu-link').forEach(item => {
        item.addEventListener('click', function () {
            document.querySelectorAll('.menu-link').forEach(el => {
                el.classList.remove('active');
            });

            this.classList.add('active');
        });
    });

    document.getElementById("logoutLink").addEventListener("click", function (e) {
        e.preventDefault();
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "http://127.0.0.1:5500/Page/login.html";
    });

    function checkAuthentication() {
        const token = localStorage.getItem("token");
        if (!token || token.trim() === "") {
            Swal.fire({
                icon: 'warning',      // icon của popup: 'warning', 'error', 'success', 'info', 'question'
                title: 'Access Denied',
                text: 'You must log in to access this page',
                confirmButtonText: 'Go to Login'
            }).then(() => {
                window.location.href = "http://127.0.0.1:5500/Page/login.html"; // chuyển hướng sau khi user bấm OK
            });

            return false;
        }

        return true;
    }

    function changeIconAvatar() {
        const dropdownAvatar = document.querySelector('.dropdown img');
        const userData = JSON.parse(localStorage.getItem("user"));

        if (!dropdownAvatar || !userData) return;

        dropdownAvatar.src =
            `${POCKETBASE_URL}/api/files/${COLLECTION_USERS}/${userData.id}/${userData.avatar}?t=${Date.now()}`;
    }

    function changeTopbarText() {
        const topbarText = document.querySelector('.topbar .text-muted');
        const userData = JSON.parse(localStorage.getItem("user"));

        if (!topbarText || !userData) return;

        topbarText.textContent = `Welcome back, ${userData.employee_id} 👋`;
    }

    function renderProjectOptionList() {

        const select = document.getElementById("projectSelect");
        select.innerHTML = "";

        // add option mới từ API
        projectList.forEach(project => {
            const option = document.createElement("option");
            option.value = project.id;
            option.textContent = project.name;
            select.appendChild(option);
        });

    }

    function changeProjectStatusUI(status) {
        const el = document.getElementById("project-status");

        const map = {
            Done: {
                text: "Done",
                class: "bg-success"
            },
            Processing: {
                text: "Processing",
                class: "bg-warning text-dark"
            },
            Pending: {
                text: "Pending",
                class: "bg-secondary"
            }
        };

        const s = map[status] || map.pending;

        el.innerHTML = `
        <span class="badge ${s.class}">
            ${s.text}
        </span>
    `;
    }

    document.addEventListener("click", function (e) {
        const header = e.target.closest(".header-click");
        if (!header) return;

        const card = header.closest(".project-card");
        card.classList.toggle("expanded");
    });

    document.getElementById("projectSelect").addEventListener("change", function (e) {
        const selectedId = e.target.value;

        const project = projectList.find(p => p.id == selectedId);

        if (project) {
            console.log(selectedId);
            changeProjectStatusUI(project.status);
        }
    });

    function initDefaultProject() {
        const first = projectList[0];

        if (!first) return;

        document.getElementById("projectSelect").value = first.id;
        changeProjectStatusUI(first.status);
    }


    // API
    async function getProjectsData() {
        try {
            const token = localStorage.getItem('token');
            const response = await fetch(
                `${POCKETBASE_URL}/api/collections/${COLLECTION_PROJECTS}/records`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

            const result = await response.json();
            projectList = result.items || [];

        } catch (error) {
            console.log(error);
        }
    }

    // API
    async function getStagesData(projectID) {
        try {
            const token = localStorage.getItem('token');
            const response = await fetch(
                `${POCKETBASE_URL}/api/collections/${COLLECTION_STAGES}/records?filter=(project="${projectID}")`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

            const result = await response.json();
            stageListByProject = result.items || [];

        } catch (error) {
            console.log(error);
        }
    }

    // API
    async function getTasks(stageID) {
        try {
            const token = localStorage.getItem("token");

            const headers = {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json"
            };

            const tasksRes = await fetch(`${POCKETBASE_URL}/api/collections/${COLLECTION_TASKS}/records?filter=(stage="${stageID}")`, { headers });
            if (!tasksRes.ok) {
                throw new Error("Load data failed");
            }

            const tasks = await tasksRes.json();
            taskListByStage = tasks.items || [];
        } catch (error) {
            console.log(error);
        }

    }






    let instance; // object jsPlumb instance

    function initDiagram() {

        instance = jsPlumb.getInstance({
            Connector: ["Flowchart", {
                cornerRadius: 10,
                stub: 20,          // 🔥 tránh đâm thẳng vào card
                gap: 8             // 🔥 né node
            }],

            PaintStyle: {
                stroke: "#2563eb",
                strokeWidth: 2
            },

            Endpoint: "Blank",
            Anchors: ["Right", "Left"],
            Container: "canvas"
        });

        const stages = [
            "stage1",
            "stage2",
            "stage3"
        ];

        createStage("stage1", "Stage 1", 50, 200);
        createStage("stage2", "Stage 2", 350, 200);
        createStage("stage3", "Stage 3", 650, 200);

        setTimeout(() => {
            connectStages(stages);
            instance.repaintEverything();
        }, 100);
    }

    /* function này sẽ render card stage lên UI diagram mỗi lần người dùng nhấn click add button
    khi render card, card này được lưu vào data nhưng chỉ có id, 
    + dùng jQuery để kéo dãn chiều dài của card để người dùng nhập thông tin về giai đoạn dự án
    + sau đó người dùng có thể lưu => save vào db */
    function createStage(id, label, x, y) {
        const el = document.createElement("div");

        el.id = id;
        el.className = "node";

        el.innerHTML = `
        <div class="card border-success shadow-sm project-card collapsed">
            <div class="card-body">
                <div class="d-flex align-items-center header-click">
                    <div class="step-circle bg-success text-white fw-bold">1</div>
                    <h5 class="ms-3 mb-0 flex-grow-1 fw-semibold">${label}</h5>
                    <i class="bi bi-chevron-down toggle-icon"></i>
                </div>

                <div class="project-details mt-3">
                    <div class="fs-1 fw-bold text-success">100%</div>
                    <div class="text-muted mb-2">Hoàn thành</div>
                </div>
            </div>
        </div>
    `;

        document.getElementById("canvas").appendChild(el);

        el.style.position = "absolute";
        el.style.left = x + "px";
        el.style.top = y + "px";

        instance.draggable(el, {
            stop: function () {
                instance.repaintEverything();
            }
        });

        instance.makeSource(el, {
            maxConnections: -1,
            endpoint: "Blank",
            anchor: "Right"
        });

        instance.makeTarget(el, {
            maxConnections: -1,
            endpoint: "Blank",
            anchor: "Left"
        });
    }

    function connectStages(list) {
        for (let i = 0; i < list.length - 1; i++) {
            instance.connect({
                source: list[i],
                target: list[i + 1],
                anchors: ["Right", "Left"]
            });
        }
    }

    window.onload = initDiagram;




</script>

</html>
