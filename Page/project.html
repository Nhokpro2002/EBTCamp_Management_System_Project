<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>

    <!-- Bootstrap 5 -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- Project Page CSS -->
    <link href="../CSS/project.css" rel="stylesheet">

    <!-- JQuery 4.0.0-->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Sweet Alert-->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Tom Select -->
    <link href="../Libs/Tom-Select/tom-select.bootstrap5.css" rel="stylesheet">
    <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>

    <style></style>

</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-2 p-4 sticky-top" style="height: 100vh; background-color: #182330; color: #fff;">
                <nav class="nav flex-column">
                    <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">
                        <i class="bi bi-boxes me-2"></i> Inventory
                    </a>

                    <a class="nav-link" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                        <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                    </a>
                </nav>
            </div>

            <div class="col-lg-10 p-4">
                <div style="min-width: 1212px;">
                    <div
                        style="background: var(--card-bg);border: 1px solid var(--border-color);border-radius: 18px;box-shadow: var(--shadow-sm);padding: 22px;">
                        <!-- Header -->
                        <div
                            class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                            <div>
                                <h1 style="font-size: 24px;font-weight: 700;margin-bottom: 4px;">Projects</h1>
                                <p style="font-size: 13px;color: var(--text-muted);margin-bottom: 0;">Manage all
                                    projects in the system</p>
                            </div>

                            <button class="btn btn-create-project"
                                style="background: #15803d;border-color: #15803d;color: #fff;font-weight: 600;border-radius: 10px;padding: 10px 16px;box-shadow: 0 8px 16px rgba(21, 128, 61, 0.2);">
                                <i class="bi bi-plus-lg me-2"></i>New Project
                            </button>
                        </div>

                        <!-- Stats -->
                        <div class="row g-3 mb-4" id="statsContainer">
                            <!-- JS render -->
                        </div>

                        <!-- Toolbar -->
                        <div class="row g-3 align-items-center" style="margin-top: 22px;margin-bottom: 18px;">
                            <div class="col-lg-6">
                                <div style="position: relative;">
                                    <i class="bi bi-search"
                                        style="position: absolute;top: 50%;left: 14px;transform: translateY(-50%);color: #9aa3b2;font-size: 15px;"></i>
                                    <input type="text" id="searchInput" placeholder="Search projects..."
                                        style="padding-left: 40px;border-radius: 12px;height: 44px;border: 1px solid var(--border-color);box-shadow: none;" />
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="d-flex gap-2 justify-content-lg-end">
                                    <select class="form-select" id="statusFilter" style="max-width: 220px;">
                                        <option value="all">All Status</option>
                                        <option value="In Progress">In Progress</option>
                                        <option value="Completed">Completed</option>
                                        <option value="On Hold">On Hold</option>
                                        <option value="Not Started">Not Started</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Table -->
                        <div
                            style="border: 1px solid var(--border-color);border-radius: 16px;overflow: hidden;background: #fff;min-height: 500px;">
                            <div class="table-scroll">
                                <table class="table projects-table">
                                    <thead>
                                        <tr>
                                            <th style="min-width: 180px;">Project Name</th>
                                            <th>Start Date</th>
                                            <th>End Date</th>
                                            <th style="min-width: 220px;">Progress</th>
                                            <th>Status</th>
                                            <th style="width: 120px;">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="projectTableBody">
                                        <!-- JS render -->
                                    </tbody>
                                </table>
                            </div>

                            <!-- Footer -->
                            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3"
                                style="border-top: 1px solid var(--border-color);padding: 16px 18px;background: #fff;">
                                <div id="tableInfo" style="color: var(--text-muted);font-size: 13px;font-weight: 500;">
                                    Showing 1 to 5 of 12 projects
                                </div>

                                <nav>
                                    <ul class="pagination pagination-custom" id="pagination">
                                        <!-- JS render -->
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="overlay-create-project" class="overlay-create-project">
        <div class="popup-create-project">
            <h2>Create New Project</h2>

            <div class="form-group-create-project">
                <label>Project Name</label>
                <input type="text" id="project-name" placeholder="Enter project name" required>
            </div>

            <div class="form-group-create-project">
                <label>Start Date</label>
                <input type="date" id="start-date" required>
            </div>

            <div class="form-group-create-project">
                <label>End Date</label>
                <input type="date" id="end-date" required>
            </div>

            <div class="form-group-create-project">
                <label>PIC</label>
                <select id="pic" required></select>
            </div>

            <div class="form-group-create-project">
                <label>Members</label>
                <select id="members" multiple required></select>
            </div>

            <hr>

            <div class="form-actions-create-project">
                <button type="button" class="btn bg-primary bg-gradient btn-save-project">
                    <i class="bi bi-check2-circle me-1"></i>
                    Create Project
                </button>
                <button type="button" class="btn bg-secondary bg-gradient btn-close-project-popup">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="../Script/project/project.js"></script>
</body>

</html>
