<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Page</title>

    <!-- DataTables-->
    <link href="../Libs/DataTables/datatables.min.css" rel="stylesheet">
    <script src="../Libs/DataTables/datatables.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- JQuery 4.0.0-->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Sweet Alert-->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../Libs/Bootstrap/css/bootstrap.min.css">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- JsPlumb -->
    <link href="../Libs/JsPlumb/jsplumb.css">
    <script src="../Libs/JsPlumb/jsplumb.min.js"></script>

    <!-- Vis-network-->
    <link href="../Libs/Vis-Network/vis-network.min.css" rel="stylesheet">
    <script src="../Libs/Vis-Network/vis-network.min.js"></script>

    <!-- Tom Select-->
    <link href="../Libs/Tom-Select/tom-select.bootstrap5.css" rel="stylesheet">
    <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>

    <!-- Project Css-->
    <link href="../CSS/project.css" rel="stylesheet">



    <style>
        .stage-card {
            border: none;
            border-radius: 16px;
        }

        .stat-box {
            background: #f8f9fa;
            border-radius: 12px;
            text-align: center;
            padding: 20px;
        }

        .stat-box h5 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .badge-status {
            font-size: 13px;
            padding: 8px 12px;
        }

        .btn-edit-task.active {
            background-color: #0d6efd !important;
            color: white !important;
            border-color: #0d6efd !important;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-lg-2 p-4 sidebar sticky-top">
                <h3 class="fw-bold mb-5">
                    <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                </h3>

                <nav class="nav flex-column">
                    <a class="nav-link" href="http://127.0.0.1:5500/Page/dashboard.html" id="dashboard-link">
                        <i class="bi bi-house-door me-2"></i> Dashboard
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">
                        <i class="bi bi-box-seam me-2"></i> Inventory
                    </a>

                    <a class=" nav-link" href="#" id="order-link">
                        <i class="bi bi-cart me-2"></i> Order
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/setting.html" id="setting-link">
                        <i class="bi bi-gear me-2"></i> Setting
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                        <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                    </a>
                </nav>
            </div>

            <!-- Main -->
            <div class="col-lg-10 p-4">

                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <h3 class="fw-bold mb-0">Orders Page</h3>
                        <small class="text-muted">Welcome back, User👋</small>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light rounded-circle">
                            <i class="bi bi-bell"></i>
                        </button>

                        <div class="dropdown">
                            <img src="https://i.pravatar.cc/100" class="avatar dropdown-toggle"
                                data-bs-toggle="dropdown"
                                style="width:40px;height:40px;border-radius:50%;cursor:pointer" />

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" id="logoutLink" href="#">Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Content -->
                <div class="container-fluid" style="padding-left: 0px !important;">

                    <div class="project-switcher">
                        <select id="projectSelect" class="form-select" style="width: 200px;">

                        </select>
                        <span id="project-status">

                        </span>
                    </div>

                    <!-- Vùng giai đoạn của dự án-->
                    <div id="network" style="height:300px;border:2px solid #ddd;"></div>
                    <!-- Vùng giai đoạn của dự án-->

                    <div class="row g-3" style="padding-top: 20px;">

                        <div class="container-fluid py-4">

                            <!-- Stage Detail -->
                            <div class="card shadow-sm stage-card mb-4">

                                <div class="card-header bg-white">

                                    <div class="d-flex justify-content-between align-items-center">

                                        <div>
                                            <h4 class="mb-1">
                                                Stage Number 1
                                            </h4>

                                            <small class="text-muted">
                                                01/06/2024 - 06/06/2024
                                            </small>
                                        </div>

                                        <div>
                                            <button class="btn btn-outline-primary btn-sm">
                                                Edit Stage
                                            </button>

                                            <button class="btn btn-primary btn-sm">
                                                Add Task
                                            </button>
                                        </div>

                                    </div>

                                </div>

                                <div class="card-body" style="overflow-x: auto;">

                                    <div class="row g-3">

                                        <div class="col-md-3">
                                            <div class="stat-box">
                                                <h5>5</h5>
                                                <span>Pending</span>
                                            </div>
                                        </div>

                                        <div class="col-md-3">
                                            <div class="stat-box">
                                                <h5 class="text-success">2</h5>
                                                <span>Done</span>
                                            </div>
                                        </div>

                                        <div class="col-md-3">
                                            <div class="stat-box">
                                                <h5 class="text-primary">2</h5>
                                                <span>In Progress</span>
                                            </div>
                                        </div>

                                        <div class="col-md-3">
                                            <div class="stat-box">
                                                <h5 class="text-danger">1</h5>
                                                <span>Problem</span>
                                            </div>
                                        </div>

                                    </div>

                                </div>

                            </div>

                            <!-- Task Table -->

                            <div class="card shadow-sm">

                                <div class="card-header bg-white">

                                    <div class="d-flex justify-content-between align-items-center">

                                        <h5 class="mb-0">
                                            Tasks in this Stage
                                        </h5>

                                        <button class="btn btn-success btn-sm">
                                            Create Task
                                        </button>

                                    </div>

                                </div>

                                <div class="card-body p-0" style="overflow-x: auto;">

                                    <table class="table table-hover align-middle mb-0">

                                        <thead class="table-light">
                                            <tr>
                                                <th>Task Name</th>
                                                <th id="task-handler">Handler</th>
                                                <th>Status</th>
                                                <th>Percent</th>
                                                <th>Start Date</th>
                                                <th>End Date</th>
                                                <th width="120">Action</th>
                                            </tr>
                                        </thead>

                                        <tbody id="taskBody">

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>
            </div>
        </div>


</body>

<script src="../Script/project.js"></script>

</html>
