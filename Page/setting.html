<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Bootstrap CSS -->
    <link href="../CSS/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/bootstrap.min.css.map" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="../Libs/DataTables/datatables.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font Nunito -->

    <!-- use version 0.20.3 -->
    <script type="text/javascript" src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 16.666667%;
            /* tương ứng col-lg-2 */
            height: 100vh;
            overflow-y: auto;

            background: linear-gradient(180deg, #0d6efd, #0b5ed7);
            color: white;

        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.85);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .topbar {
            background: white;
            border-radius: 20px;
            padding: 16px 24px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }

        .main-content {
            margin-left: 16.666667%;
        }

        .container-fluid {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-lg-2 p-4 sidebar">
                <h3 class="fw-bold mb-5">
                    <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                </h3>

                <nav class="nav flex-column">
                    <a class="nav-link" href="http://127.0.0.1:5500/Page/dashboard.html" id="dashboard-link">
                        <i class="bi bi-house-door me-2"></i> Dashboard
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">
                        <i class="bi bi-box-seam me-2"></i> Inventory
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/order.html" id="order-link">
                        <i class="bi bi-cart me-2"></i> Order
                    </a>

                    <a class="nav-link" href="#" id="setting-link">
                        <i class="bi bi-gear me-2"></i> Setting
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                        <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                    </a>
                </nav>
            </div>

            <!-- Main -->
            <div class="col-lg-10 p-4 main-content">

                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-0">Settings</h3>
                        <small class="text-muted">Manage your account and preferences</small>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light rounded-circle">
                            <i class="bi bi-bell"></i>
                        </button>

                        <div class="dropdown">
                            <img src="https://i.pravatar.cc/100" class="avatar dropdown-toggle"
                                data-bs-toggle="dropdown"
                                style="width:40px;height:40px;border-radius:50%;cursor:pointer" />

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" id="logoutLink" href="#">Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Content Row -->
                <div class="row g-4">

                    <!-- Account Information -->
                    <div class="col-lg-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body p-4">
                                <h4 class="fw-bold mb-4">
                                    <i class="bi bi-person-gear me-2"></i> Account Settings
                                </h4>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="setting-email">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Employee ID</label>
                                    <input type="text" class="form-control" id="setting-employee-id" readonly>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Department</label>
                                    <input type="text" class="form-control" id="setting-department" readonly>
                                </div>
                                <button class="btn btn-primary" id="btn-save-profile">Save Changes</button>
                            </div>
                        </div>
                    </div>

                    <!-- Security -->
                    <div class="col-lg-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body p-4">
                                <h4 class="fw-bold mb-4">
                                    <i class="bi bi-shield-lock me-2"></i> Security
                                </h4>
                                <div class="mb-3">
                                    <label class="form-label">New Password</label>
                                    <input type="password" class="form-control" id="new-password">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirm-password">
                                </div>
                                <button class="btn btn-warning" id="btn-change-password">Change Password</button>
                            </div>
                        </div>
                    </div>

                    <!-- Preferences -->
                    <div class="col-lg-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4">
                                <h4 class="fw-bold mb-4">
                                    <i class="bi bi-sliders me-2"></i> Preferences
                                </h4>
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" id="dark-mode">
                                    <label class="form-check-label">Dark Mode</label>
                                </div>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="email-notification" checked>
                                    <label class="form-check-label">Email Notifications</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Danger Zone -->
                    <div class="col-lg-6">
                        <div class="card border-danger shadow-sm">
                            <div class="card-body p-4">
                                <h4 class="fw-bold text-danger mb-4">
                                    <i class="bi bi-exclamation-triangle me-2"></i> Danger Zone
                                </h4>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-outline-danger" id="btn-logout">Logout</button>
                                    <button class="btn btn-danger" id="btn-delete-account">Delete Account</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div> <!-- End Content Row -->

            </div> <!-- End col-lg-10 -->
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

<script>

    function checkAuthentication() {
        const token = localStorage.getItem("token");
        if (!token || token.trim() === "") {
            Swal.fire({
                icon: 'warning',      // icon của popup: 'warning', 'error', 'success', 'info', 'question'
                title: 'Access Denied',
                text: 'You must log in to access this page',
                confirmButtonText: 'Go to Login'
            }).then(() => {
                window.location.href = "http://127.0.0.1:5500/Page/login.html"; // chuyển hướng sau khi user bấm OK
            });

            return false;

            // ngăn chặn load tiếp các script
        }
        return true;
    }


    $(document).ready(function () {

        if (!checkAuthentication()) return;

        document.querySelector(".container-fluid").style.display = "block";

        initSidebar()

    })

    function initSidebar() {
        const currentPage = window.location.pathname;

        if (currentPage.includes('dashboard')) {
            document.getElementById('dashboard-link').classList.add('active');
        } else if (currentPage.includes('order')) {
            document.getElementById('order-link').classList.add('active');
        } else if (currentPage.includes('user')) {
            document.getElementById('user-link').classList.add('active');
        } else if (currentPage.includes('setting')) {
            document.getElementById('setting-link').classList.add('active');
        } else if (currentPage.includes('project')) {
            document.getElementById('project-link').classList.add('active');
        }
    }

    document.getElementById("logoutLink").addEventListener("click", function (e) {
        e.preventDefault(); // ngăn link reload trang
        // Xóa storage
        localStorage.clear();
        sessionStorage.clear();

        // Redirect về trang login hoặc homepage nếu muốn
        window.location.href = "http://127.0.0.1:5500/Page/login.html";
    });


</script>

</html>
