<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap 5 Dashboard</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #0d6efd, #0b5ed7);
            color: white;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.85);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .topbar {
            background: white;
            border-radius: 20px;
            padding: 16px 24px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .card-stat {
            border: none;
            border-radius: 20px;
            color: white;
            overflow: hidden;
            position: relative;
        }

        .card-stat i {
            font-size: 3rem;
            opacity: 0.2;
            position: absolute;
            right: 20px;
            bottom: 10px;
        }

        .table-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .progress {
            height: 8px;
            border-radius: 20px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }


        /* base style */
        #out-of-stock,
        #low-stock:hover {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-lg-2 p-4 sidebar">
                <h3 class="fw-bold mb-5">
                    <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                </h3>

                <nav class="nav flex-column">
                    <a class="nav-link" href="http://127.0.0.1:5500/Page/dashboard.html" id="dashboard-link">
                        <i class="bi bi-house-door me-2"></i> Dashboard
                        <!--Admin thì xem được các vấn đề liên quan toàn hệ thống 
                        nhưng eng thông thường sẽ chỉ xem được các vấn đề, ... mà họ đang chịu trách nhiệm-->
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">
                        <i class="bi bi-box-seam me-2"></i> Inventory
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/orders.html" id="orders-link">
                        <i class="bi bi-cart me-2"></i> Orders
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/settings.html" id="settings-link">
                        <i class="bi bi-gear me-2"></i> Settings
                    </a>

                    <a class="nav-link" href="#" id="projects-link">
                        <i class="bi bi-tools"></i> Projects
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/users.html" id="users-link">
                        <i class="bi bi-people me-2"></i> Users
                        <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                    </a>

                </nav>
            </div>

            <!-- Main -->
            <div class="col-lg-10 p-4">

                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-0">Projects Page</h3>
                        <small class="text-muted">Welcome back, User 👋</small>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light rounded-circle">
                            <i class="bi bi-bell"></i>
                        </button>

                        <img src="https://i.pravatar.cc/100" class="avatar" alt="avatar" />
                    </div>
                </div>



                <!-- Content -->
                <div class="row g-4">
                    <div class="row g-4 mb-4">

                        <div class="col-md-3">
                            <div class="card card-stat bg-primary p-3 shadow position-relative">
                                <h6 class="mb-3">OVERALL PROCESS</h6>

                                <!--<i class="bi bi-percent"></i>-->
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="card card-stat bg-primary p-3 shadow position-relative">
                                <h6 class="mb-3">TASKS</h6>

                                <!--<i class="bi bi-list-task"></i>-->
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="card card-stat bg-primary p-3 shadow position-relative">
                                <h6 class="mb-3">DUE THIS WEEK</h6>

                                <!--<i class="bi bi-cart-fill"></i>-->
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="card card-stat bg-primary p-3 shadow position-relative">
                                <h6 class="mb-3">ISSUE</h6>

                                <!--<i class="bi bi-box-seam-fill"></i>-->
                            </div>
                        </div>


                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</body>
<script>

    $(document).ready(function () {

        // process focus option sidebar

        const currentPage = window.location.pathname;

        if (currentPage.includes('dashboard')) {
            document.getElementById('dashboard-link').classList.add('active');
        } else if (currentPage.includes('orders')) {
            document.getElementById('orders-link').classList.add('active');
        } else if (currentPage.includes('orders')) {
            document.getElementById('users-link').classList.add('active');
        } else if (currentPage.includes('orders')) {
            document.getElementById('settings-link').classList.add('active');
        } else if (currentPage.includes('projects')) {
            document.getElementById('projects-link').classList.add('active');
        }


    })



</script>

</html>
