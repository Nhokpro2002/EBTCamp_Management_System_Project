<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Bootstrap 5 -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <style>
        .activity-panel {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            overflow: hidden;
        }

        .activity-header {
            padding: 12px 16px;
            font-weight: 600;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .activity-item {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #f1f1f1;
            transition: .2s;
        }

        .activity-item:hover {
            background: #f8f9fa;
        }

        .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .activity-content {
            flex: 1;
        }

        .activity-title {
            font-size: 14px;
            font-weight: 600;
        }

        .activity-desc {
            font-size: 13px;
            color: #6c757d;
            margin-top: 2px;
        }

        .activity-time {
            font-size: 12px;
            color: #adb5bd;
            margin-top: 4px;
        }

        /* Warning */
        .warning .activity-icon {
            background: #fff3cd;
            color: #f59f00;
        }

        /* Issue */
        .danger .activity-icon {
            background: #ffe3e3;
            color: #dc3545;
        }

        /* Update */
        .info .activity-icon {
            background: #e7f5ff;
            color: #1971c2;
        }

        .old-value {
            color: #dc3545;
            text-decoration: line-through;
        }

        .new-value {
            color: #198754;
            font-weight: 600;
        }
    </style>
</head>

<body>


    <div class="activity-panel">

        <div class="activity-header">
            <i class="bi bi-bell-fill"></i>
            System Activities
        </div>


        <!-- Alert -->
        <div class="activity-item warning">
            <div class="activity-icon">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <div class="activity-content">
                <div class="activity-title">
                    Task overdue
                </div>
                <div class="activity-desc">
                    MES System - Design Database delayed 3 days
                </div>
                <div class="activity-time">
                    10 minutes ago
                </div>
            </div>
        </div>

        <!-- Issue -->
        <div class="activity-item danger">
            <div class="activity-icon">
                <i class="bi bi-exclamation-circle-fill"></i>
            </div>
            <div class="activity-content">
                <div class="activity-title">
                    PLC Connection Failed
                </div>
                <div class="activity-desc">
                    Machine cannot connect to controller
                </div>
                <div class="activity-time">
                    Raised by Nguyen Van A · 30 minutes ago
                </div>
            </div>
        </div>

        <!-- Information update -->
        <div class="activity-item info">
            <div class="activity-icon">
                <i class="bi bi-pencil-square"></i>
            </div>
            <div class="activity-content">
                <div class="activity-title">
                    Deadline updated
                </div>
                <div class="activity-desc">
                    Project deadline changed
                    <span class="old-value">
                        30/07
                    </span>
                    <span>→</span>
                    <span class="new-value">
                        15/08
                    </span>
                </div>
                <div class="activity-time">
                    Updated by John · 1 hour ago
                </div>
            </div>
        </div>
    </div>

</body>

</html>
