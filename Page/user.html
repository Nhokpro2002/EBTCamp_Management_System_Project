<head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #0d6efd, #0b5ed7);

            <div class="col-lg-2 p-4 sidebar">
                <h3 class="fw-bold mb-5">
                    <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                </h3>

                <nav class="nav flex-column">
                    <a class="nav-link" href="http://127.0.0.1:5500/Page/dashboard.html" id="dashboard-link">

                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/order.html" id="order-link">

                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/setting.html" id="setting-link">
                        <i class="bi bi-gear me-2"></i> Setting
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="#" id="user-link">

                </nav>
            </div>

            <!-- Main -->
            <div class="col-lg-10 p-4">

                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center mb-4">

                        <h3 class="fw-bold mb-0">User page</h3>

                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light rounded-circle">
                            <i class="bi bi-bell"></i>
                        </button>

                        <div class="dropdown">
                            <img src="https://i.pravatar.cc/100" class="avatar dropdown-toggle"

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" id="logoutLink" href="#">Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <!-- Content -->
                <div class="row g-4">
                    <div class="col-12">
                        <div class="card p-4 shadow-sm">
                            <div class="row align-items-center">

                                <!-- Avatar + Change Button -->
                                <div class="col-md-4 text-center">
                                    <img id="user-avatar" src="https://i.pravatar.cc/150" alt="Avatar"
                                        class="rounded-circle mb-3"
                                        style="width:150px; height:150px; object-fit:cover; border:3px solid #0d6efd;">
                                    <input type="file" id="avatar-input" accept="image/*" style="display:none;">
                                    <button id="change-avatar-btn" class="btn btn-primary btn-sm d-block mx-auto">Change
                                        Avatar</button>
                                </div>

                                <!-- User Info -->
                                <div class="col-md-8">
                                    <h4 class="fw-bold mb-3">User Information</h4>
                                    <div class="mb-2"><strong>Email:</strong> <span id="user-email"></span></div>
                                    <div class="mb-2"><strong>Employee ID:</strong> <span id="user-employee-id"></span>
                                    </div>
                                    <div class="mb-2"><strong>VH Code:</strong> <span id="user-vh-code"></span></div>
                                    <div class="mb-2"><strong>Department:</strong> <span id="user-department"></span>
                                    </div>
                                    <button id="save-avatar-btn" class="btn btn-success mt-3">Save Avatar</button>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

<script>

    function checkAuthentication() {
        const token = localStorage.getItem("token");
        if (!token || token.trim() === "") {
            Swal.fire({
                icon: 'warning',      // icon popup: 'warning', 'error', 'success', 'info', 'question'
                title: 'Access Denied',
                text: 'You must log in to access this page',
                confirmButtonText: 'Go to Login'
            }).then(() => {
                window.location.href = "http://127.0.0.1:5500/Page/login.html";
            });

            return false;

        }
        return true;
    }


    $(document).ready(function () {

        if (!checkAuthentication()) return;

        document.querySelector(".container-fluid").style.display = "block";

        initSidebar()
    })

    function initSidebar() {
        const currentPage = window.location.pathname;

        if (currentPage.includes('dashboard')) {
            document.getElementById('dashboard-link').classList.add('active');
        } else if (currentPage.includes('order')) {
            document.getElementById('order-link').classList.add('active');
        } else if (currentPage.includes('user')) {
            document.getElementById('user-link').classList.add('active');
        } else if (currentPage.includes('order')) {
            document.getElementById('order-link').classList.add('active');
        } else if (currentPage.includes('project')) {
            document.getElementById('project-link').classList.add('active');
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {

        // --- Dữ liệu user mẫu, thay bằng API của bạn ---
        const userData = {
            email: "johndoe@example.com",
            employee_id: "EMP12345",
            vh_code: "VH001",
            department: "Engineering",
            avatar: "https://i.pravatar.cc/150"
        };

        // --- Render user info ---
        document.getElementById("user-email").textContent = userData.email;
        document.getElementById("user-employee-id").textContent = userData.employee_id;
        document.getElementById("user-vh-code").textContent = userData.vh_code;
        document.getElementById("user-department").textContent = userData.department;
        document.getElementById("user-avatar").src = userData.avatar;

        const avatarInput = document.getElementById("avatar-input");
        const avatarImg = document.getElementById("user-avatar");
        let selectedFile = null;

        // --- Change Avatar Button ---
        document.getElementById("change-avatar-btn").addEventListener("click", () => {
            avatarInput.click();
        });

        avatarInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function (ev) {
                    avatarImg.src = ev.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // --- Save Avatar Button ---
        document.getElementById("save-avatar-btn").addEventListener("click", async () => {
            if (!selectedFile) {
                Swal.fire({ icon: 'warning', title: 'No image selected', text: 'Please choose an avatar first!' });
                return;
            }

            const formData = new FormData();
            formData.append("avatar", selectedFile);

            try {
                const token = localStorage.getItem("token");
                // replace YOUR_USER_ID với id thực tế
                const res = await fetch(`http://127.0.0.1:8090/api/collections/Users/records/YOUR_USER_ID/avatar`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    },
                    body: formData
                });

                if (!res.ok) throw new Error("Upload failed");

                Swal.fire({ icon: 'success', title: 'Avatar updated!', timer: 1500, showConfirmButton: false });
                selectedFile = null;

            } catch (err) {
                console.error(err);
                Swal.fire({ icon: 'error', title: 'Upload failed', text: err.message });
            }
        });

    });

    document.getElementById("logoutLink").addEventListener("click", function (e) {
        e.preventDefault(); // ngăn link reload trang
        // Xóa storage
        localStorage.clear();
        sessionStorage.clear();

        // Redirect về trang login hoặc homepage nếu muốn
        window.location.href = "http://127.0.0.1:5500/Page/login.html";
    });

fetch(`http://127.0.0.1:8090/api/collections/users/records/${recordId}`, {
  method: "PATCH",
  headers: {
    "Content-Type": "application/json",
    "Authorization": "Bearer YOUR_TOKEN" // nếu collection yêu cầu auth
  },
  body: JSON.stringify({
    mk: "giá trị mới"
  })
})
.then(res => res.json())
.then(data => console.log(data))
.catch(err => console.error(err));*/
</script>

</html>
