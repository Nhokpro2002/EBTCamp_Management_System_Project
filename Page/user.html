<!DOCTYPE html>
<html lang="en">

<head>

</head>

<body>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="logo">
                <img src="../Image/lg_display_logo_web.png" alt="LG Display">
            </div>

            <ul class="menu">
                <li><a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a></li>
                <li><a href="inventory.html"><i class="bi bi-box"></i> Inventory</a></li>
                <li><a href="order.html"><i class="bi bi-receipt"></i> Order</a></li>
                <li><a href="project.html"><i class="bi bi-kanban"></i> Project</a></li>
                <li>
                    <a href="notification.html">
                        <span class="notification-icon">
                            <i class="bi bi-bell"></i>
                            <span id="badge-count" class="badge rounded-pill bg-danger text-white d-none">0</span>
                        </span>
                        Notification
                    </a>
                </li>
                <li><a href="#"><i class="bi bi-gear"></i> Settings</a></li>
            </ul>

            <div class="sidebar-user">
                <img src="" alt="Avatar">
                <div class="user-info">
                    <h6 class="user-name"></h6>
                    <small class="user-role">Engineer</small>
                </div>
            </div>
        </aside>

        <main class="content">
            <div class="card profile-card">

                <!-- Cover -->
                <div class="position-relative">

                    <img src="https://picsum.photos/1200/350" class="cover-image">

                    <button class="btn btn-light position-absolute end-0 bottom-0 m-3 shadow-sm">
                        <i class="bi bi-image"></i>
                        Change Cover
                    </button>

                    <img src="https://i.pravatar.cc/300" class="avatar">

                </div>

                <div class="card-body profile-content">

                    <div class="d-flex justify-content-between align-items-start flex-wrap">

                        <div class="ms-lg-4">

                            <h2 class="fw-bold mb-1">

                            </h2>

                            <p class="text-muted mb-2">

                            </p>

                            <span class="badge bg-primary">

                            </span>

                        </div>

                        <div class="d-flex flex-wrap gap-2 mt-3 mt-lg-0">

                            <button class="btn btn-outline-primary action-btn">
                                <i class="bi bi-person-circle"></i>
                                Change Avatar
                            </button>

                            <button class="btn btn-primary action-btn">
                                <i class="bi bi-pencil-square"></i>
                                Edit Profile
                            </button>

                            <button class="btn btn-outline-warning action-btn">
                                <i class="bi bi-key"></i>
                                Change Password
                            </button>

                        </div>

                    </div>

                    <hr class="my-4">

                    <div class="section-title">
                        <i class="bi bi-person-vcard me-2"></i>
                        Basic Information
                    </div>

                    <div class="row">

                        <div class="col-md-6">

                            <div class="mb-3">
                                <label class="info-label">Employee ID</label>
                                <input class="form-control" value="nguyenminhtuan16" disabled>
                            </div>

                            <div class="mb-3">
                                <label class="info-label">VH Code</label>
                                <input class="form-control" value="VH132469" disabled>
                            </div>

                            <div class="mb-3">
                                <label class="info-label">Full Name</label>
                                <input class="form-control" value="Nguyen Minh Tuan" disabled>
                            </div>

                            <div class="mb-3">
                                <label class="info-label">Email</label>
                                <input class="form-control" value="nguyenminhtuan16@lgdisplay.com" disabled>
                            </div>

                        </div>

                        <div class="col-md-6">

                            <div class="mb-3">
                                <label class="info-label">Phone</label>
                                <input class="form-control" value="0336555130" disabled>
                            </div>

                            <div class="mb-3">
                                <label class="info-label">Department</label>
                                <input class="form-control" value="Equipment Technology Part" disabled>
                            </div>

                            <div class="mb-3">
                                <label class="info-label">Position</label>
                                <input class="form-control" disabled>
                                <!-- Cái này sẽ dùng để phân quyền-->
                            </div>

                        </div>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-end gap-2">

                        <button class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i>
                            Cancel
                        </button>

                        <button class="btn btn-success">
                            <i class="bi bi-check-circle"></i>
                            Save Changes
                        </button>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <script type="module" src="../Script/inventory/main.js"></script>
</body>

</html>
