<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>

    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>
    <link rel="stylesheet" href="../CSS/user.css">
</head>

<body>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="logo">
                <img src="../Image/lg_display_logo_web.png" alt="LG Display">
            </div>

            <ul class="menu">
                <li><a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a></li>
                <li><a href="inventory.html"><i class="bi bi-box"></i> Inventory</a></li>
                <li><a href="order.html"><i class="bi bi-receipt"></i> Order</a></li>
                <li><a href="project.html"><i class="bi bi-kanban"></i> Project</a></li>
                <li>
                    <a href="notification.html">
                        <span class="notification-icon">
                            <i class="bi bi-bell"></i>
                            <span id="badge-count" class="badge rounded-pill bg-danger text-white d-none">0</span>
                        </span>
                        Notification
                    </a>
                </li>
                <li><a href="#"><i class="bi bi-gear"></i> Settings</a></li>
            </ul>

            <a class="sidebar-user sidebar-user-link" href="user.html" aria-label="Open user profile">
                <img class="sidebar-user-avatar" src="../Image/LG-Symbol.png" alt="User avatar">
                <span class="user-info">
                    <h6 class="user-name">User</h6>
                    <small class="user-role">Profile</small>
                </span>
            </a>
        </aside>

        <main class="content">
            <div class="user-page-heading">
                <div>
                    <h1>User Profile</h1>
                    <p>View your account details and manage your profile security.</p>
                </div>
                <button type="button" class="btn btn-outline-secondary" id="back-button">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </button>
            </div>

            <section class="card profile-card">
                <div class="profile-banner">
                    <div class="profile-identity">
                        <img id="profile-avatar" class="avatar" src="../Image/LG-Symbol.png" alt="Profile avatar">
                        <div>
                            <h2 id="profile-name">User</h2>
                            <p id="profile-subtitle">Account profile</p>
                        </div>
                    </div>
                </div>

                <div class="card-body profile-content">
                    <section class="profile-section" aria-labelledby="basic-info-heading">
                        <h3 class="section-title" id="basic-info-heading">
                            <i class="bi bi-person-vcard me-2"></i>Basic Information
                        </h3>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="info-label" for="employee-id">Employee ID</label>
                                <input class="form-control" id="employee-id" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="info-label" for="vh-code">VH Code</label>
                                <input class="form-control" id="vh-code" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="info-label" for="full-name">Full Name</label>
                                <input class="form-control" id="full-name" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="info-label" for="email">Email</label>
                                <input class="form-control" id="email" type="email" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="info-label" for="phone">Phone</label>
                                <input class="form-control" id="phone" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="info-label" for="department">Department</label>
                                <input class="form-control" id="department" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="info-label" for="position">Position</label>
                                <input class="form-control" id="position" readonly>
                            </div>
                        </div>
                    </section>

                    <section class="profile-section" aria-labelledby="avatar-heading">
                        <h3 class="section-title" id="avatar-heading">
                            <i class="bi bi-image me-2"></i>Profile Picture
                        </h3>
                        <form id="avatar-form">
                            <label class="info-label" for="avatar-file">Choose a new image</label>
                            <div class="avatar-controls">
                                <input class="form-control" id="avatar-file" type="file" accept="image/*">
                                <button type="submit" class="btn btn-primary" id="save-avatar" disabled>
                                    <i class="bi bi-upload me-1"></i>Upload Avatar
                                </button>
                            </div>
                            <div class="form-text">Image files only, up to 5 MB.</div>
                        </form>
                    </section>

                    <section class="profile-section" aria-labelledby="password-heading">
                        <h3 class="section-title" id="password-heading">
                            <i class="bi bi-shield-lock me-2"></i>Change Password
                        </h3>
                        <form id="password-form">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="info-label" for="current-password">Current Password</label>
                                    <input class="form-control" id="current-password" type="password"
                                        autocomplete="current-password" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="info-label" for="new-password">New Password</label>
                                    <input class="form-control" id="new-password" type="password"
                                        autocomplete="new-password" required minlength="8">
                                </div>
                                <div class="col-md-4">
                                    <label class="info-label" for="confirm-password">Confirm New Password</label>
                                    <input class="form-control" id="confirm-password" type="password"
                                        autocomplete="new-password" required minlength="8">
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary" id="change-password">
                                    <i class="bi bi-key me-1"></i>Update Password
                                </button>
                            </div>
                        </form>
                    </section>

                    <p id="profile-status" class="profile-status" role="status" hidden></p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="../Script/user/main.js"></script>
</body>

</html>
