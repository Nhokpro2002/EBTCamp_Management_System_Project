<!DOCTYPE html>

<head>

    <!-- Bootstrap 5 -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- JQuery 4.0.0-->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Sweet Alert -->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Sortable -->
    <script src="../Libs/Sortable/sortable.min.js"></script>

    <!-- ExcelJS -->
    <script src="../Libs/ExcelJS/exceljs.min.js"></script>

    <!-- Project_Items CSS -->
    <link href="../CSS/project_items.css" rel="stylesheet">

    <style>

    </style>
</head>

<body>

    <div id="projectItemDrawer">

        <!-- Header -->
        <div class="drawer-header">
            <div class="project-header">
                <div class="project-title">
                    <i class="bi bi-box-seam me-2"></i>
                    <h4>Project Items</h4>
                </div>

                <div class="project-name">
                    <i class="bi bi-folder-fill"></i>
                    <span>Project :</span>
                    <span class="project-info">MES System Setup</span>
                </div>
            </div>
            <div>
                <button class="btn btn-outline-secondary" id="back-project-page-button">
                    <i class="bi bi-arrow-left"></i>
                    Back
                </button>
            </div>
        </div>

        <!-- Body -->
        <div class="row h-100 g-0">
            <!-- ================= INVENTORY ================= -->
            <div class="col-2 inventory-panel">
                <div class="inventory-header">
                    <h5>
                        <i class="bi bi-boxes me-2"></i>
                        Inventory
                    </h5>
                </div>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>
                    <input class="form-control js-search-inventory" placeholder="Search inventory items">

                </div>
                <div id="inventory-list">
                    <!-- render bằng JS -->
                </div>
            </div>

            <!-- ================= PROJECT ITEMS ================= -->
            <div class="col-10 project-panel">
                <div class="project-toolbar">
                    <div class="input-group w-50">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <input class="form-control js-search-project-item" placeholder="Search project items">
                    </div>
                </div>

                <div class="excel-toolbar d-flex justify-content-end gap-2 my-2">
                    <button class="btn btn-primary btn-sm fw-bold" id="button-import-excel">
                        <i class="bi bi-file-earmark-excel me-1"></i>
                        Import Excel
                    </button>
                </div>

                <!-- Drop Zone -->
                <div id="drop-zone">
                    <i class="bi bi-mouse fs-3"></i>
                    <div class="mt-2">
                        Drag item from Inventory and drop here
                    </div>
                </div>

                <!-- Table -->
                <div class="table-wrapper">
                    <table class="table table-hover align-middle" id="project-items-table">
                        <thead>
                            <tr>
                                <th class="text-center">
                                    <input type="checkbox" id="checkAll">
                                </th>
                                <th>Name</th>
                                <th>Model</th>
                                <th>XCode/QCode</th>
                                <th>Description</th>
                                <th class="text-center">Required</th>
                                <th class="text-center">Stock</th>
                                <th class="text-center">Order</th>
                                <th class="text-end">Unit Price</th>
                                <th class="text-end">Total Price</th>
                                <th>Requester</th>
                                <th>Request Date</th>
                            </tr>
                        </thead>
                        <tbody id="project-item-body">
                            <!-- render bằng JS -->
                        </tbody>
                    </table>
                </div>


                <!-- Footer -->
                <div class="project-footer">
                    <div>
                        Total Cost :
                        <strong class="text-primary" id="lbl-total-cost">
                            $ 0
                        </strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="bulkActionBar" class="bulk-action-bar">
        <button class="btn btn-danger btn-sm fw-bold me-1" id="button-delete-project-item">
            <i class="bi bi-trash me-1"></i>
            Delete
        </button>

        <button class="btn btn-info btn-sm fw-bold me-1" id="button-save-project-item">
            <i class="bi bi-download me-1"></i>
            Save
        </button>

        <button class="btn btn-success btn-sm fw-bold me-1" id="button-export-excel">
            <i class="bi bi-floppy me-1"></i>
            Export Excel
        </button>
    </div>
</body>

<script type="module" src="../Script/project_items/project_items.js"></script>

</html>
