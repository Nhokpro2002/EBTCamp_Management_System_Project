<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Materials</title>

    <!-- Bootstrap -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/project_items.css">
</head>

<body>

    <div class="wrapper">

        <!-- ===========================
                CONTENT
        ============================ -->

        <main class="content">

            <!-- Header -->

            <header class="topbar">
                <div class="d-flex align-items-center">
                    <!-- Back Button -->
                    <button id="btnBack" class="btn btn-back me-4">
                        <i class="bi bi-arrow-left"></i>
                    </button>

                    <!-- Title -->
                    <div>
                        <h2>Project Materials</h2>
                        <p>
                            Project
                            <i class="bi bi-chevron-right"></i>
                            Materials
                        </p>
                    </div>
                </div>

                <div class="header-right d-flex align-items-center gap-3">
                    <button class="btn btn-light position-relative">
                        <i class="bi bi-bell"></i>
                        <span class="badge bg-danger notification-badge">
                            3
                        </span>
                    </button>
                    <button class="btn btn-outline-danger">
                        <i class="bi bi-person-circle"></i>
                        Admin
                    </button>
                </div>

            </header>

            <!-- ======================
                    PROJECT CARD
            ======================= -->

            <section class="project-card">

                <div class="project-left">

                    <div class="project-icon">
                        <i class="bi bi-discord"></i>
                    </div>

                    <div>
                        <h3>Automatic Packaging Machine</h3>
                        <div class="project-tags">
                            <span class="badge bg-light text-dark">
                                PRJ-2026-001
                            </span>
                            <span class="badge bg-danger">
                                In Progress
                            </span>
                        </div>
                    </div>

                </div>

                <div class="project-summary">

                    <div class="summary-item">
                        <h5>Total Materials</h5>
                        <span id="totalMaterial">56</span>
                    </div>

                    <div class="summary-item">
                        <h5>Issued</h5>
                        <span id="issuedMaterial">32</span>
                    </div>

                    <div class="summary-item">
                        <h5>Remaining</h5>
                        <span id="remainingMaterial">24</span>
                    </div>

                    <div class="summary-item">
                        <h5>Total Cost</h5>
                        <span>$8,240</span>
                    </div>

                </div>

            </section>
            <!-- =======================
                    TOOLBAR
            ======================== -->
            <section class="toolbar">

                <div class="toolbar-left">

                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="txtSearch" placeholder="Search material...">
                    </div>

                    <select id="categoryFilter" class="form-select">
                        <option>All Categories</option>
                    </select>

                    <select id="statusFilter" class="form-select">
                        <option>All Status</option>
                    </select>

                </div>

                <div class="toolbar-right">
                    <button class="btn btn-outline-secondary">
                        <i class="bi bi-funnel"></i>
                        Filter
                    </button>

                    <button class="btn btn-danger">
                        <i class="bi bi-plus-lg"></i>
                        Add Material
                    </button>
                </div>

            </section>
            <!-- =======================
                    TABLE
            ======================== -->
            <section class="table-card">

                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>
                            <tr>
                                <th width="40">
                                    <input type="checkbox">
                                </th>
                                <th>#</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Model</th>
                                <th>XCode/QCode</th>
                                <th>Type</th>
                                <th>Order</th>
                                <th>Unit Price</th>
                                <th>Total Price</th>
                                <th>Status</th>
                                <th>Request Date</th>
                                <th>Requester</th>
                                <th width="60"></th>
                            </tr>
                        </thead>

                        <tbody id="materialTable">
                            <!-- Render by JS -->
                        </tbody>

                    </table>

                </div>

            </section>

            <!-- =======================
                    FOOTER
            ======================== -->
            <div class="table-footer">
                <div>
                    Showing
                    <span id="showingCount">
                        1-6
                    </span>
                    of
                    <span id="totalCount">
                        56
                    </span>
                    materials
                </div>

                <nav>
                    <ul class="pagination mb-0">
                        <li class="page-item">
                            <a class="page-link" href="#">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>

                        <li class="page-item active">
                            <a class="page-link" href="#">
                                1
                            </a>
                        </li>

                        <li class="page-item">
                            <a class="page-link" href="#">
                                2
                            </a>
                        </li>

                        <li class="page-item">
                            <a class="page-link" href="#">
                                3
                            </a>
                        </li>

                        <li class="page-item">
                            <a class="page-link" href="#">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>

                    </ul>

                </nav>

            </div>

        </main>

    </div>

</body>

<script type="module" src="../Script/project_items/project_items.js"></script>

<script>
    // ======================================================
    // Fake Data
    // ======================================================

    const materials = [
        {
            id: 1,
            name: "Mitsubishi PLC FX5U",
            image: "https://via.placeholder.com/60",
            code: "PLC-001",
            brand: "Misubishi",
            model: "PLC Misubishi Q-Series",
            unit_price: 8,
            type: "PLC",
            order_quantity: 10,
            status: "Request Code",
            requested_date: "2026-07-12",
            requester: "Nguyen Minh Tuan"




        }

    ];

    let currentData = [...materials];

    // ======================================================
    // DOM
    // ======================================================

    const tableBody = document.getElementById("materialTable");
    const txtSearch = document.getElementById("txtSearch");
    const categoryFilter = document.getElementById("categoryFilter");
    const statusFilter = document.getElementById("statusFilter");

    // ======================================================
    // Init
    // ======================================================

    window.onload = () => {
        renderCategory();
        renderTable(currentData);
        updateSummary();
    };

    // ======================================================
    // Category
    // ======================================================

    function renderCategory() {
        const categories = [...new Set(materials.map(x => x.category))];
        categories.forEach(item => {
            categoryFilter.innerHTML += `
            <option value="${item}">
                ${item}
            </option>
        `;
        });
    }

    // ======================================================
    // Status
    // ======================================================

    function renderStatus() {

        const arr = [
            "Request Code",
            "Wait Pur Process",
            "Request PO",
            "Pending Delivery",
            "Completed"
        ];

        arr.forEach(item => {

            statusFilter.innerHTML += `
            <option value="${item}">
                ${item}
            </option>
        `;

        });

    }

    // ======================================================
    // Render Table
    // ======================================================

    function renderTable(data) {

        tableBody.innerHTML = "";

        data.forEach((item, index) => {
            let status = "";

            let className = "";

            tableBody.innerHTML += `

        <tr>

            <td>
                <input type="checkbox">
            </td>

            <td>${index + 1}</td>

            <td>

                <img src="${item.image}">

            </td>

            <td>

                <strong>${item.name}</strong>

            </td>

            <td>${item.code}</td>

            <td>${item.type}</td>

            <td>${item.unit_price}</td>


            <td>

                <span class="status ${className}">
                    ${status}
                </span>

            </td>

            <td>

                <div class="dropdown">

                    <button
                        class="btn btn-light btn-sm"
                        data-bs-toggle="dropdown">

                        <i class="bi bi-three-dots"></i>

                    </button>

                    <ul class="dropdown-menu">

                        <li>
                            <a class="dropdown-item" href="#">
                                <i class="bi bi-eye"></i>
                                View
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="#">
                                <i class="bi bi-pencil"></i>
                                Edit
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item text-danger" href="#">
                                <i class="bi bi-trash"></i>
                                Delete
                            </a>
                        </li>

                    </ul>

                </div>

            </td>

        </tr>

        `;

        });

    }

    // ======================================================
    // Search
    // ======================================================

    txtSearch.addEventListener("keyup", filterData);

    categoryFilter.addEventListener("change", filterData);

    statusFilter.addEventListener("change", filterData);

    // ======================================================
    // Filter
    // ======================================================

    function filterData() {

        const keyword = txtSearch.value.toLowerCase();

        const category = categoryFilter.value;

        const status = statusFilter.value;

        currentData = materials.filter(item => {

            const remain = item.required - item.issued;

            let itemStatus = "";

            if (remain == 0)

                itemStatus = "Completed";

            else if (remain <= 5)

                itemStatus = "Low Stock";

            else

                itemStatus = "In Stock";

            return (

                (item.name.toLowerCase().includes(keyword) ||

                    item.code.toLowerCase().includes(keyword))

                &&

                (category == "All Categories" ||

                    item.category == category)

                &&

                (status == "All Status" ||

                    itemStatus == status)

            );

        });

        renderTable(currentData);

    }

    // ======================================================
    // Summary
    // ======================================================

    function updateSummary() {

        const total = materials.length;

        let issued = 0;

        let remain = 0;

        materials.forEach(item => {

            issued += item.issued;

            remain += item.required - item.issued;

        });

        document.getElementById("totalMaterial").innerHTML = total;

        document.getElementById("issuedMaterial").innerHTML = issued;

        document.getElementById("remainingMaterial").innerHTML = remain;

        document.getElementById("showingCount").innerHTML =
            `1-${materials.length}`;

        document.getElementById("totalCount").innerHTML =
            materials.length;

    }
</script>

</html>
