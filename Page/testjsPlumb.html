<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap -->
    <link rel="stylesheet" href="../Libs/Bootstrap/css/bootstrap.min.css">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- JsPlumb -->
    <link href="../Libs/JsPlumb/jsplumb.css">
    <script src="../Libs/JsPlumb/jsplumb.min.js"></script>

    <style>
        #canvas {
            position: relative;
            width: 100%;
            height: 700px;
            border: 1px solid #ccc;
            overflow: auto;
            background: #f8f9fa;
        }

        .node {
            position: absolute;
            width: 160px;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid #198754;
            border-radius: 10px;

            background: white;
            cursor: move;
        }
    </style>
</head>

<body>

    <div class="container mt-3">

        <button class="btn btn-success me-2" onclick="addNode()">
            Add Node
        </button>

        <button class="btn btn-danger" onclick="removeNode()">
            Delete Last Node
        </button>

        <hr>

        <div id="canvas"></div>

    </div>

</body>
<script>
    let instance;
    let nodeCount = 0;
    let nodeIds = [];

    function init() {

        instance = jsPlumb.getInstance({
            Container: "canvas",
            Connector: "Flowchart",
            PaintStyle: {
                stroke: "#2563eb",
                strokeWidth: 2
            },
            Endpoint: "Dot",
            EndpointStyle: {
                fill: "#2563eb",
                radius: 5
            }
        });

        createNode(100, 200);
        createNode(350, 200);
        createNode(600, 200);

        connectSequential();
    }

    function createNode(x, y) {

        nodeCount++;

        const id = "node" + nodeCount;

        const el = document.createElement("div");

        el.id = id;
        el.className = "node";
        el.innerHTML = "Node " + nodeCount;

        el.style.left = x + "px";
        el.style.top = y + "px";

        document
            .getElementById("canvas")
            .appendChild(el);

        instance.draggable(el);

        instance.makeSource(el, {
            anchor: "Right",
            maxConnections: -1
        });

        instance.makeTarget(el, {
            anchor: "Left",
            maxConnections: -1
        });

        nodeIds.push(id);

        return id;
    }

    function connectSequential() {

        instance.deleteEveryConnection();

        for (let i = 0; i < nodeIds.length - 1; i++) {

            instance.connect({
                source: nodeIds[i],
                target: nodeIds[i + 1]
            });

        }
    }

    function addNode() {

        const lastIndex = nodeIds.length;

        createNode(
            100 + lastIndex * 250,
            200
        );

        connectSequential();
    }

    function removeNode() {

        if (nodeIds.length === 0) {
            return;
        }

        const lastId = nodeIds.pop();

        const el = document.getElementById(lastId);

        instance.remove(el);

        connectSequential();
    }

    window.onload = init;
</script>

</html>
