<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Activities - Notifications</title>

    <!-- Bootstrap & Icons -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS tùy chỉnh -->
    <link href="../CSS/notification.css" rel="stylesheet">
    <link href="../CSS/report-navigation.css" rel="stylesheet">
</head>

<body>

    <div class="wrapper">

        <!-- ========================================================
                SIDEBAR (THANH MENU BÊN TRÁI)
        ========================================================= -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../Image/lg_display_logo_web.png" alt="LG Display">
            </div>

            <ul class="menu">
                <li>
                    <a href="dashboard.html">
                        <i class="bi bi-grid"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="inventory.html">
                        <i class="bi bi-box"></i> Inventory
                    </a>
                </li>
                <li>
                    <a href="order.html">
                        <i class="bi bi-receipt"></i> Order
                    </a>
                </li>
                <li>
                    <a href="project.html">
                        <i class="bi bi-kanban"></i> Project
                    </a>
                </li>
                <li class="active">
                    <a href="notification.html">
                        <span class="notification-icon" style="position: relative; display: inline-block;">
                            <i class="bi bi-bell"></i>
                            <span id="badge-count" class="badge rounded-pill bg-danger text-white d-none"
                                style="position: absolute; top: -6px; right: -8px; font-size: 0.75rem; padding: 0.25em 0.45em; font-weight: bold;">0</span>
                        </span>
                        Notification
                    </a>
                </li>
                <li>
                    <details class="menu-report">
                        <summary><i class="bi bi-file-earmark-text"></i> Report <i class="bi bi-chevron-down report-chevron"></i></summary>
                        <ul class="report-submenu">
                            <li><a href="daily-report.html"><i class="bi bi-calendar-day"></i> Daily Report</a></li>
                            <li><span class="report-submenu-disabled">Weekly Report <small>Soon</small></span></li>
                        </ul>
                    </details>
                </li>
                <li><a href="#"><i class="bi bi-gear"></i> Settings</a></li>
            </ul>

            <a class="sidebar-user sidebar-user-link" href="user.html" aria-label="Open user profile">
                <img class="sidebar-user-avatar" src="../Image/LG-Symbol.png" alt="User avatar">
                <span class="user-info">
                    <h6 class="user-name">User</h6>
                    <small class="user-role">Profile</small>
                </span>
            </a>
        </aside>

        <!-- ========================================================
                MAIN CONTENT (VÙNG HIỂN THỊ CHÍNH BÊN PHẢI)
        ========================================================= -->
        <main class="content">

            <!-- Đầu trang: Tiêu đề và Thanh công cụ chức năng -->
            <div class="content-header">
                <div>
                    <h2 class="page-title">Notifications</h2>
                    <p class="page-subtitle">Issues assigned to your roles</p>
                </div>
                <div class="header-tools">
                    <div class="search-box">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" class="form-control" id="search-notifications"
                            placeholder="Search notifications..." aria-label="Search notifications">
                        <span class="search-shortcut">/</span>
                    </div>

                    <select id="projectSelect" class="project-select" aria-label="Filter by project">
                        <option value="" selected>All projects</option>
                    </select>

                    <!-- Hộp chọn ngày công cụ ở góc cuối cùng -->
                    <div class="date-picker-box">
                        <i class="bi bi-calendar3 calendar-icon"></i>
                        <input type="date" id="filter-date" class="form-control" aria-label="Filter activities by date">
                    </div>
                </div>
            </div>


            <!-- Bảng danh sách thông báo -->
            <div class="activity-panel">
                <!-- Tiêu đề cột -->
                <div class="panel-columns-header">
                    <div class="col-activity">Activity</div>
                    <div class="col-related">Related To</div>
                    <div class="col-time">Time</div>
                </div>

                <!-- Danh sách chứa các thẻ thông báo render từ JS -->
                <div id="activity-list">
                    <!-- Các dữ liệu thông báo tự động đẩy vào từ file main.js -->
                </div>

            </div>

            <div class="activity-pagination" aria-label="Activity pagination">
                <label class="page-size-control" for="page-size">
                    Rows per page
                    <select id="page-size" class="form-select form-select-sm">
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                </label>
                <span id="pagination-info" aria-live="polite">0–0 of 0</span>
                <div class="pagination-buttons">
                    <button type="button" id="previous-page" class="pagination-button" disabled>Previous</button>
                    <button type="button" id="next-page" class="pagination-button" disabled>Next</button>
                </div>
            </div>

        </main>
    </div>

    <!-- PocketBase SDK -->
    <script src="../Libs/PocketbaseSDK/pocketbase.umd.js"></script>
    <script type="module" src="../Script/notification/main.js"></script>
    <script type="module" src="../Script/user/main.js"></script>

</body>

</html>
