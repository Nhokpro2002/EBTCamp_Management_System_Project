<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Projects</title>

     <!-- Bootstrap 5 -->
     <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
     <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

     <!-- Bootstrap Icons -->
     <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

     <!-- Project Page CSS -->
     <link href="../CSS/project.css" rel="stylesheet">

     <!-- JQuery 4.0.0-->
     <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

     <!-- Sweet Alert-->
     <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
     <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

     <!-- Tom Select -->
     <link href="../Libs/Tom-Select/tom-select.bootstrap5.css" rel="stylesheet">
     <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>

     <style>
          :root {
               --page-bg: #f6f7fb;
               --card-bg: #ffffff;
               --border-color: #eceef3;
               --text-main: #1f2937;
               --text-muted: #8a94a6;
               --green: #16a34a;
               --blue: #3b82f6;
               --orange: #f59e0b;
               --red: #ef4444;
               --shadow-sm: 0 6px 20px rgba(15, 23, 42, 0.05);
          }

          body {
               background: #f5f5f5;
               font-family: "Inter", sans-serif;
               font-size: 15px;
               color: #333;
          }

          /* ===== Header ===== */
          .btn-create-project:hover {
               background: #166534;
               border-color: #166534;
               color: #fff;
          }

          /* ===== Stat cards ===== */
          .stat-card {
               background: #fff;
               border: 1px solid var(--border-color);
               border-radius: 14px;
               padding: 16px 18px;
               height: 100%;
               transition: all 0.2s ease;
          }

          .stat-card:hover {
               transform: translateY(-2px);
               box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
          }

          .stat-top {
               display: flex;
               align-items: center;
               gap: 8px;
               margin-bottom: 10px;
               font-size: 13px;
               color: var(--text-muted);
               font-weight: 600;
          }

          .stat-dot {
               width: 10px;
               height: 10px;
               border-radius: 50%;
               display: inline-block;
          }

          .dot-blue {
               background: var(--blue);
          }

          .dot-green {
               background: var(--green);
          }

          .dot-orange {
               background: var(--orange);
          }

          .dot-red {
               background: var(--red);
          }

          .stat-value {
               font-size: 32px;
               line-height: 1;
               font-weight: 700;
               color: var(--text-main);
          }

          /* ===== Table ===== */

          .projects-table {
               margin-bottom: 0;
               vertical-align: middle;
          }

          .projects-table thead th {
               background: #fafbfc;
               color: #7b8797;
               font-size: 13px;
               font-weight: 700;
               border-bottom: 1px solid var(--border-color);
               padding: 14px 18px;
               white-space: nowrap;
          }

          .projects-table tbody td {
               padding: 18px;
               border-bottom: 1px solid #f0f2f6;
               font-size: 14px;
          }

          .projects-table tbody tr:last-child td {
               border-bottom: none;
          }

          .project-name {
               font-weight: 700;
               color: #111827;
          }

          .date-text {
               color: #4b5563;
               font-weight: 500;
          }

          /* ===== Progress ===== */
          .progress-cell {
               min-width: 180px;
          }

          .progress-percent {
               font-size: 13px;
               font-weight: 700;
               color: #4b5563;
               margin-bottom: 8px;
          }

          .custom-progress {
               height: 8px;
               background: #edf1f7;
               border-radius: 999px;
               overflow: hidden;

          }

          .custom-progress .progress-bar {
               border-radius: 999px;
               height: 8px;
          }

          .progress-blue {
               background: var(--blue);
          }

          .progress-green {
               background: var(--green);
          }

          .progress-orange {
               background: var(--orange);
          }

          .progress-red {
               background: var(--red);
          }

          /* ===== Status badge ===== */
          .status-badge {
               display: inline-flex;
               align-items: center;
               justify-content: center;
               min-width: 110px;
               padding: 7px 12px;
               border-radius: 999px;
               font-size: 12px;
               font-weight: 700;
               border: 1px solid transparent;
          }

          .status-in-progress {
               color: #2563eb;
               background: #eff6ff;
               border-color: #dbeafe;
          }

          .status-completed {
               color: #15803d;
               background: #ecfdf3;
               border-color: #d1fae5;
          }

          .status-on-hold {
               color: #d97706;
               background: #fff7ed;
               border-color: #fed7aa;
          }

          .status-not-started {
               color: #dc2626;
               background: #fef2f2;
               border-color: #fecaca;
          }

          /* ===== Action buttons ===== */
          .action-group {
               display: flex;
               align-items: center;
               gap: 8px;
          }

          .icon-action {
               width: 34px;
               height: 34px;
               border-radius: 10px;
               border: 1px solid var(--border-color);
               background: #19c2a4;
               color: white;
               display: inline-flex;
               align-items: center;
               justify-content: center;
               transition: 0.2s ease;
          }

          .icon-action:hover {
               background: #f9fafb;
               color: #111827;
               transform: translateY(-1px);
          }

          /* ===== Footer / Pagination ===== */
          .pagination-custom {
               gap: 8px;
               margin: 0;
          }

          .pagination-custom .page-link {
               width: 36px;
               height: 36px;
               padding: 0;
               border-radius: 10px !important;
               border: 1px solid var(--border-color);
               display: flex;
               align-items: center;
               justify-content: center;
               color: #4b5563;
               background: #fff;
          }

          .pagination-custom .page-item.active .page-link {
               background: #2563eb;
               border-color: #2563eb;
               color: #fff;
          }

          .pagination-custom .page-link:hover {
               background: #f8fafc;
               color: #111827;
          }

          .pagination-custom .page-item.active .page-link:hover {
               background: #2563eb;
               color: #fff;
          }

          /* ===== Responsive ===== */
          @media (max-width: 992px) {
               .projects-table {
                    min-width: 950px;
               }

               .table-scroll {
                    overflow-x: auto;
               }
          }

          .nav-link {
               color: #333;
               margin-bottom: 10px;
               padding: 13px 15px;
               border: 1px solid transparent;
               border-radius: 8px;
               transition: .25s;
          }

          .nav-link:hover {
               background: #fff1f3;
               border-color: #e60012;
               color: #222;
          }

          .nav-link.active {
               background: #ffffff;
               border-color: #e60012;
               color: #333;
          }

          .overlay-create-project {
               position: fixed;
               top: 0;
               left: 0;
               right: 0;
               bottom: 0;
               background: rgba(0, 0, 0, 0.5);
               display: none;
               justify-content: center;
               align-items: center;
               z-index: 1000;
          }

          .popup-create-project {
               background: #fff;
               padding: 30px;
               border-radius: 10px;
               width: 600px;
               max-height: 90%;
               overflow-y: auto;
               font-family: Arial, sans-serif;
          }

          .form-group-create-project {
               margin-bottom: 15px;
               display: flex;
               flex-direction: column;
          }

          .form-group-create-project label {
               margin-bottom: 5px;
               font-weight: bold;
          }

          .form-group-create-project input,
          .form-group-create-project select {
               padding: 8px 10px;
               border-radius: 5px;
               border: 1px solid #ccc;
          }

          .form-actions-create-project {
               display: flex;
               justify-content: flex-end;
               gap: 10px;
               margin-top: 20px;
          }

          .form-actions-create-project button {
               padding: 8px 15px;
               border-radius: 5px;
               border: none;
               cursor: pointer;
          }

          .action-menu {
               position: absolute;
               right: 5px;
               min-width: 120px;
               background: #fff;
               border: 1px solid #ddd;
               border-radius: 6px;
               box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
               display: none;
               z-index: 1000;
               top: -15px;
          }

          .action-menu.show {
               display: block;
          }

          .action-item {
               padding: 6px 10px;
               cursor: pointer;
               display: flex;
               align-items: center;
          }
     </style>

</head>

<body>
     <div class="container-fluid">
          <div class="row">
               <!-- Sidebar -->
               <div class="col-lg-2 d-flex flex-column p-4 sticky-top" style="
              height: 100vh;
                background-color: #ffffff;
                color: #222222;
              border-right: 1px solid #e5e5e5;
                  ">

                    <!-- LOGO -->
                    <div class="text-center mb-4">
                         <img src="../Image/lg_display_logo_web.png" alt="Logo" style="
                width: 140px;
                height: auto;
                object-fit: contain;
             ">
                    </div>

                    <nav class="nav flex-column">
                         <a class="nav-link" href="inventory.html" id="inventory-link">
                              <i class="bi bi-boxes me-2"></i> Inventory
                         </a>

                         <a class="nav-link" href="order.html" id="orders-link">
                              <i class="bi bi-receipt me-2"></i> Orders
                         </a>

                         <a class="nav-link" id="project-link">
                              <i class="bi bi-tools me-2"></i> Project
                         </a>

                         <a class="nav-link" href="information.html" id="information-link">
                              <i class="bi bi-info-square-fill me-2"></i> Information
                         </a>

                         <a class="nav-link" href="user.html" id="user-link">
                              <i class="bi bi-people me-2"></i> User
                         </a>
                    </nav>

                    <!-- User Info -->
                    <div class="mt-auto pt-3 d-flex align-items-center" style="
                       border-top:1px solid #eeeeee;
                   ">

                         <img src="../Images/avatar.png" alt="Avatar" class="rounded-circle" width="45" height="45"
                              style="
                           border:2px solid #e60012;
                       ">

                         <div class="ms-3">

                              <div class="fw-semibold" id="user-name" style="
                color:#222;
             ">
                                   Nguyễn Văn A
                              </div>


                              <small id="user-role" style="
                color:#888;
             ">
                                   Engineer
                              </small>

                         </div>

                    </div>

               </div>

               <div class="col-lg-10 p-1">
                    <div style="min-width: 1212px;">
                         <div
                              style="background: var(--card-bg);border: 1px solid var(--border-color);border-radius: 18px;box-shadow: var(--shadow-sm);padding: 22px;">
                              <!-- Header -->
                              <div
                                   class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                                   <div>
                                        <h1 style="font-size: 24px;font-weight: 700;margin-bottom: 4px;">Projects</h1>
                                        <p style="font-size: 13px;color: var(--text-muted);margin-bottom: 0;">Manage all
                                             projects in the system</p>
                                   </div>

                                   <button class="btn btn-create-project"
                                        style="background: #15803d;border-color: #15803d;color: #fff;font-weight: 600;border-radius: 10px;padding: 10px 16px;box-shadow: 0 8px 16px rgba(21, 128, 61, 0.2);">
                                        <i class="bi bi-plus-lg me-2"></i>New Project
                                   </button>
                              </div>

                              <!-- Stats -->
                              <div class="row g-3 mb-4" id="statsContainer">
                                   <!-- JS render -->
                              </div>

                              <!-- Toolbar -->
                              <div class="row g-3 align-items-center" style="margin-top: 22px;margin-bottom: 18px;">
                                   <div class="col-lg-6">
                                        <div style="position: relative;">
                                             <i class="bi bi-search"
                                                  style="position: absolute;top: 50%;left: 14px;transform: translateY(-50%);color: #9aa3b2;font-size: 15px;"></i>
                                             <input type="text" id="searchInput" placeholder="Search projects..."
                                                  style="padding-left: 40px;border-radius: 12px;height: 44px;border: 1px solid var(--border-color);box-shadow: none;" />
                                        </div>
                                   </div>

                                   <div class="col-lg-6">
                                        <div class="d-flex gap-2 justify-content-lg-end">
                                             <select class="form-select" id="statusFilter" style="max-width: 220px;">
                                                  <option value="all">All Status</option>
                                                  <option value="In Progress">In Progress</option>
                                                  <option value="Completed">Completed</option>
                                                  <option value="On Hold">On Hold</option>
                                                  <option value="Not Started">Not Started</option>
                                             </select>
                                        </div>
                                   </div>
                              </div>

                              <!-- Table -->
                              <div
                                   style="border: 1px solid var(--border-color);border-radius: 16px;overflow: hidden;background: #fff;min-height: 500px;">
                                   <div class="table-scroll">
                                        <table class="table projects-table">
                                             <thead>
                                                  <tr>
                                                       <th style="min-width: 180px;">Project Name</th>
                                                       <th>Start Date</th>
                                                       <th>End Date</th>
                                                       <th style="min-width: 220px;">Progress</th>
                                                       <th>Status</th>
                                                       <th style="width: 120px;">Actions</th>
                                                  </tr>
                                             </thead>
                                             <tbody id="projectTableBody">
                                                  <!-- JS render -->
                                             </tbody>
                                        </table>
                                   </div>

                                   <!-- Footer -->
                                   <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3"
                                        style="border-top: 1px solid var(--border-color);padding: 16px 18px;background: #fff;">
                                        <div id="tableInfo"
                                             style="color: var(--text-muted);font-size: 13px;font-weight: 500;">
                                             Showing 1 to 5 of 12 projects
                                        </div>

                                        <nav>
                                             <ul class="pagination pagination-custom" id="pagination">
                                                  <!-- JS render -->
                                             </ul>
                                        </nav>
                                   </div>
                              </div>
                         </div>
                    </div>
               </div>
          </div>
     </div>

     <div id="overlay-create-project" class="overlay-create-project">
          <div class="popup-create-project">
               <h2>Create New Project</h2>

               <div class="form-group-create-project">
                    <label>Project Name</label>
                    <input type="text" id="project-name" placeholder="Enter project name" required>
               </div>

               <div class="form-group-create-project">
                    <label>Start Date</label>
                    <input type="date" id="start-date" required>
               </div>

               <div class="form-group-create-project">
                    <label>End Date</label>
                    <input type="date" id="end-date" required>
               </div>

               <div class="form-group-create-project">
                    <label>PIC</label>
                    <select id="pic" required></select>
               </div>

               <div class="form-group-create-project">
                    <label>Members</label>
                    <select id="members" multiple required></select>
               </div>

               <hr>

               <div class="form-actions-create-project">
                    <button type="button" class="btn bg-primary bg-gradient btn-save-project">
                         <i class="bi bi-check2-circle me-1"></i>
                         Create Project
                    </button>
                    <button type="button" class="btn bg-secondary bg-gradient btn-close-project-popup">
                         Cancel
                    </button>
               </div>
          </div>
     </div>

     <script type="module" src="../Script/project/project.js"></script>
</body>

</html>
