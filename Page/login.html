<!DOCTYPE html>
<html lang="vi">

<head>
    <script src="../Script/auth/auth.js" data-guest></script>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <title>EBT CAMP - Đăng nhập</title>

     <!-- Bootstrap -->
     <link rel="stylesheet" href="../Libs/Bootstrap/css/bootstrap.min.css">
     <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

     <!-- DataTables -->
     <link rel="stylesheet" href="../Libs/DataTables/datatables.min.css">
     <script src="../Libs/DataTables/datatables.min.js"></script>

     <!-- Bootstrap Icons -->
     <link rel="stylesheet" href="../Libs/BootstrapIcon/bootstrap-icons.css">

     <!-- SweetAlert2 -->
     <link rel="stylesheet" href="../Libs/SweetAlert2/sweetalert2.min.css">
     <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

     <!-- JQuery -->
     <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

     <!-- Login CSS -->
     <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

     <div class="register-container">

          <!-- LEFT -->
          <div class="left-panel">

               <div class="brand">
                    EBT CAMP
               </div>

               <div class="sub-title">
                    Công cụ hỗ trợ kỹ thuật
               </div>

               <p class="intro">
                    Nền tảng quản lý vật tư kỹ thuật,
                    yêu cầu mua hàng và hỗ trợ sản xuất.
               </p>

          </div>

          <!-- RIGHT -->
          <div class="right-panel">

               <div class="login-title">
                    ĐĂNG NHẬP HỆ THỐNG
               </div>

               <div class="login-desc">
                    Đăng nhập bằng tài khoản LG Display của bạn.
               </div>

               <form id="loginForm">

                    <div class="mb-3">
                         <label for="email" class="form-label">
                              Email nhân viên
                         </label>

                         <input type="text" id="email" class="form-control" placeholder="name@lgdisplay.com"
                              autocomplete="username">
                    </div>

                    <div class="mb-4">
                         <label for="password" class="form-label">
                              Mật khẩu
                         </label>

                         <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu"
                              autocomplete="current-password">
                    </div>

                    <button type="submit" class="login-btn">
                         Đăng nhập
                    </button>

               </form>

               <div class="footer-text">
                    Chưa có tài khoản?
                    <a href="../Page/register.html">
                         Đăng ký
                    </a>
               </div>

          </div>

     </div>

     <script type="module" src="../Script/login/main.js"></script>

</body>

</html>
