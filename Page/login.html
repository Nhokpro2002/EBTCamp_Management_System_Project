<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <title>EBT CAMP - Login</title>

     <!-- Bootstrap -->
     <link rel="stylesheet" href="../Libs/Bootstrap/css/bootstrap.min.css">
     <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

     <!-- DataTables -->
     <link rel="stylesheet" href="../Libs/DataTables/datatables.min.css">
     <script src="../Libs/DataTables/datatables.min.js"></script>

     <!-- Bootstrap Icons -->
     <link rel="stylesheet" href="../Libs/BootstrapIcon/bootstrap-icons.css">

     <!-- SweetAlert2 -->
     <link rel="stylesheet" href="../Libs/SweetAlert2/sweetalert2.min.css">
     <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

     <!-- JQuery -->
     <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

     <!-- Login CSS -->
     <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

     <div class="register-container">

          <!-- LEFT -->
          <div class="left-panel">

               <div class="brand">
                    EBT CAMP
               </div>

               <div class="sub-title">
                    Engineering Business Tool
               </div>

               <p class="intro">
                    Inventory management platform for engineering materials,
                    purchasing requests and production support.
               </p>

          </div>

          <!-- RIGHT -->
          <div class="right-panel">

               <div class="login-title">
                    SYSTEM LOGIN
               </div>

               <div class="login-desc">
                    Sign in using your LG Display account.
               </div>

               <form id="loginForm">

                    <div class="mb-3">
                         <label for="email" class="form-label">
                              Employee Email
                         </label>

                         <input type="text" id="email" class="form-control" placeholder="name@lgdisplay.com"
                              autocomplete="username">
                    </div>

                    <div class="mb-4">
                         <label for="password" class="form-label">
                              Password
                         </label>

                         <input type="password" id="password" class="form-control" placeholder="Enter password"
                              autocomplete="current-password">
                    </div>

                    <button type="submit" class="login-btn">
                         Login
                    </button>

               </form>

               <div class="footer-text">
                    Don't have an account?
                    <a href="../Page/register.html">
                         Sign up
                    </a>
               </div>

          </div>

     </div>

     <script src="../Script/login/login.js"></script>

</body>

</html>
