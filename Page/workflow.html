<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Setup Workflow</title>

    <!-- Bootstrap -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- DHTMLX Gantt -->
    <link href="../Libs/Grantt/dhtmlxgantt.css" rel="stylesheet">
    <script src="../Libs/Grantt/dhtmlxgantt.js"></script>

    <link href="../CSS/workflow.css" rel="stylesheet">

    <!-- JQuery 4.0.0 -->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Tom Select -->
    <link href="../Libs/Tom-Select/tom-select.bootstrap5.css" rel="stylesheet">
    <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>

    <!-- Sweet Alert -->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <style>
        .stage-name {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-task-icon {
            cursor: pointer;
            color: #888;
            font-size: 16px;
            margin-left: 6px;
            transition: 0.2s;
        }

        .add-task-icon:hover {
            color: #1976d2;
            transform: scale(1.15);
        }

        .task-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
        }

        /* overlay */
        .task-modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        /* content */
        .task-modal-content {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            bottom: 20px;
            /* 👈 tạo khoảng cách với đáy */

            width: 420px;
            max-width: 95%;

            background: #fff;
            border-radius: 12px;

            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        /* open state */
        .task-modal.open {
            display: block;
        }

        .task-modal.open .task-modal-content {
            transform: translateX(-50%) translateY(0);
        }

        /* header */
        .task-modal-header {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
        }

        /* body */
        .task-modal-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-modal-body input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        /* footer */
        .task-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid #eee;
        }

        .btn-cancel {
            background: #eee;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .btn-create {
            background: #1976d2;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .task-modal {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .task-modal.open {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <!-- ================= Header ================= -->
        <div class="top-header shadow-sm">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="project-title">
                        <i class="bi bi-diagram-3-fill text-primary"></i>
                        Machine Setup Project
                    </h3>
                    <div class="project-info">
                        Project :
                        <span class="fw-semibold">btn btn-outline-danger btn-sm
                        </span>
                    </div>
                </div>

                <div>
                    <button class="btn btn-outline-secondary" id="back-project-page-button">
                        <i class="bi bi-arrow-left"></i>
                        Back
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= Gantt ================= -->
        <div class="gantt-card shadow">
            <div id="gantt_here"></div>
        </div>

    </div>

    <div id="taskModal" class="task-modal">
        <div class="task-modal-overlay" onclick="closeTaskModal()"></div>

        <div class="task-modal-content">

            <div class="task-modal-header">
                <h5>Create Task</h5>
            </div>

            <div class="task-modal-body">

                <!-- Stage (readonly) -->
                <label>Stage</label>
                <input id="stage-name" type="text" disabled />

                <!-- Task name -->
                <label>Task name</label>
                <input id="task-name" type="text" placeholder="Enter task name" />

                <!-- Start date -->
                <label>Start date</label>
                <input id="start-date" type="date" />

                <!-- Duration -->
                <label>Duration (days)</label>
                <input id="duration" type="number" min="1" placeholder="Days" />

            </div>

            <div class="task-modal-footer">
                <button id="btnCancel" class="btn-cancel">Cancel</button>
                <button id="btnCreate" class="btn-create">Create</button>
            </div>

        </div>
    </div>

</body>

<script type="module" src="../Script/workflow/main.js"></script>

</html>
