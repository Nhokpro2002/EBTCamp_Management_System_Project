<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Setup Workflow</title>

    <!-- Bootstrap -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- DHTMLX Gantt -->
    <link href="../Libs/Grantt/dhtmlxgantt.css" rel="stylesheet">
    <script src="../Libs/Grantt/dhtmlxgantt.js"></script>

    <link href="../CSS/workflow.css" rel="stylesheet">

    <!-- JQuery 4.0.0 -->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Tom Select -->
    <link href="../Libs/Tom-Select/tom-select.bootstrap5.css" rel="stylesheet">
    <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>

    <style>
        .task-popup {
            position: absolute;
            width: 260px;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .12);
            z-index: 9999;
        }

        .task-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .task-popup .form-control {
            height: 32px;
            font-size: 13px;
        }

        .task-popup .ts-wrapper {
            margin-top: 0;
        }

        .task-popup .ts-control {
            min-height: 32px;
            padding: 4px 8px;
            font-size: 13px;
        }

        .task-popup .btn {
            padding: 4px 12px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <!-- ================= Header ================= -->
        <div class="top-header shadow-sm">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="project-title">
                        <i class="bi bi-diagram-3-fill text-primary"></i>
                        Machine Setup Project
                    </h3>
                    <div class="project-info">
                        Project :
                        <span class="fw-semibold">
                            Conveyor Assembly Line
                        </span>
                    </div>
                </div>

                <div>
                    <button class="btn btn-outline-secondary" id="back-project-page-button">
                        <i class="bi bi-arrow-left"></i>
                        Back
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= Toolbar ================= -->

        <div class="toolbar shadow-sm">
            <div class="left-toolbar">
                <button class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-trash"></i>
                    Delete
                </button>
            </div>

            <div class="right-toolbar">
                <button class="btn btn-outline-dark btn-sm">
                    Day
                </button>
                <button class="btn btn-outline-dark btn-sm">
                    Week
                </button>
                <button class="btn btn-outline-dark btn-sm">
                    Month
                </button>
            </div>
        </div>

        <!-- ================= Legend ================= -->
        <div class="legend shadow-sm">
            <div class="legend-item">
                <span class="legend-color design"></span>
                Design
            </div>

            <div class="legend-item">
                <span class="legend-color mechanical"></span>
                Mechanical
            </div>

            <div class="legend-item">
                <span class="legend-color assembly"></span>
                Assembly
            </div>

            <div class="legend-item">
                <span class="legend-color electric"></span>
                Electric
            </div>

            <div class="legend-item">
                <span class="legend-color program"></span>
                Write Program
            </div>
        </div>

        <!-- ================= Gantt ================= -->

        <div class="gantt-card shadow">
            <div id="gantt_here"></div>
        </div>

        <!-- ======= Popup create new task ========= -->
        <div id="task-create-popup" class="task-popup d-none">
            <div class="task-popup-header">
                <span>New Task</span>
                <button id="btn-close-task-popup" type="button" class="btn-close btn-close-sm">
                </button>
            </div>
            <input id="task-name" type="text" class="form-control form-control-sm mb-2" placeholder="Task name">
            <div class="d-flex gap-2 mb-2">
                <input id="task-start-date" type="date" class="form-control form-control-sm">
                <input id="task-duration" type="number" min="1" value="1" class="form-control form-control-sm"
                    style="width:80px;">
            </div>
            <select id="task-handler" multiple required></select>
            <div class="text-end mt-3">
                <button id="btn-create-task" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-lg"></i>
                    Create
                </button>
            </div>
        </div>

    </div>



</body>

<script type="module" src="../Script/workflow/workflow.js"></script>

</html>
