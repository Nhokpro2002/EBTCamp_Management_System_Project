<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Setup Workflow</title>

    <!-- Bootstrap -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- DHTMLX Gantt -->
    <link href="../Libs/Grantt/dhtmlxgantt.css" rel="stylesheet">
    <script src="../Libs/Grantt/dhtmlxgantt.js"></script>

    <link href="../CSS/workflow.css" rel="stylesheet">

    <!-- JQuery 4.0.0 -->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Tom Select -->
    <link href="../Libs/Tom-Select/tom-select.bootstrap5.css" rel="stylesheet">
    <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>

    <!-- Sweet Alert -->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <style>

    </style>
</head>

<body>
    <div class="wrapper">
        <!-- ================= Header ================= -->
        <div class="top-header shadow-sm">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <div class="project-info">
                        <i class="bi bi-folder-fill"></i>
                        <span>Project :</span>
                        <span class="project-info-name fw-semibold">
                            MES System Setup
                        </span>
                    </div>
                </div>

                <div>
                    <button type="button" class="btn btn-outline-secondary" id="back-project-page-button">
                        <i class="bi bi-arrow-left"></i>
                        Back
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= Gantt ================= -->
        <div class="gantt-card shadow">
            <div id="gantt_here"></div>
        </div>

    </div>

    <div id="taskModal" class="task-modal">
        <div class="task-modal-overlay" onclick="closeTaskModal()"></div>

        <div class="task-modal-content">

            <div class="task-modal-header">
                <h5>Create Task</h5>
            </div>

            <div class="task-modal-body">

                <!-- Stage (readonly) -->
                <label>Stage</label>
                <input id="stage-name" type="text" disabled />

                <!-- Task name -->
                <label>Task name</label>
                <input id="task-name" type="text" placeholder="Enter task name" />

                <!-- Start date -->
                <label>Start date</label>
                <input id="start-date" type="date" />

                <!-- Duration -->
                <label>Duration (days)</label>
                <input id="duration" type="number" min="1" placeholder="Days" />

            </div>

            <div class="task-modal-footer">
                <button id="btnCancel" class="btn-cancel">Cancel</button>
                <button id="btnCreate" class="btn-create">Create</button>
            </div>

        </div>
    </div>

</body>

<script type="module" src="../Script/workflow/main.js"></script>

</html>
