<!DOCTYPE html>
<html lang="vi">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <title>EBT Camp - Đăng ký</title>

     <!-- Bootstrap Icons -->
     <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

     <!-- JQuery -->
     <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

     <!-- Sweet Alert -->
     <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
     <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

     <!-- Bootstrap -->
     <link rel="stylesheet" href="../Libs/Bootstrap/css/bootstrap.min.css">
     <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

     <!-- Register CSS -->
     <link href="../CSS/register.css" rel="stylesheet">

</head>

<body>

     <div class="register-container">

          <!-- LEFT PANEL -->
          <div class="left-panel"></div>


          <!-- RIGHT PANEL -->
          <div class="right-panel">

               <div class="register-title">
                    ĐĂNG KÝ TÀI KHOẢN
               </div>


               <form id="register-form" onsubmit="return false;">

                    <div class="form-group">
                         <label class="form-label">
                              Mã nhân viên
                         </label>

                         <input type="text" class="form-control" id="employee_id" placeholder="Nhập mã nhân viên">

                         <div class="error" id="error_employee_id"></div>
                    </div>



                    <div class="form-group">

                         <label class="form-label">
                              Họ tên nhân viên
                         </label>

                         <input type="text" class="form-control" id="employee_name" placeholder="Họ và tên">

                         <div class="error" id="error_employee_name"></div>

                    </div>



                    <div class="form-group">

                         <label class="form-label">
                              Email
                         </label>

                         <input type="email" class="form-control" id="email" placeholder="name@lgdisplay.com">

                         <div class="error" id="errorEmail"></div>

                    </div>



                    <div class="form-group">

                         <label class="form-label">
                              Bộ phận
                         </label>

                         <select class="form-control" id="department">

                              <option value="">
                                   -- Chọn bộ phận --
                              </option>

                              <option value="Equipment Technology Part">
                                   Equipment Technology Part
                              </option>

                              <option value="Localization Part">
                                   Localization Part
                              </option>

                              <option value="Design - Mechanical Part">
                                   Design - Mechanical Part
                              </option>

                         </select>

                         <div class="error" id="errorDepartment"></div>

                    </div>


                    <div class="form-group">

                         <label class="form-label">
                              Chức vụ
                         </label>

                         <select class="form-control" id="position" multiple size="10">

                              <option value="Part Leader">Part Leader</option>
                              <option value="Senior Engineer">Senior Engineer</option>
                              <option value="Purchasing">Purchasing</option>
                              <option value="Technician">Technician</option>
                              <option value="Unit Leader">Unit Leader</option>
                              <option value="Engineer">Engineer</option>
                              <option value="Mechanical">Mechanical</option>
                              <option value="Electric">Electric</option>
                              <option value="Program">Program</option>
                              <option value="Robot">Robot</option>

                         </select>

                         <div class="error" id="error_position"></div>

                    </div>


                    <div class="form-group">

                         <label class="form-label">
                              Mật khẩu
                         </label>

                         <input type="password" class="form-control" id="password" placeholder="••••••••">

                         <div class="error" id="errorPassword"></div>

                    </div>





                    <div class="form-group">

                         <label class="form-label">
                              Xác nhận mật khẩu
                         </label>

                         <input type="password" class="form-control" id="passwordConfirm" placeholder="••••••••">


                         <div class="error" id="errorPasswordConfirm"></div>

                    </div>


                    <!-- BUTTON -->
                    <div class="register-action">

                         <button type="button" id="register-btn">

                              ĐĂNG KÝ TÀI KHOẢN

                         </button>

                    </div>


               </form>



               <div class="footer-text">

                    Đã có tài khoản?

                    <a href="./login.html">
                         Đăng nhập
                    </a>

               </div>


          </div>

     </div>


     <script type="module" src="../Script/register/register.js"></script>

</body>

</html>
