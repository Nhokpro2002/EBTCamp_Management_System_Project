<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../Libs/Bootstrap/css/bootstrap.min.css">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="../Libs/DataTables/datatables.min.css">
    <script src="../Libs/DataTables/datatables.min.js"></script>

    <!-- Bootstrap Icon -->
    <link rel="stylesheet" href="../Libs/BootstrapIcon/bootstrap-icons.css">

    <!-- Sweet Alert-->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- JQuery -->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>



    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #0d6efd, #0b5ed7);
            color: white;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.85);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .topbar {
            background: white;
            border-radius: 20px;
            padding: 16px 24px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .card-stat {
            border: none;
            border-radius: 20px;
            color: white;
            overflow: hidden;
            position: relative;
        }

        .card-stat i {
            font-size: 3rem;
            opacity: 0.2;
            position: absolute;
            right: 20px;
            bottom: 10px;
        }

        .table-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .progress {
            height: 8px;
            border-radius: 20px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }


        /* base style */
        #out-of-stock,
        #low-stock:hover {
            cursor: pointer;
        }

        .container-fluid {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-lg-2 p-4 sidebar">
                <h3 class="fw-bold mb-5">
                    <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                </h3>

                <nav class="nav flex-column">
                    <a class="nav-link" href="#" id="dashboard-link">
                        <i class="bi bi-house-door me-2"></i> Dashboard
                        <!--Admin thì xem được các vấn đề liên quan toàn hệ thống 
                        nhưng eng thông thường sẽ chỉ xem được các vấn đề, ... mà họ đang chịu trách nhiệm-->
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">
                        <i class="bi bi-box-seam me-2"></i> Inventory
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/order.html" id="order-link">
                        <i class="bi bi-cart me-2"></i> Order
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/setting.html" id="setting-link">
                        <i class="bi bi-gear me-2"></i> Setting
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                        <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                    </a>

                </nav>
            </div>

            <!-- Main -->
            <div class="col-lg-10 p-4">

                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-0">Dashboard Page</h3>
                        <small class="text-muted">Welcome back, User 👋</small>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light rounded-circle">
                            <i class="bi bi-bell"></i>
                        </button>

                        <div class="dropdown">
                            <img src="https://i.pravatar.cc/100" class="avatar dropdown-toggle"
                                data-bs-toggle="dropdown"
                                style="width:40px;height:40px;border-radius:50%;cursor:pointer" />

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" id="logoutLink" href="#">Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="row g-4 mb-4">

                    <div class="col-md-3">
                        <div class="card card-stat bg-primary p-3 shadow position-relative">
                            <h6 class="mb-3">Projects</h6>
                            <div class="mb-2" id="total-projects">
                                <span>Total Projects:</span>
                                <strong>10</strong>
                            </div>

                            <div class="mb-2" data-bs-toggle="tooltip" data-bs-placement="top"
                                title="Click to view all projets that done">
                                <span>✅ Done:</span>
                                <strong>
                                    5
                                </strong>
                            </div>
                            <div class="mb-2" data-bs-toggle="tooltip" data-bs-placement="top"
                                title="Click to view all products that are processed">
                                <span>⏳ Processing:</span>
                                <strong>
                                    5
                                </strong>
                            </div>
                            <i class="bi bi-boxes"></i>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card card-stat bg-success p-4 shadow">
                            <h6>Users</h6>
                            <h2>8,420</h2>
                            <p class="mb-0">+18% growth</p>
                            <i class="bi bi-people-fill"></i>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card card-stat bg-warning p-4 shadow">
                            <h6>Orders</h6>
                            <h2>1,245</h2>
                            <p class="mb-0">+7% this week</p>
                            <i class="bi bi-cart-fill"></i>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card card-stat bg-primary text-white p-3 shadow position-relative">
                            <h6 class="mb-3">Inventory Status</h6>

                            <div class="mb-2" id="total-items">
                                <span>📦 Total Items:</span>
                                <strong id="inventory-all-item-stock">1,240</strong>
                            </div>

                            <div class="mb-2" id="out-of-stock" data-bs-toggle="tooltip" data-bs-placement="top"
                                title="Click to view all products that are out of stock"
                                onclick="loadInventoryFilterPage('out-stock')">
                                <span>🔴 Out of Stock:</span>
                                <strong id="item-out-of-stock">
                                    0
                                </strong>
                            </div>

                            <div class="mb-2" id="low-stock" data-bs-toggle="tooltip" data-bs-placement="top"
                                title="Click to view products that are low stock"
                                onclick="loadInventoryFilterPage('low-stock')">
                                <span>🟡 Low Stock:</span>
                                <strong id="item-low-stock">
                                    0
                                </strong>
                            </div>


                            <i class="bi bi-box-seam-fill card-icon"></i>
                        </div>
                    </div>

                </div>

                <!-- Content -->
                <!--<div class="row g-4">-->
                <iframe id="content-frame" style="width:100%; height:100%; border:none;" src="">
                </iframe>

                <!--</div>-->

            </div>
        </div>
    </div>

</body>
<script>

    const POCKETBASE_URL = "http://127.0.0.1:8090";
    const COLLECTION_ORDER_ITEMS = "Order_Items";
    const COLLECTION_ORDERS = "Orders";
    const COLLECTION_ITEMS = "Items";
    const COLLECTION_USERS = "Users";
    const COLLECTION_EXPORT_ITEM = "Export_Items";

    function checkAuthentication() {
        const token = localStorage.getItem("token");
        if (!token || token.trim() === "") {
            Swal.fire({
                icon: 'warning',      // icon của popup: 'warning', 'error', 'success', 'info', 'question'
                title: 'Access Denied',
                text: 'You must log in to access this page',
                confirmButtonText: 'Go to Login'
            }).then(() => {
                window.location.href = "http://127.0.0.1:5500/Page/login.html"; // chuyển hướng sau khi user bấm OK
            });

            return false;

            // ngăn chặn load tiếp các script
        }
        return true;
    }


    let inventoryData = {};

    $(document).ready(function () {

        if (!checkAuthentication()) return;

        document.querySelector(".container-fluid").style.display = "block";

        // Init tooltip 
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        const tooltipList = [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el));


        // process focus option sidebar

        const currentPage = window.location.pathname;

        if (currentPage.includes('dashboard')) {
            document.getElementById('dashboard-link').classList.add('active');
        } else if (currentPage.includes('order')) {
            document.getElementById('order-link').classList.add('active');
        } else if (currentPage.includes('user')) {
            document.getElementById('user-link').classList.add('active');
        } else if (currentPage.includes('setting')) {
            document.getElementById('setting-link').classList.add('active');
        } else if (currentPage.includes('project')) {
            document.getElementById('project-link').classList.add('active');
        }

        // process inventory data
        // fetch data of all items in the warehouse
        // filter out items that are out of stock
        // filter out items that are low in stock
        // calculate the total number of items in the inventory

        async function getInventoryData() {
            try {

                const token = localStorage.getItem('token');
                const response = await fetch(`${POCKETBASE_URL}/api/collections/${COLLECTION_ITEMS}/records`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                inventoryData = await response.json();


                $('#inventory-all-item-stock').text(inventoryData.items.length);

                const outOfStockCount = inventoryData.items.filter(item => Number(item.remain) === 0).length;

                const lowStockCount = inventoryData.items.filter(item => {
                    const remain = Number(item.remain);
                    return remain > 0 && remain <= 10;
                }).length;

                // Update UI
                $('#item-out-of-stock').text(outOfStockCount);
                $('#item-low-stock').text(lowStockCount);

            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        getInventoryData();

        changeIconAvatar();

        changeTopbarText();


    })

    /*
    Function open popup
    */
    function loadInventoryFilterPage(type) {
        const iframe = document.getElementById('content-frame');
        iframe.src = `dashboard_inventory_filter.html?type=${type}`;
    }

    document.getElementById("logoutLink").addEventListener("click", function (e) {
        e.preventDefault(); // ngăn link reload trang
        // Xóa storage
        localStorage.clear();
        sessionStorage.clear();

        // Redirect về trang login hoặc homepage nếu muốn
        window.location.href = "http://127.0.0.1:5500/Page/login.html";
    });

    function changeIconAvatar() {
        const dropdownAvatar = document.querySelector('.dropdown img');
        const userData = JSON.parse(localStorage.getItem("user"));

        if (!dropdownAvatar || !userData) return;

        dropdownAvatar.src =
            `${POCKETBASE_URL}/api/files/${COLLECTION_USERS}/${userData.id}/${userData.avatar}?t=${Date.now()}`;
    }

    function changeTopbarText() {
        const topbarText = document.querySelector('.topbar .text-muted');
        const userData = JSON.parse(localStorage.getItem("user"));

        if (!topbarText || !userData) return;

        topbarText.textContent = `Welcome back, ${userData.employee_id} 👋`;
    }

</script>

</html>
