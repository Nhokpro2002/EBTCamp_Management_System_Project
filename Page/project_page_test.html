<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Project Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .graph {
            display: flex;
            justify-content: space-between;
            width: 80%;
            margin: 40px 0;
            position: relative;
        }

        .node {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            transition: background 0.3s;
        }

        .node.completed {
            background: #4caf50;
        }

        .node.processing {
            background: #ffeb3b;
        }

        .node.error {
            background: #f44336;
        }

        .line {
            height: 4px;
            background: #999;
            position: absolute;
            top: 28px;
            z-index: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2196f3;
            position: absolute;
            top: -50px;
            left: 0;
            transition: all 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        .progress-container {
            width: 80%;
            background: #eee;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-bar {
            height: 100%;
            background: #4caf50;
            width: 0%;
            transition: width 0.5s ease;
        }

        .task-buttons {
            margin-top: 20px;
        }

        .task-buttons button {
            margin-right: 10px;
            padding: 10px 15px;
        }

        .branch-line {
            position: absolute;
            height: 3px;
            background: #f44336;
            z-index: 0;
        }

        .branch-node {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffcccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <h2>Project Dashboard (Demo)</h2>
        <div class="graph" id="graph">
            <!-- Nodes sẽ được render JS -->
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="task-buttons">
            <button onclick="moveAvatar(0)">Giai đoạn 1</button>
            <button onclick="moveAvatar(1)">Giai đoạn 2</button>
            <button onclick="moveAvatar(2)">Giai đoạn 3</button>
            <button onclick="moveAvatar(3)">Giai đoạn 4</button>
            <button onclick="moveAvatar(4)">Giai đoạn 5</button>
            <button onclick="simulateError()">Tách nhánh lỗi</button>
            <button onclick="mergeError()">Merge nhánh</button>
        </div>
    </div>

    <script>
        const stages = [
            { name: "Giai đoạn 1", weight: 20, status: "pending" },
            { name: "Giai đoạn 2", weight: 20, status: "pending" },
            { name: "Giai đoạn 3", weight: 20, status: "pending" },
            { name: "Giai đoạn 4", weight: 20, status: "pending" },
            { name: "Giai đoạn 5", weight: 20, status: "pending" },
        ];

        const graph = document.getElementById("graph");

        // Tạo các node
        stages.forEach((stage, index) => {
            const node = document.createElement("div");
            node.className = "node";
            node.id = "node-" + index;
            node.innerText = index + 1;
            graph.appendChild(node);

            // tạo line nối
            if (index < stages.length - 1) {
                const line = document.createElement("div");
                line.className = "line";
                line.style.width = "calc(20% - 60px)";
                line.style.left = `calc(${index * 20}% + 60px)`;
                graph.appendChild(line);
            }
        });

        // Avatar engineer
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.id = "avatar";
        avatar.innerText = "E";
        graph.appendChild(avatar);

        let currentStage = 0;

        function moveAvatar(stageIndex) {
            currentStage = stageIndex;
            const node = document.getElementById("node-" + stageIndex);
            const rect = node.getBoundingClientRect();
            const graphRect = graph.getBoundingClientRect();
            const left = rect.left - graphRect.left;
            avatar.style.left = left + "px";

            // Cập nhật trạng thái node
            node.className = "node processing";

            // Giả lập hoàn thành sau 1.5s
            setTimeout(() => {
                node.className = "node completed";
                stages[stageIndex].status = "completed";
                updateProgress();
            }, 1500);
        }

        function updateProgress() {
            let total = 0;
            stages.forEach(stage => {
                total += stage.status === "completed" ? stage.weight : 0;
            });
            document.getElementById("progress-bar").style.width = total + "%";
        }

        function simulateError() {
            const node = document.getElementById("node-" + currentStage);
            node.className = "node error";
        }

        function mergeError() {
            const node = document.getElementById("node-" + currentStage);
            node.className = "node completed";
            stages[currentStage].status = "completed";
            updateProgress();
        }

        let errorBranch = null;

        function simulateError() {
            const node = document.getElementById("node-" + currentStage);

            // đổi màu node chính
            node.className = "node error";

            // nếu chưa có branch thì tạo branch mới
            if (!errorBranch) {
                createErrorBranch(currentStage);
            }
        }

        function createErrorBranch(stageIndex) {
            const baseNode = document.getElementById("node-" + stageIndex);
            const rect = baseNode.getBoundingClientRect();
            const graphRect = graph.getBoundingClientRect();

            const offsetLeft = rect.left - graphRect.left;

            // tạo line nhánh
            const branchLine = document.createElement("div");
            branchLine.className = "branch-line";
            branchLine.style.width = "120px";
            branchLine.style.left = offsetLeft + "px";
            branchLine.style.top = "120px"; // xuống dưới main line

            // tạo node lỗi
            const branchNode = document.createElement("div");
            branchNode.className = "branch-node";
            branchNode.style.left = (offsetLeft + 120) + "px";
            branchNode.style.top = "105px";
            branchNode.innerText = "B";

            graph.appendChild(branchLine);
            graph.appendChild(branchNode);

            errorBranch = {
                line: branchLine,
                node: branchNode,
                stageIndex
            };

            // đưa avatar sang branch luôn
            moveAvatarToBranch(offsetLeft + 120);
        }

        function moveAvatarToBranch(x) {
            avatar.style.left = x + "px";
            avatar.style.top = "80px";
        }

        function mergeError() {
            if (!errorBranch) return;

            const node = document.getElementById("node-" + currentStage);
            node.className = "node completed";
            stages[currentStage].status = "completed";

            // xoá branch (merge lại)
            errorBranch.line.remove();
            errorBranch.node.remove();
            errorBranch = null;

            // đưa avatar về main line
            avatar.style.top = "-50px";

            updateProgress();
        }

    </script>
</body>

</html>
