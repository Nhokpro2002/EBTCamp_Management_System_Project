<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Setup Workflow</title>

    <!-- Bootstrap -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- DHTMLX Gantt -->
    <link href="../Libs/Grantt/dhtmlxgantt.css" rel="stylesheet">
    <script src="../Libs/Grantt/dhtmlxgantt.js"></script>


    <style>
        body {
            margin: 0;
            background: #edf1f7;
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ============================== */

        .wrapper {
            padding: 20px;
        }

        /* ============================== */

        .top-header {
            background: white;
            padding: 20px 28px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .project-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .project-info {
            color: #777;
            font-size: 15px;
        }

        /* ============================== */

        .toolbar {
            background: white;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ============================== */

        .left-toolbar {
            display: flex;
            gap: 10px;
        }

        .right-toolbar {
            display: flex;
            gap: 8px;
        }

        /* ============================== */

        .legend {
            background: white;
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            gap: 30px;
            align-items: center;
            margin-bottom: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #555;
        }

        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
        }

        /* ============================== */

        .design {
            background: #1976d2;
        }

        .mechanical {
            background: #00acc1;
        }

        .assembly {
            background: #43a047;
        }

        .electric {
            background: #fb8c00;
        }

        .program {
            background: #7b1fa2;
        }

        /* ============================== */

        .gantt-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            height: 78vh;
        }

        /* ============================== */

        #gantt_here {
            width: 100%;
            height: 100%;
        }

        /* ============================== */
        /* DHTMLX */

        .gantt_grid_head_cell {
            background: #34495e;
            color: white;
            font-weight: 600;
            border: none;
        }

        .gantt_scale_cell {
            background: #34495e;
            color: white;
            border-color: #4a6177;
        }

        .gantt_grid_data {
            background: white;
        }

        .gantt_row {
            border-color: #f0f0f0;
        }

        .gantt_task_row {
            border-color: #f3f3f3;
        }

        .gantt_today {
            background: rgba(255, 0, 0, .08);
        }

        .gantt_task_line {
            border-radius: 6px;
        }

        .gantt_task_progress {
            border-radius: 6px;
        }

        .gantt_tree_icon {
            color: #666;
        }

        .gantt_tree_content {
            font-weight: 500;
        }

        .gantt_task_line:hover {
            filter: brightness(1.08);
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <!-- ================= Header ================= -->

        <div class="top-header shadow-sm">

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <h3 class="project-title">
                        <i class="bi bi-diagram-3-fill text-primary"></i>
                        Machine Setup Project
                    </h3>

                    <div class="project-info">

                        Project :
                        <span class="fw-semibold">
                            Conveyor Assembly Line
                        </span>

                    </div>

                </div>

                <div>

                    <button class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i>
                        Back
                    </button>

                </div>

            </div>

        </div>



        <!-- ================= Toolbar ================= -->

        <div class="toolbar shadow-sm">

            <div class="left-toolbar">

                <button class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i>
                    Add Task
                </button>

                <button class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-pencil-square"></i>
                    Edit
                </button>

                <button class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-trash"></i>
                    Delete
                </button>

            </div>

            <div class="right-toolbar">

                <button class="btn btn-outline-dark btn-sm">
                    Day
                </button>

                <button class="btn btn-outline-dark btn-sm">
                    Week
                </button>

                <button class="btn btn-outline-dark btn-sm">
                    Month
                </button>

            </div>

        </div>



        <!-- ================= Legend ================= -->

        <div class="legend shadow-sm">
            <div class="legend-item">
                <span class="legend-color design"></span>
                Design
            </div>

            <div class="legend-item">
                <span class="legend-color mechanical"></span>
                Mechanical
            </div>

            <div class="legend-item">
                <span class="legend-color assembly"></span>
                Assembly
            </div>

            <div class="legend-item">
                <span class="legend-color electric"></span>
                Electric
            </div>

            <div class="legend-item">
                <span class="legend-color program"></span>
                Write Program
            </div>
        </div>

        <!-- ================= Gantt ================= -->

        <div class="gantt-card shadow">
            <div id="gantt_here"></div>
        </div>

    </div>

</body>

<script type="module" src="../Script/stage/stage.js"></script>

</html>
