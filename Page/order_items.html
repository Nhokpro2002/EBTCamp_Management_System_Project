<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Order Detail</title>

     <!-- Bootstrap -->
     <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
     <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

     <!-- Bootstrap Icon -->
     <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

     <!-- Sweet Alert -->
     <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
     <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

     <!-- Sweet Alert -->
     <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

     <!-- Sortable -->
     <script src="../Libs/Sortable/sortable.min.js"></script>

     <link href="../Libs/Tom-Select/tom-select.bootstrap5.css">

     <!-- CSS -->
     <link href="../CSS/order_items.css" rel="stylesheet">
     <script src="../Libs/Tom-Select/tom-select.complete.min.js"></script>
</head>

<body>
     <div class="container-fluid py-3">
          <!-- ================= Inventory ================= -->
          <div class="card inventory-card mb-3">
               <div class="card-body">
                    <!-- Toolbar -->
                    <div class="mb-3">

                         <!-- Hàng 1 -->
                         <div class="d-flex justify-content-between align-items-center">
                              <div class="d-flex gap-2">
                                   <div class="input-group" style="width:320px">
                                        <span class="input-group-text">
                                             <i class="bi bi-search"></i>
                                        </span>
                                        <input type="text" class="form-control" id="searchInput"
                                             placeholder="Search item...">
                                   </div>

                                   <button class="btn btn-outline-secondary" data-bs-toggle="collapse"
                                        data-bs-target="#filterPanel">
                                        <i class="bi bi-funnel"></i>
                                        Filter
                                        <i class="bi bi-chevron-down ms-1"></i>
                                   </button>
                              </div>
                         </div>

                         <!-- Hàng 2 -->
                         <div class="collapse mt-3" id="filterPanel">
                              <div class="card filter-card">
                                   <div class="row align-items-end g-3">
                                        <!-- Danh mục -->
                                        <div class="col">
                                             <label class="form-label">Category</label>
                                             <select class="form-select" id="typeFilter">
                                                  <option>All Category</option>
                                                  <option>PLC</option>
                                                  <option>Power 24V</option>
                                                  <option>Relay</option>
                                                  <option>Contactor</option>
                                             </select>
                                        </div>
                                        <!-- Thương hiệu -->
                                        <div class="col">
                                             <label class="form-label">Brand</label>
                                             <select class="form-select" id="brandFilter">
                                                  <option>All Brand</option>
                                                  <option>LS</option>
                                                  <option>Mitsubishi</option>
                                                  <option>Chint</option>
                                                  <option>Omron</option>
                                             </select>
                                        </div>
                                        <!-- Trạng thái -->
                                        <div class="col">
                                             <label class="form-label">Trạng Thái</label>
                                             <select class="form-select">
                                                  <option>Tất cả</option>
                                                  <option>Còn hàng</option>
                                                  <option>Sắp hết</option>
                                                  <option>Hết hàng</option>
                                             </select>
                                        </div>
                                        <!-- Áp dụng -->
                                        <div class="col-auto">
                                             <button class="btn btn-success px-4" style="height:46px;">
                                                  <i class="bi bi-funnel"></i>
                                                  Apply
                                             </button>
                                        </div>
                                        <!-- Đặt lại -->
                                        <div class="col-auto">
                                             <button class="btn btn-outline-secondary px-4" style="height:46px;">
                                                  <i class="bi bi-arrow-counterclockwise"></i>
                                                  Reset
                                             </button>
                                        </div>
                                   </div>
                              </div>
                         </div>
                    </div>

                    <!-- Inventory -->
                    <div id="inventoryItemList"></div>
               </div>


          </div>

     </div>


     <!-- ================= ORDER ================= -->

     <div class="card">
          <div class="card-body">
               <!-- Table -->
               <div class="table-responsive">
                    <table class="table align-middle">
                         <thead>
                              <tr>
                                   <th>Name</th>
                                   <th>Model</th>
                                   <th>XCode/QCode</th>
                                   <th>Project</th>
                                   <th>Order</th>
                                   <th>Unit Price</th>
                                   <th>Total Price</th>
                                   <th>Requester</th>
                              </tr>
                         </thead>

                         <tbody id="orderTable"></tbody>
                    </table>
               </div>


               <!-- Footer -->
               <div class="d-flex justify-content-end mt-4"></div>
          </div>

     </div>

     </div>

</body>

<script type="module" src="../Script/order_items/main.js"></script>

</html>
