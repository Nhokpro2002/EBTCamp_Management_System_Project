<!DOCTYPE html>
<html lang="vi">

<head>
    <script src="../Script/auth/auth.js"></script>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Chi tiết đặt hàng</title>

     <!-- Bootstrap -->
     <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
     <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

     <!-- Bootstrap Icon -->
     <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

     <!-- Sweet Alert -->
     <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
     <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

     <!-- ExcelJS -->
     <script src="../Libs/ExcelJS/exceljs.min.js"></script>

     <!-- CSS -->
     <link href="../CSS/order_items.css" rel="stylesheet">
</head>

<body>
     <div class="container-fluid py-1">
          <!-- ================= Inventory ================= -->
          <div class="card inventory-card mb-3">
               <div class="card-body">
                    <!-- Toolbar -->
                    <div class="mb-3">

                         <!-- Hàng 1 -->
                         <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                              <div class="d-flex gap-2">
                                   <div class="input-group" style="width:320px">
                                        <span class="input-group-text">
                                             <i class="bi bi-search"></i>
                                        </span>
                                        <input type="text" class="form-control" id="searchInput"
                                             placeholder="Tìm vật tư...">
                                   </div>

                                   <button class="btn btn-outline-secondary" data-bs-toggle="collapse"
                                        data-bs-target="#filterPanel">
                                        <i class="bi bi-funnel"></i>
                                        Bộ lọc
                                        <i class="bi bi-chevron-down ms-1"></i>
                                   </button>

                              </div>

                              <select class="form-select" id="projectFilter" aria-label="Chọn dự án">
                                   <option value="">Chọn dự án</option>
                              </select>

                              <button class="btn btn-outline-secondary ms-auto" id="back-project-page-button">
                                   <i class="bi bi-arrow-left"></i>
                                   Quay lại
                              </button>
                         </div>

                         <!-- Hàng 2 -->
                         <div class="collapse mt-3" id="filterPanel">
                              <div class="card filter-card">
                                   <div class="row align-items-end g-3">
                                        <!-- Danh mục -->
                                        <div class="col">
                                             <label class="form-label">Nhóm</label>
                                             <select class="form-select" id="typeFilter">
                                                  <option value="">Tất cả nhóm</option>
                                                  <option>PLC</option>
                                                  <option>Power 24V</option>
                                                  <option>Relay</option>
                                                  <option>Contactor</option>
                                                  <option>MCB</option>
                                                  <option>MCCB</option>
                                             </select>
                                        </div>
                                        <!-- Thương hiệu -->
                                        <div class="col">
                                             <label class="form-label">Hãng</label>
                                             <select class="form-select" id="brandFilter">
                                                  <option value="">Tất cả hãng</option>
                                                  <option>LS</option>
                                                  <option>Mitsubishi</option>
                                                  <option>Chint</option>
                                                  <option>Omron</option>
                                             </select>
                                        </div>

                                        <!-- Reset button -->
                                        <div class="col-auto">
                                             <button class="btn btn-outline-secondary px-4" id="resetFilters" type="button" style="height:46px;">
                                                  <i class="bi bi-arrow-counterclockwise"></i>
                                                  Đặt lại
                                             </button>
                                        </div>
                                   </div>
                              </div>
                         </div>
                    </div>

                    <!-- Inventory -->
                    <div id="inventoryItemList"></div>
               </div>


          </div>
     </div>


     <!-- ================= ORDER ================= -->
     <div class="d-flex justify-content-end align-items-center gap-2 mb-3">
          <button id="btnExport" class="btn btn-success shadow-sm" disabled>
               <i class="bi bi-file-earmark-excel me-2"></i>
               Xuất Excel
          </button>
          <button id="btnSave" class="btn btn-primary shadow-sm" disabled>
               <i class="bi bi-floppy me-2"></i>
               Lưu
          </button>
          <button id="btnDelete" class="btn btn-danger shadow-sm" disabled style="margin-right: 10px;">
               <i class="bi bi-trash me-2"></i>
               Xóa
          </button>
     </div>

     <div class="container-fluid" id="order-item-table">
          <div class="card inventory-card mb-3">
               <div class="card-body-1">
                    <!-- Table -->
                    <div class="table-responsive">
                         <table class="table align-middle">
                              <thead>
                                   <tr>
                                        <th style="width: 40px;" class="text-center">
                                             <input type="checkbox" id="checkAll" class="form-check-input big-checkbox" aria-label="Chọn tất cả dòng">
                                        </th>
                                        <th>Tên vật tư</th>
                                        <th>Model</th>
                                        <th>XCode/QCode</th>
                                        <th>Dự án</th>
                                        <th>SL đặt</th>
                                        <th>Đơn giá</th>
                                        <th>Thành tiền</th>
                                        <th>Người yêu cầu</th>
                                   </tr>
                              </thead>

                              <tbody id="orderTable"></tbody>
                         </table>
                    </div>


                    <!-- Footer -->
                    <div class="d-flex justify-content-end mt-4"></div>
               </div>

          </div>
     </div>


</body>

<script type="module" src="../Script/order/order_items.js"></script>

</html>
