<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Order Detail</title>

     <!-- Bootstrap -->
     <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
     <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

     <!-- Bootstrap Icon -->
     <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

     <!-- CSS -->
     <link href="../CSS/order_items.css" rel="stylesheet">
</head>

<body>

     <div class="container-fluid py-3">

          <!-- ================= Inventory ================= -->

          <div class="card inventory-card mb-3">

               <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">



                         <div class="d-flex gap-2">

                              <div class="input-group" style="width:320px">

                                   <span class="input-group-text">
                                        <i class="bi bi-search"></i>
                                   </span>

                                   <input type="text" class="form-control" placeholder="Tìm kiếm item...">

                              </div>

                              <button class="btn btn-outline-secondary">
                                   <i class="bi bi-funnel"></i>
                                   Bộ lọc
                              </button>

                              <div class="btn-group">

                                   <button class="btn btn-success">
                                        <i class="bi bi-grid"></i>
                                        Lưới
                                   </button>

                                   <button class="btn btn-outline-secondary">
                                        <i class="bi bi-list"></i>
                                        Danh sách
                                   </button>

                              </div>

                         </div>

                    </div>

                    <!-- Inventory -->

                    <div class="row g-3">

                         <!-- Item -->

                         <div class="col-xl-2 col-lg-3 col-md-4">

                              <div class="inventory-item">

                                   <div class="d-flex">

                                        <img src="../Images/bearing.png" class="item-image">

                                        <div class="ms-3 flex-grow-1">

                                             <h6>Vòng bi 6205-2RS</h6>

                                             <div class="text-muted">
                                                  BRG-6205-2RS
                                             </div>

                                             <span class="badge bg-success">
                                                  120
                                             </span>

                                        </div>

                                   </div>

                              </div>

                         </div>

                         <!-- duplicate -->

                         <div class="col-xl-2 col-lg-3 col-md-4">

                              <div class="inventory-item">

                                   <div class="d-flex">

                                        <img src="../Images/rail.png" class="item-image">

                                        <div class="ms-3">

                                             <h6>Ray trượt HGR20</h6>

                                             <div class="text-muted">
                                                  HGR20
                                             </div>

                                             <span class="badge bg-success">
                                                  45
                                             </span>

                                        </div>

                                   </div>

                              </div>

                         </div>

                         <!-- render bằng JS sau -->

                    </div>

                    <!-- Drop -->

                    <div class="drop-zone mt-4">

                         <i class="bi bi-hand-index-thumb fs-2"></i>

                         <div>
                              Kéo item từ kho xuống đây để thêm vào đơn hàng
                         </div>

                    </div>

               </div>

          </div>


          <!-- ================= ORDER ================= -->

          <div class="card">

               <div class="card-body">
                    <!-- Table -->

                    <div class="table-responsive">

                         <table class="table align-middle">

                              <thead>

                                   <tr>

                                        <th>#</th>

                                        <th>Ảnh</th>

                                        <th>Tên hàng</th>

                                        <th>Model</th>

                                        <th>Quy cách</th>

                                        <th width="150">

                                             Số lượng

                                        </th>

                                        <th>

                                             Đơn giá

                                        </th>

                                        <th>

                                             Thành tiền

                                        </th>

                                        <th></th>

                                   </tr>

                              </thead>

                              <tbody id="orderTable">

                                   <tr>

                                        <td>1</td>

                                        <td>

                                             <img src="../Images/bearing.png" class="table-image">

                                        </td>

                                        <td>

                                             Vòng bi 6205-2RS

                                        </td>

                                        <td>

                                             BRG-6205

                                        </td>

                                        <td>

                                             25x52x15

                                        </td>

                                        <td>

                                             <input type="number" class="form-control" value="10">

                                        </td>

                                        <td>

                                             35.000

                                        </td>

                                        <td class="text-success fw-bold">

                                             350.000

                                        </td>

                                        <td>

                                             <button class="btn btn-sm btn-danger">

                                                  <i class="bi bi-trash"></i>

                                             </button>

                                        </td>

                                   </tr>

                              </tbody>

                         </table>

                    </div>


                    <!-- Footer -->
                    <div class="d-flex justify-content-end mt-4">
                    </div>

               </div>

          </div>

     </div>

</body>

</html>
