<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects Dashboard</title>

    <!-- Bootstrap 5 -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- Project Page CSS -->
    <link href="../CSS/inventory.css" rel="stylesheet">

    <!-- JQuery 4.0.0-->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Sweet Alert-->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <style>
    </style>

</head>

<body>
    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-lg-2 p-4 sticky-top"
                style="height: 100vh; background: linear-gradient(180deg, #0d6efd, #0b5ed7); color: white;">
                <h3 class="fw-bold mb-5">
                    <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                </h3>

                <nav class="nav flex-column">
                    <a class="nav-link" id="inventory-link">
                        <i class="bi bi-boxes me-2"></i> Inventory
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="http://127.0.0.1:5500/Page/user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                        <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                    </a>
                </nav>
            </div>

            <div class="col-lg-10 p-4">
                <!-- Topbar -->
                <div class="d-flex justify-content-between align-items-center mb-2"
                    style="background: white; border-radius: 20px; padding: 16px 24px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);">
                    <div>
                        <h3 class="fw-bold mb-0">Orders Page</h3>
                        <small class="text-muted">Welcome back, User👋</small>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button type="button" class="btn btn-light rounded-circle">
                            <i class="bi bi-bell"></i>
                        </button>

                        <div class="dropdown">
                            <img src="https://i.pravatar.cc/100" class="dropdown-toggle" data-bs-toggle="dropdown"
                                style="width:40px;height:40px;border-radius:50%;cursor:pointer; object-fit: cover;" />

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" id="logoutLink" href="#">Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="inventory-card shadow-sm">
                    <div class="inventory-header">
                        <h5 class="mb-0 fw-bold">
                            Products
                        </h5>

                        <div class="d-flex gap-2">
                            <select class="form-select w-auto">
                                <option>All Brands</option>
                            </select>

                            <select class="form-select  w-auto">
                                <option>All Types</option>
                            </select>

                            <button class="btn btn-light border w-auto ">
                                <i class="bi bi-funnel"></i>
                                Filters
                            </button>

                            <button class="btn btn-light border w-auto">
                                <i class="bi bi-download"></i>
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">

                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Image</th>
                                    <th>Name</th>
                                    <th>Model</th>
                                    <th>Code</th>
                                    <th>Brand</th>
                                    <th>Type</th>
                                    <th>Stock</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="inventoryTable"></tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center p-3 border-top">
                        <span id="pageInfo" class="text-muted small"></span>
                        <nav>
                            <ul class="pagination pagination-sm mb-0" id="pagination">
                            </ul>
                        </nav>
                    </div>

                </div>

            </div>

        </div>

    </div>


</body>

<script type="module" src="../Script/inventory/main.js"></script>

</html>
