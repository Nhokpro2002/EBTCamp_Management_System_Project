<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Bootstrap CSS -->
    <link href="../CSS/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/bootstrap.min.css.map" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="../Libs/DataTables/datatables.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <!--font chữ Nunito đẹp-->

    <style>
        body {
            font-family: 'Nunito', sans-serif;
        }

        .sidebar {
            background-color: #fffdfd;
            height: 95vh;
            /* full height viewport */
        }

        .topbar {
            background-color: #8a8383;
            height: 50px;
        }

        li.nav-item.mb-2.d-flex.align-items-center {
            cursor: pointer;
            transition: color 0.3s, background-color 0.3s;
        }

        li.nav-item.mb-2.d-flex.align-items-center:hover {
            background-color: #D3D3D3;
            border-radius: 3px;
        }

        .nav-item:hover .material-icons,
        .nav-item:hover .nav-link {
            color: #000 !important;
        }

        #my_table tbody tr {
            border-bottom: 2px solid #ccc;
            border-top: 2px solid #ccc;
            border-right: 2px solid #ccc;
            border-left: 2px solid #ccc;
        }

        #my_table th {
            padding: 10px 15px;
            white-space: nowrap;
        }

        #my_table_wrapper {
            width: 1200px !important;
        }

        .item_img_cell:hover {
            cursor: pointer;
        }

        #modalClose:hover {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container-fluid p-3">
        <div class="row h-100">
            <div class="col-2 sidebar border" style="border-radius: 4.8px 0px 0px 4.8px !important;">
                <div style="text-align: center; margin-top: 15px;">
                    <span style="font-size: larger; font-weight: 700;">EBT
                        Camp</span>
                </div>
                <ul class="nav flex-column p-3">
                    <li class="nav-item mb-2 d-flex align-items-center">
                        <span class="material-icons ms-2 text-secondary">
                            home
                        </span>
                        <a class="nav-link text-secondary fw-bold" href="#dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item mb-2 d-flex align-items-center">
                        <span class="material-icons ms-2 text-secondary">
                            warehouse
                        </span>
                        <a class="nav-link text-secondary fw-bold" href="#inventory">Inventory</a>
                    </li>
                    <li class="nav-item mb-2 d-flex align-items-center">
                        <span class="material-icons ms-2 text-secondary">
                            category
                        </span>
                        <a class="nav-link text-secondary fw-bold" href="#production">Production</a>
                    </li>
                    <li class="nav-item mb-2 d-flex align-items-center">
                        <span class="material-icons ms-2 text-secondary">
                            list_alt
                        </span>
                        <a class="nav-link text-secondary fw-bold" href="#order">Order</a>
                    </li>
                    <li class="nav-item mb-2 d-flex align-items-center">
                        <span class="material-icons ms-2 text-secondary">
                            account_box
                        </span>
                        <a class="nav-link text-secondary fw-bold" href="#useraccess">User Access</a>
                    </li>
                    <li class="nav-item mb-2 d-flex align-items-center">
                        <span class="material-icons ms-2 text-secondary">
                            help_center
                        </span>
                        <a class="nav-link text-secondary fw-bold" href="#support">Support</a>
                    </li>
                    <li class="nav-item mb-2 d-flex align-items-center">
                        <span class="material-icons ms-2 text-secondary">
                            settings
                        </span>
                        <a class="nav-link text-secondary fw-bold" href="#settings">Settings</a>
                    </li>
                </ul>
            </div>
            <div class="col-10 d-flex flex-column" style="padding-left: 0px !important; padding-right: 0px !important;">
                <div class="topbar border" style="border-radius: 0px 4.8px 0px 0px !important;"></div>
                <div class="border main-content d-flex justify-content-center px-1"
                    style="height: 645px; border-radius: 0px 0px 4.8px 0px !important">
                    <table id="my_table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>XCode</th>
                                <th>QCode</th>
                                <th>QRCode</th>
                                <th>Brand</th>
                                <th>Stock</th>
                                <th>Model</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="itemModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;">

        <div
            style="background: white; padding: 20px; border-radius: 8px; min-width: 800px; min-height: 600px; position: relative">

            <!-- Nút đóng modal -->
            <span class="material-icons" id="modalClose"
                style="position: absolute; top: 10px; right: 10px; cursor: pointer; font-weight: bold;">
                close
            </span>
            <div style="display: flex; gap: 10px; height: 250px;">
                <div style="flex: 1; min-height: 100px;">
                    <img id="modalImage" src="" style="width: 100%; height: auto; border-radius: 8px;">
                </div>
                <div style="flex: 2; min-height: 100px;">
                    <p><strong>Name</strong><span id="modalName"></span></p>
                    <p><strong>XCode:</strong> <span id="modalXCode"></span></p>
                    <p><strong>QCode:</strong> <span id="modalQCode"></span></p>
                    <p><strong>QRCode:</strong> <span id="modalQRCode"></span></p>
                    <p><strong>Brand:</strong> <span id="modalBrand"></span></p>
                    <p><strong>Specification:</strong> <span id="modalSpecification"></span></p>
                    <p><strong>Stock:</strong> <span id="modalStock"></span></p>
                    <p><strong>Model:</strong> <span id="modalModel"></span></p>
                </div>
            </div>
            <div style="min-height: 100px; background-color: aquamarine;">

            </div>

            <!-- 2 div con chia tỉ lệ 1:2 -->

        </div>
    </div>
    <!-- Bootstrap JS -->
    <!--<script src="../Script/bootstrap.bundle.min.js"></script>-->
    <!--<script src="../Script/bootstrap.bundle.min.js.map"></script>-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="../Libs/DataTables/datatables.min.js"></script>

</body>

<script>

    let itemData = null;
    const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjb2xsZWN0aW9uSWQiOiJwYmNfMzE0MjYzNTgyMyIsImV4cCI6MTc3OTYwOTAyNywiaWQiOiJhMHpxZ2ZtMTJpbnFxdmsiLCJyZWZyZXNoYWJsZSI6dHJ1ZSwidHlwZSI6ImF1dGgifQ.PCdtJepeT7HYK6wrTieIBrw1oBvnGv212SIeuwUReSU";
    const POCKETBASE_URL = "http://127.0.0.1:8090";
    const COLLECTION_NAME = "Items";

    $(document).ready(function () {

        async function fetchData() {
            try {
                const response = await fetch(`${POCKETBASE_URL}/api/collections/${COLLECTION_NAME}/records`, {
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const result = await response.json();
                itemData = result;
                console.log('Fetched records:', result);

                /*
                const tableData = result.items.map(item => [
                    `<img class = "item_img_cell" src="${item.image ? POCKETBASE_URL + '/api/files/' + COLLECTION_NAME + '/' + item.id + '/' + item.image : ''}" alt="img" width="50" title="Click to see more">`,
                    item.name || '',
                    item.x_code || '',
                    item.q_code || '',
                    item.qr_code || '',
                    item.brand || '',
                    item.stock,
                    item.model || ''
                ]);
                */

                const tableData = result.items.map(item => ({
                    image: item.image ? POCKETBASE_URL + '/api/files/' + COLLECTION_NAME + '/' + item.id + '/' + item.image : '',
                    name: item.name || '',
                    x_code: item.x_code || '',
                    q_code: item.q_code || '',
                    qr_code: item.qr_code || '',
                    brand: item.brand || '',
                    specification: item.specification || '',
                    stock: item.stock || 0,
                    model: item.model || ''
                }));

                $('#my_table').DataTable({
                    data: tableData,
                    scrollY: '500px',
                    paging: true,
                    sort: false,
                    select: true,
                    columnDefs: [
                        { targets: 0, width: "100px" },
                        { targets: 1, width: "150px" },
                        { targets: 2, width: "100px" },
                        { targets: 3, width: "100px" },
                        { targets: 4, width: "100px" },
                        { targets: 5, width: "120px" },
                        {
                            targets: 6, width: "100px", className: "dt-left",
                            render: function (data, type, row, meta) {
                                if (data <= 0) {
                                    return 0 + `<span style="color:red; font-weight: bold;">0 &nbsp; Out of stock</span>`;
                                } else if (data < 20) {
                                    return `${data}` + `<span style="color: orange; font-weight: bold; font-size: 15px"> &nbsp; Low stock</span>`;
                                } else {
                                    return data;
                                }
                            }
                        },
                        { targets: 7, width: "100px" }
                    ],
                    /*
                    columns: [
                        { title: "Image" },
                        { title: "Name" },
                        { title: "XCode" },
                        { title: "QCode" },
                        { title: "QRCode" },
                        { title: "Brand" },
                        { title: "Stock" },
                        { title: "Model" }
                    ]
                        */

                    columns: [
                        {
                            title: "Image",
                            data: "image",
                            render: function (data) {
                                return `<img class="item_img_cell" src="${data}" width="50" title="Click to see more">`;
                            }
                        },
                        { title: "Name", data: "name" },
                        { title: "XCode", data: "x_code" },
                        { title: "QCode", data: "q_code" },
                        { title: "QRCode", data: "qr_code" },
                        { title: "Brand", data: "brand" },
                        {
                            title: "Stock",
                            data: "stock",
                            render: function (data) {
                                if (data <= 0) {
                                    return `<span style="color:red; font-weight:bold;">0 Out of stock</span>`;
                                } else if (data < 20) {
                                    return `<span style="color:orange; font-weight:bold;">${data} Low stock</span>`;
                                }
                                return data;
                            }
                        },
                        { title: "Model", data: "model" }
                    ]
                });

            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        fetchData();
    });

    $(document).on('click', '.item_img_cell', function () {

        const table = $('#my_table').DataTable();

        // lấy row hiện tại
        const row = $(this).closest('tr');

        // lấy full object data
        const data = table.row(row).data();

        $('#modalImage').attr('src', data.image);
        $('#modalName').text(data.name);
        $('#modalXCode').text(data.x_code);
        $('#modalQCode').text(data.q_code);
        $('#modalQRCode').text(data.qr_code);
        $('#modalBrand').text(data.brand);
        $('#modalSpecification').text(data.specification);
        $('#modalStock').text(data.stock);
        $('#modalModel').text(data.model);

        $('#itemModal').css('display', 'flex');
        $('body').css('overflow', 'hidden');
    });


    // Close modal
    $('#modalClose').on('click', function () {
        $('#itemModal').hide();
        $('body').css('overflow', 'auto');
    });


</script>

</html>
