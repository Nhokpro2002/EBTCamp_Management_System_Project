<script>

     const COLLECTION_ITEMS = "Items";
     const COLLECTION_ORDER_ITEMS = "Order_Items";
     const COLLECTION_ORDERS = "Orders";

     let itemTable = null;
     let currentItemRow = null;
     let dataExportExcel = [];

     $(document).ready(function () {

          // window.alert(window.innerWidth + " x " + window.innerHeight);
          // Spec: 1528 * 732;
          const currentPage = window.location.pathname;

          if (currentPage.includes('dashboard')) {
               document.getElementById('dashboard-link').classList.add('active');
          } else if (currentPage.includes('orders')) {
               document.getElementById('orders-link').classList.add('active');
          } else if (currentPage.includes('users')) {
               document.getElementById('users-link').classList.add('active');
          } else if (currentPage.includes('settings')) {
               document.getElementById('settings-link').classList.add('active');
          }
     });

     async function getInventoryItemData() {
          try {
               const token = localStorage.getItem("token");
               const response = await fetch(`${POCKETBASE_URL}/api/collections/${COLLECTION_ITEMS}/records`, {
                    headers: {
                         'Authorization': `Bearer ${token}`,
                         'Content-Type': 'application/json'
                    }
               });

               if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

               const result = await response.json();

               console.log('Fetched records:', result);

               const tableData = result.items.map(item => ({
                    image: item.image ? POCKETBASE_URL + '/api/files/' + COLLECTION_ITEMS + '/' + item.id + '/' + item.image : '',
                    name: item.name || '',
                    x_code: item.x_code || '',
                    q_code: item.q_code || '',
                    qr_code: item.qr_code || '',
                    brand: item.brand || '',
                    specification: item.specification || '',
                    stock: item.stock || 0,
                    model: item.model || ''
               }));

               if (itemTable) {

                    itemTable.clear();
                    itemTable.rows.add(tableData);
                    itemTable.draw();

                    return;
               }

               itemTable = $('#item_data_table').DataTable({
                    data: tableData,
                    scrollY: '500px',
                    paging: true,
                    sort: false,
                    select: true,
                    columnDefs: [
                         { targets: 0, width: "100px" },
                         { targets: 1, width: "150px" },
                         { targets: 2, width: "100px" },
                         { targets: 3, width: "100px" },
                         { targets: 4, width: "100px" },
                         { targets: 5, width: "120px" },
                         { targets: 6, width: "100px", className: "dt-left" },
                         { targets: 7, width: "100px" }
                    ],

                    columns: [
                         {
                              title: "Image",
                              data: "image",
                              render: function (data) {
                                   return `<img src="${data}" width="50" >`;
                              }
                         },
                         { title: "Name", data: "name" },
                         { title: "XCode", data: "x_code" },
                         { title: "QCode", data: "q_code" },
                         { title: "QRCode", data: "qr_code" },
                         { title: "Brand", data: "brand" },
                         {
                              title: "Stock",
                              data: "stock",
                              render: function (data) {
                                   if (data <= 0) {
                                        return `0 <span style="color:red; font-weight:bold;"> &nbsp; Out of stock</span>`;
                                   } else if (data < 20) {
                                        return `${data} <span style="color:orange; font-weight:bold; font-size: 14.5px"> &nbsp; Low stock</span>`;
                                   }
                                   return data;
                              }
                         },
                         { title: "Model", data: "model" }
                    ]
               });

          } catch (error) {
               console.error('Error fetching data:', error);
          }
     }

     $(document).on('click', '.model', function () {
          currentItemRow = $(this).closest('.item-row');
          $('#item_inventory_modal').css('display', 'flex');
          $('body').css('overflow', 'hidden');

          getInventoryItemData();
     });

     // Function close modal
     function closeModal() {
          $('#item_inventory_modal').hide();
          $('body').css('overflow', 'auto');
     }

     // Close modal
     $('#modalClose').on('click', closeModal)


     $('#item_data_table').on('click', 'tbody tr', async function () {

          // get row data when user click in
          const data = itemTable.row(this).data();

          currentItemRow.find('.model').val(data.model);
          currentItemRow.find('.item_name').val(data.name);
          currentItemRow.find('.x_code').val(data.x_code);
          currentItemRow.find('.q_code').val(data.q_code);

          closeModal();

     });

     // Add new empty row
     $('#addItemButton').on('click', function () {

          // clone first row
          const newRow = $('.item-row:first').clone();

          newRow.find('label').remove();

          // clear input
          newRow.find('.checkbox_row').prop('checked', false);
          newRow.find('.requester').val('Equipment Part');
          newRow.find('.project_name').val('');
          newRow.find('.model').val('');
          newRow.find('.item_name').val('');
          newRow.find('.x_code').val('');
          newRow.find('.q_code').val('');
          newRow.find('.description').val('');
          newRow.find('.note').val('');
          newRow.find('.unit_price').val('');
          newRow.find('.status').val('');
          newRow.find('.progress_po').val('');
          newRow.find('.requested_date').val('');
          newRow.find('.order_date').val('');
          newRow.find('.order_date').val('');
          newRow.find('.receive_date').val('');

          // append
          $('#orderForm').append(newRow);

          const Toast = Swal.mixin({
               toast: true,
               position: 'top-end',
               showConfirmButton: false,
               timer: 1000,
               timerProgressBar: true,

               didOpen: (toast) => {

                    toast.addEventListener('mouseenter', Swal.stopTimer);
                    toast.addEventListener('mouseleave', Swal.resumeTimer);

               }
          });

          Toast.fire({
               icon: 'success',
               title: 'Added row successfully'
          });


     });

     // Delete rows with checked = true
     $('#deleteItemButton').on('click', function () {

          const checkedRows = $('.checkbox_row:checked').closest('.item-row');
          if (checkedRows.length == 0) {
               Swal.fire({
                    icon: 'warning',
                    title: 'Warning',
                    text: 'Please select at least one row.'
               });

               return;
          }


          if ($('.item-row').length == 1) {
               Swal.fire({
                    icon: 'warning',
                    title: 'Warning',
                    text: 'The table must contain at least one row.'
               });

               checkedRows.find('.checkbox_row').prop('checked', false);

               return;
          }

          checkedRows.remove();

          const Toast = Swal.mixin({
               toast: true,
               position: 'top-end',
               showConfirmButton: false,
               timer: 1500,
               timerProgressBar: true,

               didOpen: (toast) => {

                    toast.addEventListener('mouseenter', Swal.stopTimer);
                    toast.addEventListener('mouseleave', Swal.resumeTimer);

               }
          });

          Toast.fire({
               icon: 'success',
               title: 'Deleted successfully'
          });

     });


     $('#resetButton').on('click', function () {

          const checkedRows = $('.checkbox_row:checked').closest('.item-row');
          if (checkedRows.length == 0) {
               Swal.fire({
                    icon: 'warning',
                    title: 'Warning',
                    text: 'Please select at least one row.'
               });

               return;
          }

          checkedRows.each(function () {
               $(this).find('.checkbox_row').prop('checked', false);
               $(this).find('.requester').val('');
               $(this).find('.project_name').val('');
               $(this).find('.model').val('');
               $(this).find('.item_name').val('');
               $(this).find('.x_code').val('');
               $(this).find('.x_code').val('');
               $(this).find('.q_code').val('');
               $(this).find('.description').val('');
               $(this).find('.note').val('');
               $(this).find('.unit_price').val('');
               $(this).find('.note').val('');
               $(this).find('.quantity').val('');
               $(this).find('.status').val('');
               $(this).find('.progress_po').val('');
               $(this).find('.requested_date').val();
               $(this).find('.order_date').val('');
               $(this).find('.receive_date').val('');
          })

     });

     // Save item_order list 
     $('#saveButton').on('click', async function () {

          try {

               const token = localStorage.getItem('token');

               const orderItems = [];

               $('.item-row').each(function () {

                    const row = $(this);

                    const item = {
                         requester: row.find('.requester').val(),
                         project_name: row.find('.project_name').val(),
                         model: row.find('.model').val(),
                         item_name: row.find('.item_name').val(),
                         x_code: row.find('.x_code').val(),
                         q_code: row.find('.q_code').val(),
                         description: row.find('.description').val(),
                         note: row.find('.note').val(),
                         unit_price: row.find('.unit_price').val(),
                         quantity: row.find('.quantity').val(),
                         status: row.find('.status').val(),
                         progress_po: row.find('.progress_po').val(),
                         order_date: row.find('.requested_date').val(),
                         order_date: row.find('.order_date').val(),
                         receive_date: row.find('.receive_date').val()
                    };

                    orderItems.push(item);
               });

               dataExportExcel = orderItems;

               console.log(orderItems);


               const savePromises = orderItems.map(async (item) => {

                    const response = await fetch(
                         `${POCKETBASE_URL}/api/collections/${COLLECTION_ORDER_ITEMS}/records`,
                         {
                              method: 'POST',
                              headers: {
                                   'Authorization': `Bearer ${token}`,
                                   'Content-Type': 'application/json'
                              },
                              body: JSON.stringify(item)
                         }
                    );

                    if (!response.ok) {

                         const errorText = await response.text();

                         throw new Error(
                              `Save failed: ${response.status} - ${errorText}`
                         );
                    }

                    return await response.json();
               });

               // đợi save hết
               const results = await Promise.all(savePromises);

               console.log("SAVE SUCCESS:", results);


               Swal.fire({
                    icon: 'success',
                    title: 'Success',
                    text: 'Save order items successfully!',
                    confirmButtonColor: '#3085d6'
               });

          } catch (error) {
               console.error("SAVE ERROR:", error);


               Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Save failed!',
                    confirmButtonColor: '#d33'
               });

          }

     });



     $('#exportExcelButton').on('click', function () {

          if (!Array.isArray(dataExportExcel) || dataExportExcel.length === 0) {
               Swal.fire({
                    icon: 'warning',
                    title: 'No data',
                    text: 'Chưa có dữ liệu để export!'
               });
               return;
          }

          const worksheet = XLSX.utils.json_to_sheet(dataExportExcel);

          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "OrderItems");

          XLSX.writeFile(workbook, "order_items.xlsx");
     });

     $('#resetButton').on('click', function () {


     });


     async function handleUpdate() {

          try {

               const token = localStorage.getItem('token');

               const checkedRows = $('.checkbox_row:checked')
                    .closest('.item-row');

               if (checkedRows.length === 0) {

                    Swal.fire({
                         icon: 'warning',
                         title: 'Warning',
                         text: 'Please select at least one row'
                    });

                    return;
               }

               const updatePromises = [];

               checkedRows.each(function () {

                    const currentItemRow = $(this);

                    let objectData = {
                         requester: currentItemRow.find('.requester').val(),
                         project_name: currentItemRow.find('.project_name').val(),
                         model: currentItemRow.find('.model').val(),
                         item_name: currentItemRow.find('.item_name').val(),
                         x_code: currentItemRow.find('.x_code').val(),
                         q_code: currentItemRow.find('.q_code').val(),
                         description: currentItemRow.find('.description').val(),
                         note: currentItemRow.find('.note').val(),
                         unit_price: currentItemRow.find('.unit_price').val(),
                         quantity: currentItemRow.find('.quantity').val(),
                         status: currentItemRow.find('.status').val(),
                         progress_po: currentItemRow.find('.progress_po').val(),
                         requested_date: currentItemRow.find('.requested_date').val(),
                         order_date: currentItemRow.find('.order_date').val(),
                         receive_date: currentItemRow.find('.receive_date').val()
                    };

                    const request = fetch(
                         `${POCKETBASE_URL}/api/collections/${COLLECTION_ORDER_ITEMS}/records/${currentItemRow.data('id')}`,
                         {
                              method: 'PATCH',
                              headers: {
                                   'Authorization': `Bearer ${token}`,
                                   'Content-Type': 'application/json'
                              },
                              body: JSON.stringify(objectData)
                         }
                    );

                    updatePromises.push(request);

               });

               await Promise.all(updatePromises);

               Swal.fire({
                    icon: 'success',
                    title: 'Success',
                    text: 'Updated selected rows successfully'
               });

          } catch (error) {

               console.error(error);

               Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Update failed'
               });

          }
     }


     const checkboxAll = document.getElementById("checkbox_all");

     checkboxAll.addEventListener("change", function () {
          const checkboxRows = document.querySelectorAll(".checkbox_row");
          checkboxRows.forEach(function (checkbox) {
               checkbox.checked = checkboxAll.checked;
          });

     });

     document.querySelectorAll('.menu-link').forEach(item => {
          item.addEventListener('click', function () {
               document.querySelectorAll('.menu-link').forEach(el => {
                    el.classList.remove('active');
               });

               this.classList.add('active');
          });
     });


</script>
