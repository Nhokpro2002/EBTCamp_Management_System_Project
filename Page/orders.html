<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders</title>

    <!-- Bootstrap 5 -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- JQuery 4.0.0-->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Sweet Alert-->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Order Page CSS -->
    <link href="../CSS/order.css" rel="stylesheet">

</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-2 d-flex flex-column p-4 sticky-top"
                style="height: 100vh; background-color: #182330; color: white;">

                <nav class="nav flex-column">
                    <a class="nav-link" href="inventory.html" id="inventory-link">
                        <i class="bi bi-boxes me-2"></i> Inventory
                    </a>

                    <a class="nav-link" id="orders-link">
                        <i class="bi bi-receipt me-2"></i> Orders
                    </a>

                    <a class="nav-link" href="project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="information.html" id="information-link">
                        <i class="bi bi-info-square-fill me-2"></i> Information
                    </a>

                    <a class="nav-link" href="user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                    </a>
                </nav>

                <!-- User Info -->
                <div class="mt-auto pt-3 border-top d-flex align-items-center">
                    <img src="../Images/avatar.png" alt="Avatar" class="rounded-circle" width="45" height="45">

                    <div class="ms-3">
                        <div class="fw-semibold" id="user-name">Nguyễn Văn A</div>
                        <small class="text-secondary" id="user-role">Engineer</small>
                    </div>
                </div>

            </div>

            <!-- Main Content -->
            <div class="col-lg-10 p-4">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1">
                            Order
                        </h3>
                    </div>
                    <button class="btn btn-success px-4" id="btnNewOrder">
                        <i class="bi bi-plus-circle me-2"></i>
                        New Order
                    </button>
                </div>

                <!-- Card -->

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th width="70">#</th>
                                        <th>Order ID</th>
                                        <th width="220">Created Date</th>
                                        <th width="150" class="text-center">Action</th>
                                    </tr>
                                </thead>

                                <tbody id="orderListTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Order Modal -->
    <div class="modal fade" id="newOrderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Create New Order
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">
                            Order Date
                        </label>

                        <input type="date" class="form-control" id="orderDate">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-success" id="btnSaveOrder">
                        Save
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="../Script/order/main.js"></script>

    <script>

        /*document
            .querySelectorAll(".btn-detail")
            .forEach(btn => {

                btn.addEventListener(
                    "click",
                    function () {
                        const id = this.dataset.id;
                        window.location.href =
                            `order_items.html?id=${id}`;
                    }
                );
            });*/


        function setupActiveMenu() {
            const currentPage = window.location.pathname;
            const map = {
                inventory: "inventory-link",
                project: "project-link",
                user: "user-link",
                order: "order-link",
            };

            Object.entries(map).forEach(([key, id]) => {
                if (currentPage.includes(key)) {
                    document.getElementById(id)?.classList.add("active");
                }
            });
        }
        setupActiveMenu();


        // Bootstrap Modal
        const newOrderModal = new bootstrap.Modal(
            document.getElementById("newOrderModal")
        );

        // Open popup
        document
            .getElementById("btnNewOrder")
            .addEventListener("click", () => {
                // mặc định là ngày hôm nay
                document.getElementById("orderDate").value =
                    new Date().toISOString().split("T")[0];

                newOrderModal.show();
            });

    </script>
</body>

</html>
