<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders</title>

    <!-- Bootstrap 5 -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- JQuery 4.0.0-->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Sweet Alert-->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Order Page CSS -->
    <link href="../CSS/order.css" rel="stylesheet">

</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-2 d-flex flex-column p-4 sticky-top" style="
              height: 100vh;
                background-color: #ffffff;
                color: #222222;
              border-right: 1px solid #e5e5e5;
                  ">

                <!-- LOGO -->
                <div class="text-center mb-4">
                    <img src="../Image/lg_display_logo_web.png" alt="Logo" style="
                width: 140px;
                height: auto;
                object-fit: contain;
             ">
                </div>

                <nav class="nav flex-column">
                    <a class="nav-link" href="inventory.html" id="inventory-link">
                        <i class="bi bi-boxes me-2"></i> Inventory
                    </a>

                    <a class="nav-link" id="orders-link">
                        <i class="bi bi-receipt me-2"></i> Orders
                    </a>

                    <a class="nav-link" href="project.html" id="project-link">
                        <i class="bi bi-tools me-2"></i> Project
                    </a>

                    <a class="nav-link" href="information.html" id="information-link">
                        <i class="bi bi-info-square-fill me-2"></i> Information
                    </a>

                    <a class="nav-link" href="user.html" id="user-link">
                        <i class="bi bi-people me-2"></i> User
                    </a>
                </nav>

                <!-- User Info -->
                <div class="mt-auto pt-3 d-flex align-items-center" style="
                       border-top:1px solid #eeeeee;
                   ">

                    <img src="../Images/avatar.png" alt="Avatar" class="rounded-circle" width="45" height="45" style="
                           border:2px solid #e60012;
                       ">

                    <div class="ms-3">

                        <div class="fw-semibold" id="user-name" style="
                color:#222;
             ">
                            Nguyễn Văn A
                        </div>


                        <small id="user-role" style="
                color:#888;
             ">
                            Engineer
                        </small>

                    </div>

                </div>

            </div>

            <!-- Main Content -->
            <div class="col-lg-10 p-4">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1">
                            Order
                        </h3>
                    </div>
                    <button class="btn btn-success px-4" id="btnNewOrder">
                        <i class="bi bi-plus-circle me-2"></i>
                        New Order
                    </button>
                </div>

                <!-- Card -->

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th width="70">#</th>
                                        <th>Order ID</th>
                                        <th width="220">Created Date</th>
                                        <th width="150" class="text-center">Action</th>
                                    </tr>
                                </thead>

                                <tbody id="orderListTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Order Modal -->
    <div class="modal fade" id="newOrderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Create New Order
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">
                            Order Date
                        </label>

                        <input type="date" class="form-control" id="createdDate">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-success" id="btnSaveOrder">
                        Save
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="../Script/order/main.js"></script>

</body>

</html>
