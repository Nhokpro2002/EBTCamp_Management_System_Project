<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order</title>

    <!-- Bootstrap -->
    <link href="../Libs/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- Sweet Alert 2 -->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- JQuery -->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- ExcelJS -->
    <script src="../Libs/ExcelJS/exceljs.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/order.css">
</head>

<body>

    <div class="wrapper">

        <!-- ===========================
                SIDEBAR
        ============================ -->

        <aside class="sidebar">
            <div class="logo">
                <img src="../Image/lg_display_logo_web.png" alt="Logo LG">
            </div>

            <ul class="menu">
                <li>
                    <a href="dashboard.html">
                        <i class="bi bi-grid"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="inventory.html">
                        <i class="bi bi-box"></i>
                        Inventory
                    </a>
                </li>

                <li class="active">
                    <a href="#">
                        <i class="bi bi-receipt"></i>
                        Order
                    </a>
                </li>

                <li>
                    <a href="project.html">
                        <i class="bi bi-kanban"></i>
                        Project
                    </a>
                </li>

                <li>
                    <a href="user.html">
                        <i class="bi bi-people"></i>
                        User
                    </a>
                </li>

                <li>
                    <a href="notification.html">
                        <i class="bi bi-bell"></i>
                        Notification
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-gear"></i>
                        Settings
                    </a>
                </li>
            </ul>

            <div class="sidebar-user">
                <img src="https://i.pravatar.cc/80?img=12">
                <div>
                    <small>Engineer</small>
                </div>
            </div>
        </aside>

        <!-- ===========================
                CONTENT
        ============================ -->
        <main class="content">
            <!-- Header -->
            <header class="topbar">
                <div>
                    <h2>Order</h2>
                    <p>
                        Order
                        <i class="bi bi-chevron-right"></i>
                        Materials
                    </p>
                </div>

                <div class="header-right">
                    <button class="btn btn-light position-relative">
                        <i class="bi bi-bell"></i>
                        <span class="badge bg-danger notification-badge">
                            3
                        </span>
                    </button>

                    <button class="btn btn-outline-danger">
                        <i class="bi bi-person-circle"></i>
                        Admin
                    </button>
                </div>
            </header>

            <!-- =======================
                    TOOLBAR
            ======================== -->
            <section class="toolbar">
                <div class="toolbar-left">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="Search material...">
                    </div>

                    <select id="brandFilter" class="form-select">
                        <option value="">All Brands</option>
                        <option value="Schneider">Schneider</option>
                        <option value="ABB">ABB</option>
                        <option value="Siemens">Siemens</option>
                        <option value="Mitsubishi">Mitsubishi</option>
                        <option value="LS">LS</option>
                        <option value="Fuji">Fuji</option>
                        <option value="Omron">Omron</option>
                    </select>

                    <select id="typeFilter" class="form-select">
                        <option value="">All Types</option>
                        <option value="HMI">HMI</option>
                        <option value="PLC">PLC</option>
                        <option value="PSU">PSU</option>
                        <option value="Relay">Relay</option>
                        <option value="Inverter">Inverter</option>
                        <option value="Aptomat">Aptomat</option>
                        <option value="Pilot Light">Pilot Light</option>
                        <option value="Servo Motor">Servo Motor</option>
                        <option value="Transformer">Transformer</option>
                        <option value="Limit Switch">Limit Switch</option>
                        <option value="Current Transformer">Current Transformer</option>
                        <option value="Solid State Relay">Solid State Relay</option>
                        <option value="Surge Protective Device">Surge Protective Device</option>
                        <option value="Emergency Stop">Emergency Stop</option>
                        <option value="Communication Module">Communication Module</option>
                        <option value="Terminal Block">Terminal Block</option>
                        <option value="Power Meter">Power Meter</option>
                        <option value="Temperature Controller">Temperature Controller</option>
                        <option value="Proximity Sensor">Proximity Sensor</option>
                        <option value="Photoelectric Sensor">Photoelectric Sensor</option>
                        <option value="MCB">MCB</option>
                        <option value="MCCB">MCCB</option>
                    </select>

                    <select id="projectFilter" class="form-select"></select>


                </div>

                <div class="toolbar-right">
                    <button id="btnAddMaterial" class="btn btn-success">
                        <i class="bi bi-plus-lg"></i>
                        Add Material
                    </button>
                </div>
            </section>

            <!-- =======================
                    TABLE
            ======================== -->
            <section class="table-card">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <!-- Fixed -->
                                <th class="fixed-col" width="40">
                                    <input type="checkbox" id="checkAll">
                                </th>
                                <th>Name</th>
                                <th>Model</th>
                                <th>XCode/QCode</th>
                                <th>Stock</th>
                                <th>Order</th>
                                <th>Unit Price</th>
                                <th>Request Date</th>
                                <th>Requester</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody id="orderTable">
                            <!-- Render by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <div class="d-flex justify-content-between align-items-center p-2 border-top">
                <span id="pageInfo" class="text-muted small"></span>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="pagination">
                    </ul>
                </nav>
            </div>

        </main>

    </div>

    <div id="inventoryModal">
        <div class="modal-content">
            <button id="btnCloseInventory" class="close-btn" aria-label="Close">
                &times;
            </button>

            <iframe id="inventoryFrame" src="inventory.html"></iframe>
        </div>
    </div>

    <div id="selectionBar" class="selection-bar d-flex justify-content-center gap-3">

        <button id="saveSelected" class="btn btn-primary">
            <i class="bi bi-download me-1"></i>
            Save
        </button>

        <button id="exportExcelSelected" class="btn btn-success">
            <i class="bi bi-file-earmark-spreadsheet me-1"></i>
            Export Excel
        </button>

        <button id="deleteSelected" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i>
            Delete
        </button>

    </div>

</body>

<script type="module" src="../Script/order/main.js"></script>

</html>
