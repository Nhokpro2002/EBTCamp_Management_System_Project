<html lang="en">

<head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />

     <link href="../CSS/bootstrap.min.css" rel="stylesheet">

     <!-- Bootstrap Icons -->

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
          crossorigin="anonymous"></script>
     <script src="../Libs/DataTables/datatables.min.js"></script>

     <style>
          body {
               background: #f4f7fb;
               font-family: 'Segoe UI', sans-serif;
          }

          .sidebar {
               min-height: 100vh;
               background: linear-gradient(180deg, #0d6efd, #0b5ed7);
               color: white;
          }

          .sidebar .nav-link {
               color: rgba(255, 255, 255, 0.85);
               padding: 12px 16px;
               border-radius: 12px;
               margin-bottom: 8px;
               transition: 0.3s;
          }

          .sidebar .nav-link:hover,
          .sidebar .nav-link.active {
               background: rgba(255, 255, 255, 0.15);
               color: #fff;
          }

          .topbar {
               background: white;
               border-radius: 20px;
               padding: 16px 24px;
               box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
          }


          .avatar {
               width: 42px;
               height: 42px;
               border-radius: 50%;
               object-fit: cover;
          }

          .model-cell,
          .name-cell {
               max-width: 150px;
               white-space: nowrap;
               overflow: hidden;
               text-overflow: ellipsis;
          }


          .note-cell,
          .description-cell {
               max-width: 250px;
               white-space: nowrap;
               overflow: hidden;
               text-overflow: ellipsis;
          }

          /*.container-fluid {
               display: none;
          }*/
     </style>
</head>

<body>

     <div class="container-fluid">
          <div class="row">

               <!-- Sidebar -->
               <div class="col-lg-2 p-4 sidebar">
                    <h3 class="fw-bold mb-5">
                         <i class="bi bi-grid-1x2-fill"></i> EBT Camp
                    </h3>

                    <nav class="nav flex-column">
                         <a class="nav-link" href="http://127.0.0.1:5500/Page/dashboard.html" id="dashboard-link">
                              <i class="bi bi-house-door me-2"></i> Dashboard
                         </a>

                         <a class="nav-link" href="http://127.0.0.1:5500/Page/inventory.html" id="inventory-link">
                              <i class="bi bi-box-seam me-2"></i> Inventory
                         </a>

                         <a class=" nav-link" href="#" id="order-link">
                              <i class="bi bi-cart me-2"></i> Order
                         </a>

                         <a class="nav-link" href="http://127.0.0.1:5500/Page/setting.html" id="setting-link">
                              <i class="bi bi-gear me-2"></i> Setting
                         </a>

                         <a class="nav-link" href="http://127.0.0.1:5500/Page/project.html" id="project-link">
                              <i class="bi bi-tools me-2"></i> Project
                         </a>

                         <a class="nav-link" href="http://127.0.0.1:5500/Page/user.html" id="user-link">
                              <i class="bi bi-people me-2"></i> User
                              <!--Nếu là Admin thì xem được thông tin của mọi người nhưng eng thì xem được thông tin của riêng họ -->
                         </a>
                    </nav>
               </div>

               <!-- Main -->
               <div class="col-lg-10 p-4">

                    <!-- Topbar -->
                    <div class="topbar d-flex justify-content-between align-items-center mb-4">
                         <div>
                              <h3 class="fw-bold mb-0">Orders Page</h3>
                              <small class="text-muted">Welcome back, User👋</small>
                         </div>

                         <div class="d-flex align-items-center gap-3">
                              <button class="btn btn-light rounded-circle">
                                   <i class="bi bi-bell"></i>
                              </button>

                              <div class="dropdown">
                                   <img src="https://i.pravatar.cc/100" class="avatar dropdown-toggle"
                                        data-bs-toggle="dropdown"
                                        style="width:40px;height:40px;border-radius:50%;cursor:pointer" />

                                   <ul class="dropdown-menu dropdown-menu-end">
                                        <li>
                                             <a class="dropdown-item" id="logoutLink" href="#">Logout</a>
                                        </li>
                                   </ul>
                              </div>
                         </div>
                    </div>

                    <!-- Content -->
                    <div class="container-fluid">

                         <table id="purchase_table" class="tabletable table-bordered table-sm">
                              <thead>
                                   <tr>
                                        <th>Name</th>
                                        <th>XCode/QCode</th>
                                        <th>Model</th>
                                        <th>Description</th>
                                        <th>Unit Price</th>
                                        <th>Quantity</th>
                                        <th>Total Price</th>
                                        <th>Requester</th>
                                        <th>Project</th>
                                        <th>Requested Date</th>
                                        <th>Order Date</th>
                                        <th>Receive Date</th>
                                        <th>Note</th>
                                        <th>Progress PO</th>
                                        <th>Status</th>
                              </thead>
                         </table>

                         <div class="d-flex justify-content-end mb-3">
                              <div class="bg-white p-3 rounded shadow-sm text-end">
                                   <div class="text-secondary">Total Order Value</div>
                                   <div id="total_order_price" style="font-size:32px;font-weight:bold;color:#0d6efd;">
                                        $0.00
                                   </div>
                              </div>
                         </div>

                    </div>
               </div>
          </div>
     </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

<script>

     const POCKETBASE_URL = "http://127.0.0.1:8090";
     const COLLECTION_USERS = "Users";
     const COLLECTION_ORDER_ITEMS = "Order_Items";

     /*
     + orderID ở đây để quản lý việc đặt mua
     + thay vì click vào item ở trang inventory để xem lịch sử đặt hàng của item đó
     + người dùng có thể xem full các mặt hàng được đặt trong list nào đó dựa theo ID
     Ví dụ: tháng 5 đặt mua một danh sách, tháng 6 đặt mua một danh sách
     trang này sẽ có option tháng 5 và tháng 6, click vào cái nào thì sẽ lấy dữ liệu xong fill vào table
     */
     let orderItemList = [] // orderItemList follow by orderID

     function checkAuthentication() {
          const token = localStorage.getItem("token");
          if (!token || token.trim() === "") {
               Swal.fire({
                    icon: 'warning',      // icon của popup: 'warning', 'error', 'success', 'info', 'question'
                    title: 'Access Denied',
                    text: 'You must log in to access this page',
                    confirmButtonText: 'Go to Login'
               }).then(() => {
                    window.location.href = "http://127.0.0.1:5500/Page/login.html"; // chuyển hướng sau khi user bấm OK
               });

               return false;

               // ngăn chặn load tiếp các script
          }
          return true;
     }


     $(document).ready(function () {

          if (!checkAuthentication()) return;

          document.querySelector(".container-fluid").style.display = "block";


          // window.alert(window.innerWidth + " x " + window.innerHeight);
          // Spec: 1528 * 732;

          const currentPage = window.location.pathname;

          if (currentPage.includes('dashboard')) {
               document.getElementById('dashboard-link').classList.add('active');
          } else if (currentPage.includes('order')) {
               document.getElementById('order-link').classList.add('active');
          } else if (currentPage.includes('user')) {
               document.getElementById('user-link').classList.add('active');
          } else if (currentPage.includes('setting')) {
               document.getElementById('setting-link').classList.add('active');
          } else if (currentPage.includes('project')) {
               document.getElementById('project-link').classList.add('active');
          }

          changeIconAvatar();

          changeTopbarText();

          fetchOrderItemData();

     });

     document.querySelectorAll('.menu-link').forEach(item => {
          item.addEventListener('click', function () {
               document.querySelectorAll('.menu-link').forEach(el => {
                    el.classList.remove('active');
               });

               this.classList.add('active');
          });
     });

     document.getElementById("logoutLink").addEventListener("click", function (e) {
          e.preventDefault(); // ngăn link reload trang
          // Xóa storage
          localStorage.clear();
          sessionStorage.clear();

          // Redirect về trang login hoặc homepage nếu muốn
          window.location.href = "http://127.0.0.1:5500/Page/login.html";
     });

     function changeIconAvatar() {
          const dropdownAvatar = document.querySelector('.dropdown img');
          const userData = JSON.parse(localStorage.getItem("user"));

          if (!dropdownAvatar || !userData) return;

          dropdownAvatar.src =
               `${POCKETBASE_URL}/api/files/${COLLECTION_USERS}/${userData.id}/${userData.avatar}?t=${Date.now()}`;
     }

     function changeTopbarText() {
          const topbarText = document.querySelector('.topbar .text-muted');
          const userData = JSON.parse(localStorage.getItem("user"));

          if (!topbarText || !userData) return;

          topbarText.textContent = `Welcome back, ${userData.employee_id} 👋`;
     }

     async function fetchOrderItemData(orderID) {


     }

     async function fetchOrderItemData() {

          try {
               const token = localStorage.getItem('token');
               const response = await fetch(`${POCKETBASE_URL}/api/collections/${COLLECTION_ORDER_ITEMS}/records`, {
                    headers: {
                         'Authorization': `Bearer ${token}`,
                         'Content-Type': 'application/json'
                    }
               });

               if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
               const result = await response.json();
               console.log('Fetched records:', result);
               orderItemList = result.items;
               renderPurchaseTable();
               updateTotalOrderPrice();
          } catch (error) {
               console.log(error);
          }
     }

     function updateTotalOrderPrice() {

          const total = orderItemList.reduce((sum, item) => {
               return sum + (Number(item.total_price) || 0);
          }, 0);

          document.getElementById('total_order_price').textContent =
               total.toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
               });
     }

     function renderPurchaseTable() {
          $('#purchase_table').DataTable({
               data: orderItemList,
               paging: true,
               searching: true,
               ordering: false,
               info: false,
               scrollX: true,

               columnDefs: [
                    { targets: 0, width: "150px" }, //Name
                    { targets: 1, width: "150px" }, //XCode/QCode
                    { targets: 2, width: "150px" }, //Model
                    { targets: 3, width: "300px" }, //Description
                    { targets: 4, width: "100px", className: "dt-left" }, //Unit Price
                    { targets: 5, width: "100px", className: "dt-left" }, //Quantity
                    { targets: 6, width: "120px", className: "dt-left" }, //Total Price
                    { targets: 7, width: "170px" }, //Requester
                    { targets: 8, width: "150px" }, //Project
                    { targets: 9, width: "150px" }, //Requested Date
                    { targets: 10, width: "150px" }, //Order Date
                    { targets: 11, width: "150px" }, //Receive Date
                    { targets: 12, width: "300px" }, //Note
                    { targets: 13, width: "120px" }, //Progress PO
                    { targets: 14, width: "150px" } // Status
               ],

               columns: [

                    {
                         title: 'Name',
                         data: 'name',
                         render: function (data) {
                              return `<div class="name-cell" title="${data}">${data}</div>`
                         }
                    },
                    {
                         title: 'XCode/QCode',
                         data: 'code',
                    },
                    {
                         title: 'Model',
                         data: 'model',
                         render: function (data) {
                              return `<div class="model-cell" title="${data}">${data}</div>`
                         }
                    },
                    {
                         title: 'Description',
                         data: 'description',
                    },
                    {
                         title: 'Unit Price',
                         data: 'unit_price'
                    },
                    {
                         title: 'Quantity',
                         data: 'quantity'
                    },
                    {
                         title: 'Total Price',
                         data: 'total_price'
                    },
                    {
                         title: 'Requester',
                         data: 'requester'
                    },
                    {
                         title: 'Project',
                         data: 'project_name'
                    },
                    {
                         title: 'Requested Date',
                         data: 'requested_date',
                         render: function (data) {
                              return data
                                   ? new Date(data).toLocaleDateString('vi-VN')
                                   : '';
                         }
                    },
                    {
                         title: 'Order Date',
                         data: 'order_date',
                         render: function (data) {
                              return data
                                   ? new Date(data).toLocaleDateString('vi-VN')
                                   : '';
                         }
                    },
                    {
                         title: 'Receive Date',
                         data: 'receive_date',
                         render: function (data) {
                              return data
                                   ? new Date(data).toLocaleDateString('vi-VN')
                                   : '';
                         }
                    },
                    {
                         title: 'Note',
                         data: 'note'
                    },
                    {
                         title: 'Progress PO',
                         data: 'progress_po'
                    },
                    {
                         title: "Status",
                         data: "status",
                         render: function (data) {

                              let bgColor = "#6C757D";

                              switch (data) {

                                   case "Request Code":
                                        bgColor = "#6C757D";
                                        break;

                                   case "Wait Pur Process":
                                        bgColor = "#FD7E14";
                                        break;

                                   case "Request PO":
                                        bgColor = "#0D6EFD";
                                        break;

                                   case "Pending Delivery":
                                        bgColor = "#6F42C1";
                                        break;

                                   case "Completed":
                                        bgColor = "#198754";
                                        break;
                              }

                              return `
            <span style="
                background-color: ${bgColor};
                color: white;
                padding: 5px 10px;
                border-radius: 8px;
                font-weight: bold;
                display: inline-block;
                min-width: 100px;
                text-align: center;
            ">
                ${data}
            </span>
        `;
                         }
                    },
               ]
          });
     }


     $(document).on(
          'change',
          '.quantity-input, .supplier-input, .status-input, .need-date-input, .note-input',
          function () {

               const id = $(this).data('id');

               const item = purchaseItems.find(
                    x => x.id == id
               );

               const row = $(this).closest('tr');

               item.quantity =
                    row.find('.quantity-input').val();

               item.supplier =
                    row.find('.supplier-input').val();

               item.status =
                    row.find('.status-input').val();

               item.needDate =
                    row.find('.need-date-input').val();

               item.note =
                    row.find('.note-input').val();

               console.log(item);

               // save pocketbase
          }
     );




</script>

</html>
