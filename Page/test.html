<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Page</title>

    <!-- DataTables-->
    <link href="../Libs/DataTables/datatables.min.css" rel="stylesheet">
    <script src="../Libs/DataTables/datatables.min.js"></script>

    <!-- Bootstrap Icons -->
    <link href="../Libs/BootstrapIcon/bootstrap-icons.css" rel="stylesheet">

    <!-- JQuery 4.0.0-->
    <script src="../Libs/JQuery/jquery-4.0.0.min.js"></script>

    <!-- Sweet Alert-->
    <link href="../Libs/SweetAlert2/sweetalert2.min.css" rel="stylesheet">
    <script src="../Libs/SweetAlert2/sweetalert2.min.js"></script>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../Libs/Bootstrap/css/bootstrap.min.css">
    <script src="../Libs/Bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- JsPlumb -->
    <link href="../Libs/JsPlumb/jsplumb.css">
    <script src="../Libs/JsPlumb/jsplumb.min.js"></script>

    <style>
        .project-card {
            width: 280px;
            border-width: 2px !important;
            border-radius: 15px;
        }

        .step-circle {
            width: 36px;
            height: 36px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar {
            width: 30px;
            height: 30px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="card border-success shadow-sm project-card">
        <div class="card-body">

            <!-- Header -->
            <div class="d-flex align-items-center mb-4">

                <div class="step-circle bg-success text-white fw-bold">
                    1
                </div>

                <h5 class="ms-3 mb-0 flex-grow-1 fw-semibold">
                    Thiết kế
                </h5>

                <i class="bi bi-check-circle text-success fs-4"></i>

            </div>

            <!-- Progress -->
            <div class="display-5 fw-bold text-success">
                100%
            </div>

            <div class="text-muted mb-4">
                Hoàn thành
            </div>

            <!-- Task -->
            <div class="d-flex align-items-center mb-3">
                <span class="small me-2">
                    Task: 12/12
                </span>

                <div class="progress flex-grow-1" style="height:6px;">
                    <div class="progress-bar bg-success" style="width:100%">
                    </div>
                </div>
            </div>

            <!-- Item -->
            <div class="d-flex align-items-center">
                <span class="small me-2">
                    Item: 18/18
                </span>

                <div class="progress flex-grow-1" style="height:6px;">
                    <div class="progress-bar bg-success" style="width:100%">
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="d-flex align-items-center mt-4">

                <div class="avatar bg-secondary-subtle text-dark">
                    NV
                </div>

                <span class="ms-2 small">
                    Nguyễn Văn A
                </span>

            </div>

        </div>
    </div>
</body>
<script>

</script>

</html>
